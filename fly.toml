# motir-core on Fly.io — the production runtime configuration (MOTIR-2387).
#
# The decision this file implements is `docs/decisions/application-hosting.md`
# (Q1: the platform and the measured alternatives; Q6: the machine pool and who
# creates it). Modelled on motir-ai/fly.toml, which has run this pattern for
# months — same org, same region, same release-command shape.
#
# ⚠️ THIS FILE CONFIGURES; IT DOES NOT PROVISION. The Fly app, its secrets and
# its machines are created by MOTIR-2386 (an operator card), and the first deploy
# is MOTIR-2392. Nothing here brings anything into existence.

app            = "motir-core"   # org `moooon` — created by MOTIR-2386, and what
                                # `fly apps list` reports as this app's OWNER
                                # (read 2026-08-07), alongside motir-ai and
                                # motir-gateway. There is no org key to set: an
                                # app's org is fixed at creation, so this line is
                                # a reading of the platform, not a request to it.
primary_region = "iad"          # Ashburn — co-located with motir-ai AND with the
                                # Neon database, which stays exactly where it is.
                                # Moving compute does not move the data: the app
                                # connects with a plain DATABASE_URL over the
                                # public internet either way (ADR Q8).

# How long Fly waits after SIGTERM before it SIGKILLs a machine (MOTIR-8184).
# Fly's default is 5 s, and the worker's drain (`scripts/worker.ts`) waits for an
# in-flight monitor token REFRESH to commit the pair the provider just rotated —
# up to `MONITOR_REFRESH_LEASE_MS` (75 s). Killed sooner, a deploy can land
# between Sentry's answer and our write, and the connection is dead until a
# person re-authorises. It is a CEILING, not a delay: the web process exits as
# soon as its open requests finish, and the worker as soon as its drain does.
# Fly caps it at 300 s. Pinned against the lease by `tests/fly-runtime-config.test.ts`.
kill_timeout = "90s"

[build]
  dockerfile = "Dockerfile"

# ── PROCESS GROUPS (MOTIR-3421) ─────────────────────────────────────────────
#
# `app` is the web process — the Next standalone server, unchanged. `worker` is
# the Postgres job engine's claim loop, which runs in its OWN group rather than
# inside the web process so job load and request serving cannot contend for one
# event loop and the two scale independently.
#
# ⚠️ DECLARING A GROUP DOES NOT CREATE A MACHINE IN IT — and yet `flyctl deploy`
# DOES. Both halves are true and the second one was learned late. This file cannot
# provision: that is the distinction its own footer draws about
# `min_machines_running`, and the one that cost motir-ai three days of an incident
# filed against the wrong service (MOTIR-2102). What closes the gap is the RELEASE,
# not this file — `flyctl deploy` reconciles the declared group set and creates the
# missing machine itself.
#
# ⚠️ CORRECTED 2026-08-25 (MOTIR-3425). This block used to say the worker group is
# brought up with `fly scale count worker=1`, an OPERATOR action, and a whole manual
# card was written around that claim. Release v131 carried the new `worker` entry and
# machine `8576143c4ee538` appeared `started` with no `fly scale count` ever run. The
# claim came from MOTIR-2386's precedent, which was about RAISING an existing group's
# count (`app`, 1 → 2) — a different operation. Growing a group is an operator action;
# INTRODUCING one is not. Deploy first, then read `fly machine list -a motir-core
# --json`; running `fly scale count` against a group already at its intended count
# risks destroying the standby rather than doing nothing.
#
# ⚠️ ADDING A GROUP HERE ALSO CHANGES WHAT THE DEPLOY GUARD EXPECTS — and that is now
# automatic rather than something to remember. `ci.yml`'s `Assert the machine pool
# against fly.toml` step runs `scripts/assert-machine-pool.mjs`, which DERIVES its
# expectation from this table plus `http_service.processes` /
# `min_machines_running` below, and compares it against the platform's own machine
# list. So a new group needs no other edit: it is expected to exist the moment it is
# declared, and the release is what makes that true.
#
# It used to need one. The guard asserted a TOTAL against the repo variable
# `FLY_EXPECTED_MACHINE_COUNT`, which MOTIR-2408 set to 2 when the pool was two app
# machines; adding `worker` made it four and nothing updated the variable, so every
# deploy ended RED on a deploy that had SUCCEEDED — for sixteen hours, and only then
# because an earlier failure had been skipping the job (MOTIR-3570). That variable is
# gone; do not reintroduce a stored count.
#
# ⚠️ Fly also adds a STANDBY machine to a single-machine group, which `fly status`
# marks with a dagger: `worker† … stopped`, *"it will take over only in case of host
# hardware failure"*. TWO rows in the group is therefore the normal steady state for a
# count of one — not a double-provision to clean up, and a stopped machine bills no
# compute. The guard counts pool members and reports standbys separately, for exactly
# this reason.
#
# ⚠️ ADDING A `[processes]` BLOCK CHANGES WHAT `http_service` MEANS. Without one,
# Fly runs the image's CMD on every machine and routes HTTP to all of them. With
# one, every group is explicit and `http_service.processes` must name the groups
# that serve traffic — omit it and Fly would route requests to the worker, which
# listens on no port. `processes = ["app"]` below is that declaration and is not
# optional.
#
# ⚠️ THE WORKER'S COMMAND IS A BUNDLE, NOT A SOURCE FILE. The runtime image is a
# Next standalone output whose `node_modules` is the minimal set Next traced for
# the SERVER's entries; `lib/` source arriving there at all is a tracing side
# effect the Dockerfile explicitly refuses to depend on. So `pnpm build:worker`
# esbuilds the entrypoint and its `lib/**` imports into one self-contained file
# staged at `/app/worker/worker.mjs`, exactly as `/app/migrate` stages its own
# Prisma CLI, and for the same reason.
[processes]
  app    = "node server.js"
  worker = "node worker/worker.mjs"

[deploy]
  # Migrations run HERE, not in the image build — Fly runs this once per deploy
  # in a temporary machine built from the same image, before any new machine
  # takes traffic, so a migration cannot race a half-rolled-out release.
  #
  # It is NOT a bare `prisma migrate deploy`, and not a `pnpm` invocation: the
  # standalone image has neither pnpm nor a CLI on PATH. `release-migrate.mjs`
  # runs the whole lane out of /app/migrate — the self-contained directory the
  # Dockerfile stages, holding the Prisma CLI, prisma.config.ts and the
  # migrations — and reuses the build lane's P1001 retry wrapper, because Neon's
  # compute suspends when idle and a cold connection fails a second before it
  # would have succeeded. A release command that exits non-zero rolls the deploy
  # back, so that retry matters more here than it does in a build.
  release_command = "node /app/migrate/release-migrate.mjs"

  # ⚠️ BLUEGREEN, SO ONE RUNNING MACHINE DOES NOT MEAN A GAP ON EVERY DEPLOY
  # (2026-10-16, owner decision). Fly's default `rolling` strategy replaces each
  # machine IN PLACE: stop the old one, start the new one on the same machine. With
  # one running `app` machine and the spare suspended, that is an outage for the
  # restart. `bluegreen` starts the new machines BESIDE the old ones, waits for
  # their health checks to pass, moves traffic, then destroys the old ones. The
  # check it waits on is `/api/health/ready` under [[http_service.checks]].
  #
  # WHAT THE DOCS AND flyctl's SOURCE SAY (read 2026-10-16; the docs are silent on
  # most of it, so the answers below are from `internal/command/deploy/
  # strategy_bluegreen.go` on flyctl master, read through a summariser, not run):
  #  - REQUIRES A CHECK. docs.fly.io/reference/configuration: "You need to configure
  #    at least one health check to use the `bluegreen` strategy." `app` has one
  #    ([[http_service.checks]] above). Without any machine having a check the
  #    deploy refuses with "app not in valid state for bluegreen deployments".
  #  - THE WORKER HAS NO CHECK, AND THAT IS ONLY A WARNING. A machine with no
  #    configured check logs "[WARN] Machine … doesn't have healthchecks setup. We
  #    won't check its health." and is waited on for the STARTED state alone. It
  #    does not hang the deploy.
  #  - A STOPPED SPARE STAYS STOPPED. Each old (blue) machine gets a green copy that
  #    inherits "skip launch", so a stopped blue yields a stopped green and no idle
  #    machine is woken. flyctl force-starts one green per process group ONLY when
  #    none in that group would start on its own; `app` has a running machine.
  #  - A SUSPENDED SPARE IS NOT MENTIONED IN THE DOCS OR THE SOURCE, SO IT WAS RUN.
  #    A throwaway Fly app (2026-10-16, destroyed afterwards) copied this shape: an
  #    `app` group with an HTTP check, a check-less `worker` group, two `app`
  #    machines with one SUSPENDED, `strategy = "bluegreen"`, `auto_stop_machines =
  #    "suspend"`. A deploy of a new image, with a request every 0.4 s through it:
  #      * 103 of 103 requests answered 200 across the ~64 s window (no gap);
  #      * the check-less worker produced the `[WARN] … doesn't have healthchecks`
  #        line and the deploy finished;
  #      * the suspended spare WAS given a green copy, and that copy ended `stopped`
  #        (not suspended) on the new image; one `app` machine running, one `app`
  #        stopped, one worker, no old machines left. So the spare comes back COLD,
  #        not from a snapshot, which also removes the stale-connection concern for
  #        a machine freshly deployed (a later idle period re-suspends it).
  #    NOT TESTED: the spare waking on `soft_limit` (nginx never reaches 60 in
  #    flight), and a deploy of THIS app (a 2 GB Next.js image, a release command).
  #  - NO VOLUMES. Neither canary nor bluegreen works with volumes; this app has none.
  #  - ORDER: greens start (not registered for traffic) -> health -> uncordoned ->
  #    blues cordoned after 10 s -> stopped after another 10 s -> destroyed. Failure
  #    at any step rolls back to the previous release.
  #  - KNOWN FLAKINESS, REPORTED NOT REPRODUCED: Fly's community forum has posts of a
  #    bluegreen deploy leaving two image versions running, and one reporting both
  #    colours destroyed. CI installs flyctl@master, so the stopped-machine bug fixed
  #    in 0.1.119 is long gone. `scripts/assert-machine-pool.mjs` runs after every
  #    deploy and fails the job on a missing or stopped `app` machine, which is the
  #    net for both reports.
  #
  # STILL UNVERIFIED HERE: that THIS app's first deploy behaves like the test one
  # (a much larger image, the release command). TRIGGER: the first deploy after this
  # lands. Run
  #   while true; do curl -s -o /dev/null -w '%{http_code} ' \
  #     https://<app host>/api/health/ready; sleep 0.5; done
  # through it; any non-200 means a gap, and `fly machine list` afterwards should
  # show one `app` image version. If it misbehaves, delete the `strategy` line and
  # deploys return to `rolling`.
  strategy = "bluegreen"

[env]
  PORT = "8080"
  # HOSTNAME=0.0.0.0 is set in the Dockerfile rather than here, because getting
  # it wrong is silent: Next's standalone server binds the CONTAINER HOSTNAME by
  # default, the process reports "✓ Ready", and nothing outside can reach it.
  # Verified the hard way during the spike (MOTIR-2383).
  # The private Prometheus port for every request's transaction wait and hold
  # (MOTIR-8553, `lib/monitoring/metricsServer.ts`). Unset ⇒ no port is opened,
  # which is the self-host and local default; [[metrics]] below is its scrape.
  MONITORING_METRICS_PORT = "9091"

# Fly's managed Prometheus scrapes this port every 15 s (MOTIR-8553). Queries:
# `docs/monitoring/request-db-timing.md`.
#
# ⚠️ IT IS NOT PUBLIC. The port is not in [http_service], so Fly's proxy routes
# no outside traffic to it; only Fly's scraper reaches it, over the private
# network.
#
# ⚠️ THIS FILE CLAIMS THE SCRAPE, IT DOES NOT PROVE IT (this file's own rule):
# reading back from Fly's Prometheus that `app` machines are scraped is the
# read-back task under MOTIR-8537, not this line.
#
# Cost: Fly's metrics docs (https://docs.fly.io/monitoring/metrics, read
# 2026-10-14) say "There's currently no additional charge for the managed
# Prometheus and Grafana", with ~15 days of retention, a 16 MB cap on the
# endpoint's response, and a warning that very high-cardinality custom metrics
# may be dropped. Cardinality here is bounded by code: four routes plus
# `unlabelled`, the registered MCP tool names plus `other`, and the closed
# context/outcome/attempt sets.
[[metrics]]
  port      = 9091
  path      = "/metrics"
  processes = ["app"]

[http_service]
  internal_port        = 8080
  force_https          = true
  # REQUIRED now that [processes] exists (see its block above): only the web
  # group serves HTTP. Without this line Fly would route requests to `worker`,
  # which listens on no port — and every knob below would silently become a
  # policy over the wrong machines.
  processes            = ["app"]
  # ⚠️ These two knobs are POLICY OVER MACHINES THAT ALREADY EXIST. Fly's proxy
  # never CREATES one: auto_start starts an existing STOPPED machine and nothing
  # more, and `flyctl deploy` updates the machines that exist without adding any
  # to a group that already has one. (It DOES create the first machine of a newly
  # declared group — the [processes] block above.)
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  # ⚠️ 2, AND IT IS AN AVAILABILITY DECISION — NOT A CAPACITY ONE (MOTIR-2785,
  # executing `docs/decisions/application-hosting.md` Amendment 7 §14).
  #
  # This was 1, and 1 meant ONE MACHINE WAS A SINGLE POINT OF FAILURE whatever
  # the pool said. The spare is only started by the proxy when load crosses
  # `soft_limit` — never when its sibling dies, is redeployed, or OOMs. And
  # `min_machines_running` is not a failover guarantee even at 2: if a running
  # machine dies, `flyd` RESTARTS that machine, with boot latency; nothing takes
  # over. Two machines RUNNING is the only configuration that survives losing one
  # without a user-visible gap, and this app serves interactive page loads.
  #
  # MEASURED, not assumed (2026-08-20, Machines API `events[]` for the spare
  # `7817663f103648`): it DOES start — a deploy started it at 12:29:18Z — and the
  # PROXY stopped it at 12:34:58Z, five minutes forty seconds later. So from
  # 12:35Z onward this app served its entire load from one machine. The pool is
  # not decoration; what it does not do is stay up.
  #
  # COST: +$11.83/mo (a second `shared-cpu-2x` 2 GB, Fly pricing 2026-08-13),
  # taking the running pair to $23.66/mo. And NO database cost — but NOT because
  # motir-core has no in-process poll. It HAS one: the `worker` process group
  # below polls Postgres every ≤ 5 s (`IDLE_MAX_MS`, `lib/jobs/engine/worker.ts`),
  # so the Neon compute is always on (≈ $19.50/mo, accepted in
  # `docs/decisions/always-on-database-job-cadence.md`, MOTIR-6893). These web
  # machines add no poll of their own — every `setInterval` here is in a
  # `'use client'` module, and scheduled work is claimed by the worker — so a
  # second app machine adds no database cost to a compute that is already awake.
  # (This used to read "Amendment 7 §21 is the standing argument against ever
  # adding an in-process poll here", and before MOTIR-3418 "scheduled work arrives
  # via Inngest over HTTP". The worker's poll made both obsolete.)
  min_machines_running = 1
  # ⚠️ ONE `app` MACHINE RUNS; THE OTHER IS SUSPENDED AND WAKES ON LOAD (2026-10-16,
  # owner decision, REVERSING MOTIR-2785's floor of 2). The trade is availability for
  # cost: with one running machine, a crash or a restart is a gap until the proxy
  # starts the suspended one (a suspended machine resumes from a memory snapshot, so
  # it is faster than a cold boot, but it is not instant). MOTIR-2785's own
  # measurement is why this is a decision and not a default: "a pool of two with a
  # floor of one is a single point of failure — the spare wakes on load, never on its
  # sibling dying."
  #
  # ⚠️ A RESUMED MACHINE'S PG CONNECTIONS ARE STALE. Neon closes idle connections, so
  # the first requests on a freshly resumed machine may hit dead sockets until the
  # pool replaces them. NOT MEASURED. TRIGGER: watch the first minute after a wake
  # for connection resets in `fly logs`; if they appear, use `stop` instead of
  # `suspend` below (a cold boot opens a fresh pool).

  # ⚠️ `requests` IS the right signal for this app and the NUMBERS ARE NOT
  # MEASURED (Amendment 7 §15). Human web sessions are short requests, so HTTP
  # concurrency genuinely is the load here — unlike motir-ai, whose load is jobs,
  # or motir-gateway, which holds a connection open for a whole completion.
  #
  # 200/250 has never been measured against a 2x shared-CPU box running Next.js.
  # It is an ESTIMATE, labelled as one so nobody reads it as a reading.
  # TRIGGER to revise: the first sustained request-concurrency or p95-latency
  # reading from Fly metrics. Changing it now would be a measurement with nothing
  # behind it — the failure ADR section 10 already names.
  # ⚠️ THE SPARE WAKES ON REQUEST CONCURRENCY, NOT ON CPU. The owner asked for "wake
  # at N% CPU, N = 60". Fly's proxy cannot do that: it only counts requests or
  # connections against `soft_limit`. A CPU trigger is a separate app (Fly's metrics
  # autoscaler reading the managed Prometheus) and is not wired here. `soft_limit`
  # is the stand-in: 60 concurrent requests is an ESTIMATE of ~60% of one
  # performance-1x core on an agent-dominated mix (the epic's ~500 req/s per
  # instance at ~100 ms is ~50 in flight). It was 200 for a shared-cpu-2x box and,
  # like that number, it has never been measured. TRIGGER to revise: the baseline
  # run (MOTIR-8541) and the sizing task (MOTIR-8545).
  [http_service.concurrency]
    type       = "requests"
    soft_limit = 60
    hard_limit = 150

  # ⚠️ A NEW MACHINE TAKES NO TRAFFIC UNTIL IT IS WARM (MOTIR-8231). Without a
  # check, Fly routed requests to a freshly deployed `app` machine the moment it
  # accepted connections on 8080 — before Next had loaded a route module and
  # before the lazy `pg.Pool` had opened a connection. The first burst (GitHub
  # webhooks, which keep arriving through a rollout) paid for both at once, and a
  # 2 s `maxWait` ran out at uptime 15 s on a pool that was not full, only cold.
  #
  # `/api/health/ready` answers 503 until it has loaded the webhook route's
  # service graph and opened its pool's warm-up connections, then 200 for the
  # life of the process (`lib/services/readinessService.ts`). Fly's docs: "If a
  # Machine fails its service check, it will be marked as unhealthy by the proxy"
  # and "it won't be routed to until its checks start passing"
  # (docs.fly.io/reference/health-checks). The first check STARTS the warm-up and
  # answers 503, so a machine is admitted on a later one — `interval` sets how
  # long that takes. `grace_period` only stops a check landing before the server
  # listens. Pinned by `tests/fly-runtime-config.test.ts`.
  [[http_service.checks]]
    grace_period = "5s"
    interval     = "5s"
    timeout      = "4s"
    method       = "GET"
    path         = "/api/health/ready"

# ── The intended machine count is 2, and THIS FILE CANNOT CREATE IT ──────────
#
# ADR Q6 decides a pool of TWO machines: with one, `auto_start_machines` has
# nothing to start and `soft_limit` can never fire, so both settings above are
# decoration — and every rolling deploy and every Fly host drain is a full,
# user-visible outage.
#
# The count is created by `fly scale count 2`, an OPERATOR action owned by
# MOTIR-2386, and read back FROM THE PLATFORM (`fly status` /
# `GET https://api.machines.dev/v1/apps/<app>/machines`) by MOTIR-2392 and, on every
# release since MOTIR-3570, by the deploy guard named in the [processes] block above.
# `min_machines_running` above is a floor on how many of an existing pool stay
# warm; it is not a request for a pool, and no key in this file is. (It reads 2
# since MOTIR-2785 — the POOL is still created by the command above, and the
# FLOOR is what this file sets. Confusing the two is the whole reason this
# paragraph exists.)
#
# This paragraph is deliberately an INTENT and not an assertion. motir-ai's
# fly.toml stated the same intent in the indicative and ran ONE machine for weeks
# because no card ever ran the command — three days of an incident filed against
# the wrong service, closed by one authenticated GET (MOTIR-2102, planning bug
# MOTIR-2106). A config file is a claim about the deployment, not a reading of it.
#
# Cost, from Fly's published pricing (2026-08-07): shared-cpu-2x 2 GB =
# $11.83/machine/month → ~$24/month for the pair, plus $0.02/GB outbound.
# ⚠️ UPDATED by MOTIR-2785: this used to end "the standby machine is stopped in
# steady state ... so the always-on cost is the one warm machine." That was true
# at a floor of 1 and is FALSE at 2 — BOTH machines now stay warm, deliberately,
# and the always-on cost is the full $23.66/mo. That is what availability costs
# here, and it is bought rather than inherited.
#
# ⚠️ The VM size below is INHERITED from motir-ai, not measured for this app. The
# spike could size the artifact (375 MB) but not the resident set; MOTIR-2392
# takes the first real memory reading (ADR §10).
#
# FIRST READING, 2026-08-20 (MOTIR-2785, ADR Amendment 7 section 12): `next-server`
# resident 399,732 kB = 390 MB, of MemTotal 2,015,600 kB (~1.92 GiB usable) —
# about 4.9x headroom. Taken with `fly ssh console -a motir-core --machine
# 83d1300b7460e8` reading `/proc/*/status` VmRSS.
# ⚠️ AT IDLE, so it sizes the BASELINE and says nothing about load. ADR section 10's
# trigger asks for a SUSTAINED reading and has therefore NOT fired — this is
# recorded so the trigger has something to fire against, which for eleven days it
# did not.
# ⚠️ ONE `[[vm]]` PER PROCESS GROUP — and the split exists because WITHOUT it the
# worker inherits the WEB TIER'S SIZE (MOTIR-3425's own cost check, 2026-08-25).
#
# A `[[vm]]` block with no `processes` key applies to EVERY group. So the moment
# `[processes]` gained a `worker` entry, a worker machine became a
# `shared-cpu-2x` / 2 GB — the same box as a web machine, sized for Next.js SSR
# at a 390 MB resident set — at $11.83/mo, which is the cost of adding a THIRD
# web machine to run a queue poller.
#
# MOTIR-3425 names that outcome as a stop condition in its own words: *"if the
# machine size the process group inherits is larger than intended, stop and
# re-scope rather than absorbing the spend silently."* It fired. This is the
# re-scope.
# ⚠️ THE `app` GROUP IS `performance-1x`, NOT `shared-cpu-2x` (2026-10-16).
# A shared CPU can be taken away from the VM by the host. MEASURED on 2026-10-15
# 23:36–23:43Z from Fly's managed Prometheus: machine 876934a003d658 (host a3b3)
# showed `fly_instance_cpu{mode="steal"}` going from ~20 to 3,000–7,700 in two
# bursts, and the app's event loop froze for 17.3 s with `loop_block_frame=not_in_js`
# (Sentry, `GET /api/workbench/stream` and `/window`). The other `app` machine
# (host 8487) and the worker stayed at 0–10 over the same minutes. Those freezes
# made the health check fail (`/api/health/ready` does not touch the database) and
# expired every transaction open at the time (P2028). Pool wait was 0 and GC was
# ~6 s in ~1,000 s, so neither was the cause. A dedicated CPU is the remedy under
# test, not a proven fix: if steal still appears on `performance`, this is the
# wrong lever and MOTIR-8544's diagnosis stands as written.
#
# 2 GB is kept: `auto_stop_machines = "suspend"` below only works on machines of
# 2 GB or less.
[[vm]]
  size      = "performance-1x"
  memory    = "2gb"
  cpus      = 1
  processes = ["app"]

# The WORKER, sized on a MEASUREMENT rather than on a guess or on the web tier.
#
# MEASURED 2026-08-25, running the shipped bundle (`.worker/worker.mjs`, the same
# artifact the Dockerfile stages) against a real Postgres, reading `/proc/<pid>/status`:
#
#   VmRSS  286 MB steady   ·   VmHWM (peak) 310 MB   ·   sampled every 5 s for 30 s
#
# ⚠️ THAT IS AN IDLE READING, and it is labelled as one. It sizes the BASELINE —
# the bundle inlines Prisma and the whole service bag — and says nothing about a
# worker executing several handlers at once. 1 GB gives ~3.3x headroom over the
# idle peak, comparable to the app group's measured 4.9x (see the pool comment
# above), which is the only defensible way to pick a number here.
#
# TRIGGER to revise: the first sustained memory reading from a worker under real
# job load, taken from the platform. Until then this is a floor set on one
# controlled measurement, not a capacity claim.
#
# ⚠️ THE WORKER IS `performance-1x` TOO, NOT `shared-cpu-1x` (MOTIR-10119, 2026-10-30).
# A shared-cpu-1x is guaranteed 1/16 of a core and runs on a burst balance. During
# CI bursts (341–1,140 `system.ci-runner-boot` runs an hour) the worker drained it
# and Fly throttled the machine, which Fly reports as `steal`. MEASURED from Fly's
# managed Prometheus, median 1 GB machine per hour, 2026-10-29 19:00 to 10-30 17:00Z:
# `fly_instance_cpu{mode="steal"}` at 70–92% of a core in every burst hour, against
# 0.4–22% when quiet, while the worker itself used only 9–22% `user`. A throttled
# process is frozen (`loop_block_frame=not_in_js`), so Prisma's 2 s / 5 s
# transaction timers elapsed with idle connections in the pool. 367 of 12,771 boots
# failed with P2028 over three days and dead-lettered (MOTIR-9635). It is the same
# shape the `app` group showed on 2026-10-15, and the same remedy: a dedicated CPU
# is not quota-throttled. If steal still appears here, this is the wrong lever.
#
# 2 GB because a performance-1x comes with no less. That is more than the 1 GB the
# idle reading above asked for, not a new memory finding.
[[vm]]
  size      = "performance-1x"
  memory    = "2gb"
  cpus      = 1
  processes = ["worker"]

# ── What this file does NOT solve, and must not pretend to ──────────────────
#
# 1. PER-PR PREVIEW DEPLOYMENTS are DROPPED (ADR Q4). Vercel gave these free;
#    Fly does not. This is the single genuine loss in the move, and it is a
#    recorded decision rather than an omission.
#
# 2. @vercel/blob → Tigris (ADR Q2) is MOTIR-2389's code change, and the two
#    buckets are MOTIR-2386's to create. Nothing here reads blob storage.
#
# 3. STATIC ASSET EGRESS. Vercel's CDN was bundled into the plan; here the app
#    serves its own static output and pays $0.02/GB (ADR Q7).
#
# 4. THE DATABASE BILL. `prodect-db` is a Vercel-MANAGED Neon resource, so Vercel
#    invoices it even with nothing hosted there. Moving it is MOTIR-2391, and it
#    has an ordering hazard that belongs to that card: ⚠️ do NOT uninstall the
#    Vercel integration first — Neon's docs say the Neon ORGANIZATION is deleted
#    when the integration is uninstalled.
