services:
  postgres:
    # pgvector/pgvector (Postgres + pgvector preinstalled) — Story MOTIR-2694 ·
    # Subtask MOTIR-2696 adds `work_item_embedding`, whose migration runs
    # `CREATE EXTENSION vector`; the vanilla `postgres:16-alpine` this used to run
    # does not ship the extension, so that migration fails on it outright. Same PG
    # major, so this is an image swap and not an upgrade.
    #
    # ⚠️ RECREATE THE VOLUME, not just the container:
    #   docker compose down -v && docker compose up -d postgres
    # The extension files live in the IMAGE, so `--force-recreate` alone would
    # get you pgvector — but it would ALSO leave a data directory that
    # `postgres:16-alpine` initialised, and that is not safe here. Alpine is musl,
    # which has no real locale support, so its `en_US.utf8` collated by BYTE.
    # This image is glibc, where `en_US.utf8` is dictionary collation — the same
    # directory would silently start sorting differently and every btree index on
    # a text column would be inconsistent with its own comparator. A fresh volume
    # gets the pinned locale below instead.
    #
    # `motir-ai` hit the extension half of this in 20260624000000_enable_pgvector
    # and made the same move (its `docker-compose.yml` carries that note). Keep
    # this tag in sync with `.github/actions/postgres`'s `image-repository` /
    # `image-tag` defaults — that action's inputs say so too.
    #
    # ⚠️ POSTGRES 18, PRODUCTION'S MAJOR (18.6 on both production databases,
    # MOTIR-10221). A PostgreSQL 16 data directory does not start under 18, and
    # the 18 image moved its data directory: PGDATA is now
    # `/var/lib/postgresql/18/docker`, and the entrypoint REFUSES to start while
    # anything is mounted at the old `/var/lib/postgresql/data`. So the volume is
    # mounted at `/var/lib/postgresql` and has a NEW name, `prodect-pg18-data`:
    # an existing 16 volume is left untouched instead of half-reused, and the
    # first `docker compose up` initialises an empty 18 cluster with the pinned
    # locale below. README.md § *Local setup* says what to do with the old one.
    image: pgvector/pgvector:pg18
    container_name: prodect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prodect
      POSTGRES_PASSWORD: prodect
      POSTGRES_DB: prodect
      # ⚠️ THE COLLATION IS PINNED TO PRODUCTION'S, AND IT IS LOAD-BEARING.
      # Neon runs `datcollate = 'C.UTF-8'` (verified 2026-08-12 against the
      # production instance), i.e. BYTE ordering — and this repo's ordering
      # depends on that: `lib/workItems/positioning.ts` mints base-62 fractional
      # keys for `work_item.position` / `backlogRank` / every `*.position`
      # column, and base-62 mixes cases (`Zz` < `a0`). Under glibc's default
      # `en_US.utf8` a dictionary collation ignores case at the primary level and
      # `ORDER BY position` returns a DIFFERENT order — boards, backlogs, sprint
      # ranking and custom-field options all reorder.
      #
      # The alpine image matched production only by accident (musl collates by
      # byte whatever the locale says), so this was never expressed until the
      # image moved to glibc and eleven ordering tests went red across three
      # shards. Pinning it makes the agreement deliberate and checkable —
      # `tests/db-collation.test.ts` asserts it at runtime.
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8'
    ports:
      # Host 5433 (port 5432 is reserved for other local Postgres instances).
      # Container port stays 5432 so Postgres tooling inside the container is unaffected.
      - '5433:5432'
    volumes:
      - prodect-pg18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prodect -d prodect']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

volumes:
  prodect-pg18-data:
