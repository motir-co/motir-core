AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Motir CONTAINER RELEASE — one per (repository, environment) (stack
  motir-release-<appRef>). An ECS cluster and a Fargate service named the
  release's appRef, its task definition (replaced revisions RETAINED, the
  rollback target), a target group with the manifest's health check, and ONE
  listener rule on the network's shared listener that forwards only a request
  carrying the app's X-Motir-Origin-Secret header - derived per app, so it names
  the app as well as admitting it. It creates no load balancer and no listener:
  there is one per account, the network's, reached through its front door.
  The release's plain variables are task `environment` entries and its secret
  ones task `secrets` entries, one per variable, reading the stack's own
  environment secret at the version ConfigHash names; the caller writes both
  lists into this template at the markers, and the secret's value. A first apply
  with an empty ConfigHash creates no task definition and no service, so the
  caller can write that value before a task starts. Under OriginAccess=open
  (MOTIR-12128, a taken-over app) the secret rule stays, so Motir's edge keeps
  answering, and the stack adds a second rule matching X-Motir-App = AppRef and
  its OWN CloudFront distribution, on the network's VPC origin, that sets that
  header itself: the app answers at that distribution without Motir.

Parameters:
  OrganizationId:
    Type: String
    Description: The Motir organisation (tag motir:organization).
    AllowedPattern: '^[a-z0-9]+$'
  RepositoryId:
    Type: String
    Description: The Motir repository id (tag motir:repository).
    AllowedPattern: '^[a-z0-9]+$'
  AppRef:
    Type: String
    Description: The release's app name, mh-<rid> or mh-<rid>-pr<n> - the service's name.
    AllowedPattern: '^mh-[a-z0-9]+(-pr[0-9]+)?$'
    MaxLength: 63
  Environment:
    Type: String
    AllowedValues: [production, preview]
  ImageUri:
    Type: String
    Description: The release's image in the registry stack's repository, by digest.
  IdlePolicy:
    Type: String
    Default: always_on
    Description: A container is always on; `suspend` is refused before the stack is applied.
    AllowedValues: [always_on]
  TaskCpu:
    Type: String
    Description: Fargate CPU units, from the size table (256 is 0.25 vCPU).
    AllowedValues: ['256', '512', '1024']
  TaskMemory:
    Type: String
    Description: Fargate memory in MiB, from the size table.
    AllowedValues: ['512', '1024', '2048']
  Port:
    Type: Number
    Default: 8080
    Description: The port the app listens on.
  HealthCheckPath:
    Type: String
    Default: /
    Description: The target group's health check path.
  VpcId:
    Type: String
    Description: The network stack's VpcId output.
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: The network stack's PrivateSubnetIds output.
  AppSecurityGroupId:
    Type: String
    Description: The network stack's AppSecurityGroupId output.
  AlbListenerArn:
    Type: String
    Description: The network stack's AlbListenerArn output - the listener the rule joins.
  ListenerRulePriority:
    Type: Number
    Description: The rule's priority on the shared listener, unique per app.
    MinValue: 1
    MaxValue: 50000
  OriginSecret:
    Type: String
    NoEcho: true
    Description: The app's origin secret, derived by the caller (deriveOriginSecret); never computed here.
  OriginAccess:
    Type: String
    Default: motir_edge
    AllowedValues: [motir_edge, open]
    Description: >-
      Who reaches the app. motir_edge: only a request carrying the origin secret,
      through the network's front door (Motir's edge). open: that too, and every
      request through this stack's own distribution (OpenUpstreamUrl). A deploy
      resends the stack's current value.
  OpenListenerRulePriority:
    Type: String
    Default: ''
    AllowedPattern: '^([1-9][0-9]{0,4})?$'
    Description: >-
      The open rule's priority on the shared listener, unique per rule (1-50000);
      empty unless OriginAccess is open.
  FrontDoorVpcOriginId:
    Type: String
    Default: ''
    Description: >-
      The network stack's FrontDoorVpcOriginId output - the VPC origin the open
      distribution reaches the load balancer through; empty unless open.
  AlbDnsName:
    Type: String
    Default: ''
    Description: The network stack's AlbDnsName output - the open distribution origin's name; empty unless open.
  DatabaseSecretArn:
    Type: String
    Default: ''
    Description: The environment's database connection secret (key `url`), or empty.
  ConfigHash:
    Type: String
    Default: ''
    Description: >-
      A hash of the release's variables, and the id of the environment secret's
      version holding them; a change registers a new task definition revision.
      Empty: no task definition or service yet.

Conditions:
  HasDatabase: !Not [!Equals [!Ref DatabaseSecretArn, '']]
  Published: !Not [!Equals [!Ref ConfigHash, '']]
  Open: !Equals [!Ref OriginAccess, open]

Resources:
  # The release's secret variables as one JSON object; the caller writes the value.
  EnvironmentSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - motir/${AppRef}/environment-${Suffix}
        - Suffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      Description: The release's secret environment variables.
      SecretString: '{}'
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /motir/hosting/${AppRef}
      RetentionInDays: 30
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AppRef
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # Pulls the image, writes the log group, reads the release's own secrets.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub motir-${AppRef}-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/mh/${RepositoryId}/*
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasDatabase
                  - [!Ref EnvironmentSecret, !Ref DatabaseSecretArn]
                  - [!Ref EnvironmentSecret]
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # The app's own identity: no permissions until an app needs one.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub motir-${AppRef}-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # A replaced revision is RETAINED: the rollback target.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: Published
    UpdateReplacePolicy: Retain
    Properties:
      Family: !Ref AppRef
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref Port
              Protocol: tcp
          Environment:
            - { Name: PORT, Value: !Ref Port }
            - { Name: MOTIR_ENVIRONMENT, Value: !Ref Environment }
            # <release variables>
          # Secrets reach the task only as `secrets` entries, by ARN.
          Secrets:
            - !If
              - HasDatabase
              - { Name: DATABASE_URL, ValueFrom: !Sub '${DatabaseSecretArn}:url::' }
              - !Ref AWS::NoValue
            # <release secrets>
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: !Ref Port
      VpcId: !Ref VpcId
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # Forward only a request carrying the app's origin secret; everything else
  # falls to the listener's fixed 403. No host condition (MOTIR-11846): every
  # request arrives from the network's front door with the load balancer's own
  # name as Host, and the secret, HMAC-derived from the app's name, already
  # tells one app from every other.
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Motir-Origin-Secret
            Values: [!Ref OriginSecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # THE OPEN MODE (MOTIR-12128). The app's own name cannot route a request at the
  # load balancer: it is internal, and the network's distribution replaces Host
  # with the load balancer's name. So the open distribution below sets a header
  # that is not a secret, X-Motir-App, to the app's name, and this rule matches
  # it. CloudFront overwrites a viewer header of an origin custom header's name,
  # so a viewer of the open distribution cannot pick another app.
  OpenListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: Open
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: !Ref OpenListenerRulePriority
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Motir-App
            Values: [!Ref AppRef]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # The app's own https address while it is open, on the network's VPC origin
  # (one VPC origin may back several distributions), cached and forwarded
  # exactly as the network's front door is.
  OpenFrontDoor:
    Type: AWS::CloudFront::Distribution
    Condition: Open
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Motir open front door - ${AppRef}
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: load-balancer
            DomainName: !Ref AlbDnsName
            OriginCustomHeaders:
              - HeaderName: X-Motir-App
                HeaderValue: !Ref AppRef
            VpcOriginConfig:
              VpcOriginId: !Ref FrontDoorVpcOriginId
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: load-balancer
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed CachingDisabled.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed AllViewerExceptHostHeader.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  Service:
    Type: AWS::ECS::Service
    Condition: Published
    DependsOn: ListenerRule
    Properties:
      ServiceName: !Ref AppRef
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      # Always on: the container shape has no scale to zero.
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref AppSecurityGroupId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref Port
          TargetGroupArn: !Ref TargetGroup
      PropagateTags: SERVICE
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ServiceArn:
    Condition: Published
    Value: !Ref Service
  ServiceName:
    Condition: Published
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Condition: Published
    Value: !Ref TaskDefinition
  TargetGroupArn:
    Value: !Ref TargetGroup
  EnvironmentSecretArn:
    Value: !Ref EnvironmentSecret
  OpenUpstreamUrl:
    Condition: Open
    Value: !Sub https://${OpenFrontDoor.DomainName}
