AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Motir FUNCTION RELEASE — one per (repository, environment) (stack
  motir-release-<appRef>). A Lambda function named the release's appRef that
  runs the image through the AWS Lambda Web Adapter: 1,769 MB, x86_64, in the
  network's private subnets. A version per image behind the alias `live`, with
  replaced versions RETAINED so a rollback can point `live` back at one; a
  function URL on `live` that only the forwarder's principal may invoke (IAM,
  SigV4); provisioned concurrency 1 on `live` when the idle policy is always_on.
  The release's plain variables are in the function's environment (the caller
  writes them into this template's Variables at the marker); its secret ones,
  and any over Lambda's 4 KB, live in ONE environment secret, this stack's own,
  whose value the caller writes as the secret version ConfigHash names. A first
  apply with an empty ConfigHash creates the function unpublished, so the caller
  can write that value before any version (and its provisioned concurrency)
  starts. A FRONT DOOR (MOTIR-10129, to MOTIR-10128) is what every forwarder
  reaches: a small function on a public URL that admits a request only when it
  carries the app's X-Motir-Origin-Secret, strips the header and invokes `live`
  with the same event, so the edge presents one credential kind for every
  release and no tenant-account credential leaves this account.

Parameters:
  OrganizationId:
    Type: String
    Description: The Motir organisation (tag motir:organization).
    AllowedPattern: '^[a-z0-9]+$'
  RepositoryId:
    Type: String
    Description: The Motir repository id (tag motir:repository).
    AllowedPattern: '^[a-z0-9]+$'
  AppRef:
    Type: String
    Description: The release's app name, mh-<rid> or mh-<rid>-pr<n> - the function's name.
    AllowedPattern: '^mh-[a-z0-9]+(-pr[0-9]+)?$'
    MaxLength: 63
  Environment:
    Type: String
    AllowedValues: [production, preview]
  ImageUri:
    Type: String
    Description: The release's image in the registry stack's repository, by digest.
  IdlePolicy:
    Type: String
    AllowedValues: [always_on, suspend]
  Port:
    Type: Number
    Default: 8080
    Description: The port the app listens on (the Web Adapter forwards to it).
  HealthCheckPath:
    Type: String
    Default: /
    Description: The path the Web Adapter checks before the app takes traffic.
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: The network stack's PrivateSubnetIds output.
  AppSecurityGroupId:
    Type: String
    Description: The network stack's AppSecurityGroupId output.
  DatabaseSecretArn:
    Type: String
    Default: ''
    Description: The environment's database connection secret (key `url`), or empty.
  ConfigHash:
    Type: String
    Default: ''
    Description: >-
      A hash of the release's variables, and the id of the environment secret's
      version holding them; a change publishes a new version, which reads that
      secret version. Empty: the function is not published yet (no version,
      alias or URL).
  InvokePrincipalArn:
    Type: String
    Description: The forwarder's IAM principal, the only one allowed to invoke the URL.
  OriginSecret:
    Type: String
    NoEcho: true
    Description: >-
      The app's origin secret, derived by the caller (deriveOriginSecret); never
      computed here. The front door admits only a request carrying it.
  FrontDoorRevision:
    Type: String
    Default: ''
    Description: >-
      A hash of the origin secret and this template, from the caller; a change
      publishes a new front door version, so a rotated key reaches `live`.

Conditions:
  AlwaysOn: !Equals [!Ref IdlePolicy, always_on]
  Published: !Not [!Equals [!Ref ConfigHash, '']]
  HasDatabase: !Not [!Equals [!Ref DatabaseSecretArn, '']]

Resources:
  # The release's variables as one JSON object; the caller writes the value.
  EnvironmentSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - motir/${AppRef}/environment-${Suffix}
        - Suffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      Description: The release's environment variables.
      SecretString: '{}'
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppRef}
      RetentionInDays: 30
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # Reads only its own log group and its own secrets.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub motir-${AppRef}-fn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasDatabase
                  - [!Ref EnvironmentSecret, !Ref DatabaseSecretArn]
                  - [!Ref EnvironmentSecret]
              # The function's network interfaces in the private subnets.
              - Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref AppRef
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: 1769
      Timeout: 60
      Role: !GetAtt ExecutionRole.Arn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref AppSecurityGroupId
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          AWS_LWA_PORT: !Ref Port
          AWS_LWA_READINESS_CHECK_PATH: !Ref HealthCheckPath
          MOTIR_ENVIRONMENT: !Ref Environment
          MOTIR_ENVIRONMENT_SECRET_ARN: !Ref EnvironmentSecret
          MOTIR_DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          MOTIR_ENVIRONMENT_SECRET_VERSION: !Ref ConfigHash
          # <release variables>
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # Every property of a version forces a new one, so the description naming the
  # image and the config hash publishes a version per release; the replaced one
  # is RETAINED, the rollback target.
  Version:
    Type: AWS::Lambda::Version
    Condition: Published
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      FunctionName: !Ref Function
      Description: !Sub ${ImageUri} ${ConfigHash}

  LiveAlias:
    Type: AWS::Lambda::Alias
    Condition: Published
    Properties:
      FunctionName: !Ref Function
      Name: live
      FunctionVersion: !GetAtt Version.Version
      ProvisionedConcurrencyConfig: !If
        - AlwaysOn
        - ProvisionedConcurrentExecutions: 1
        - !Ref AWS::NoValue

  FunctionUrl:
    Type: AWS::Lambda::Url
    Condition: Published
    DependsOn: LiveAlias
    Properties:
      TargetFunctionArn: !Ref Function
      Qualifier: live
      AuthType: AWS_IAM

  # A function URL created since October 2025 admits a caller only when the
  # resource policy grants BOTH lambda:InvokeFunctionUrl and
  # lambda:InvokeFunction (AWS, "Control access to Lambda function URLs"); a
  # cross-account caller needs both on its identity policy too (motir-infra's
  # worker grant, MOTIR-10304). One permission per action, as AddPermission
  # takes one. The InvokeFunction half holds only through the URL, so the
  # forwarder cannot Invoke the function directly.
  ForwarderInvoke:
    Type: AWS::Lambda::Permission
    Condition: Published
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref LiveAlias
      FunctionUrlAuthType: AWS_IAM
      Principal: !Ref InvokePrincipalArn

  ForwarderInvokeFunction:
    Type: AWS::Lambda::Permission
    Condition: Published
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveAlias
      InvokedViaFunctionUrl: true
      Principal: !Ref InvokePrincipalArn

  # THE FRONT DOOR (MOTIR-10129). The decision MOTIR-10128 has every forwarder
  # present the origin secret, so the IAM URL above is not what the edge calls:
  # this function is. Outside the VPC (it calls only the Lambda API), on arm64,
  # with a timeout above the app's so the app's own timeout answers first. It
  # holds no credential but its role's one grant: invoke `live`.
  FrontDoorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: Published
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppRef}-front-door
      RetentionInDays: 30
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  FrontDoorRole:
    Type: AWS::IAM::Role
    Condition: Published
    Properties:
      RoleName: !Sub motir-${AppRef}-door
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: front-door
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${FrontDoorLogGroup.Arn}
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref LiveAlias
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # The handler, inline (the runtime writes it as index.js). For every request:
  # X-Motir-Origin-Secret missing or wrong -> 403, empty body, and `live` is NOT
  # invoked; right -> the header is removed and `live` is invoked once (no SDK
  # retry, so a request is never run twice) with the same function URL event,
  # whose answer is the response. A failed invoke is a 502. The comparison is
  # constant-time over SHA-256 digests, as the hosting guard's is; the secret is
  # never logged.
  FrontDoorFunction:
    Type: AWS::Lambda::Function
    Condition: Published
    Properties:
      FunctionName: !Sub ${AppRef}-front-door
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 70
      Role: !GetAtt FrontDoorRole.Arn
      LoggingConfig:
        LogGroup: !Ref FrontDoorLogGroup
      Environment:
        Variables:
          MOTIR_FRONT_DOOR_SECRET: !Ref OriginSecret
          MOTIR_FRONT_DOOR_TARGET: !Ref LiveAlias
      Code:
        ZipFile: |
          'use strict';
          const { createHash, timingSafeEqual } = require('node:crypto');
          const { LambdaClient, InvokeCommand } = require('@aws-sdk/client-lambda');
          const HEADER = 'x-motir-origin-secret';
          const digest = (value) => createHash('sha256').update(value).digest();
          const empty = (statusCode) => ({ statusCode, headers: { 'content-length': '0' }, body: '' });
          let client;
          exports.handler = async (event) => {
            const headers = { ...(event.headers || {}) };
            const given = headers[HEADER];
            const secret = process.env.MOTIR_FRONT_DOOR_SECRET || '';
            if (typeof given !== 'string' || !secret || !timingSafeEqual(digest(given), digest(secret))) {
              return empty(403);
            }
            delete headers[HEADER];
            client = client || new LambdaClient({ maxAttempts: 1 });
            let answer;
            try {
              answer = await client.send(new InvokeCommand({
                FunctionName: process.env.MOTIR_FRONT_DOOR_TARGET,
                Payload: JSON.stringify({ ...event, headers }),
              }));
            } catch (err) {
              console.error('front door: invoke failed', err && err.name);
              return empty(502);
            }
            if (answer.FunctionError || !answer.Payload) {
              console.error('front door: the app failed', answer.FunctionError || 'no payload');
              return empty(502);
            }
            return JSON.parse(Buffer.from(answer.Payload).toString('utf8'));
          };
      Tags:
        - { Key: 'motir:organization', Value: !Ref OrganizationId }
        - { Key: 'motir:repository', Value: !Ref RepositoryId }

  # A version per revision (the origin secret and this template), behind its
  # own `live`, so provisioned concurrency can keep an always-on app's front
  # door warm too. A replaced front door version is not kept: a rollback moves
  # the app's `live`, never this one.
  FrontDoorVersion:
    Type: AWS::Lambda::Version
    Condition: Published
    Properties:
      FunctionName: !Ref FrontDoorFunction
      Description: !Sub front door ${FrontDoorRevision}

  FrontDoorAlias:
    Type: AWS::Lambda::Alias
    Condition: Published
    Properties:
      FunctionName: !Ref FrontDoorFunction
      Name: live
      FunctionVersion: !GetAtt FrontDoorVersion.Version
      ProvisionedConcurrencyConfig: !If
        - AlwaysOn
        - ProvisionedConcurrentExecutions: 1
        - !Ref AWS::NoValue

  # Public: the origin secret is the credential, checked by the handler. A
  # public URL created since October 2025 needs both actions granted to `*`.
  FrontDoorUrl:
    Type: AWS::Lambda::Url
    Condition: Published
    DependsOn: FrontDoorAlias
    Properties:
      TargetFunctionArn: !Ref FrontDoorFunction
      Qualifier: live
      AuthType: NONE
      InvokeMode: BUFFERED

  FrontDoorPublicUrl:
    Type: AWS::Lambda::Permission
    Condition: Published
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref FrontDoorAlias
      FunctionUrlAuthType: NONE
      Principal: '*'

  FrontDoorPublicInvoke:
    Type: AWS::Lambda::Permission
    Condition: Published
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FrontDoorAlias
      InvokedViaFunctionUrl: true
      Principal: '*'

Outputs:
  FunctionName:
    Value: !Ref Function
  FunctionArn:
    Value: !GetAtt Function.Arn
  EnvironmentSecretArn:
    Value: !Ref EnvironmentSecret
  FunctionUrl:
    Condition: Published
    Value: !GetAtt FunctionUrl.FunctionUrl
  LiveVersion:
    Condition: Published
    Value: !GetAtt Version.Version
  FrontDoorUrl:
    Condition: Published
    Value: !GetAtt FrontDoorUrl.FunctionUrl
