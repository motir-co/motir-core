# The sandbox image build / smoke / publish matrix (Story 7.9 · 7.9.7c MOTIR-885 · 7.9.7e MOTIR-1788)
#
# ONE definition of the matrix, called from two places:
#
#   - `ci.yml` on every pull request, with `publish: false` — build each profile
#     and prove it runs. The merge gate.
#   - `release-sandbox.yml` on a `cli-v*` tag, with `publish: true` — the SAME
#     build and the SAME smoke checks, and only then a push to GHCR.
#
# It is one reusable workflow rather than a second release-only matrix on
# purpose (7.9.7e): a publish lane that built the image its own way could ship an
# artifact no smoke test ever touched. Here the push is a LATER STEP of the job
# that just proved the image works — a profile whose build or liveness check
# fails never reaches the push step, so a green build is the release gate rather
# than a separate trust decision.
#
# What is published: every profile in `sandbox/smoke/profiles.json` plus the
# base, each as a moving `:<profile>` tag and an immutable
# `:<profile>-<version>` tag, for linux/amd64 + linux/arm64. See
# `packages/cli/sandbox/README.md` → "Published images" for the consumer view and
# "Publishing" for the release procedure.
#
# NOT here: signing, SBOM, or provenance attestation (a real hardening concern,
# but its own decision — half of it would be worse than none), and the HOSTED
# run image, which is 9.1.3 / 9.1.4's separate registry.

name: Sandbox images

on:
  workflow_call:
    inputs:
      publish:
        description: 'Push the smoke-tested images to GHCR (release lane only).'
        type: boolean
        default: false

env:
  # OCI repository names are lowercase-only, so the `moooon-B-V` org is spelled
  # lowercase here — `ghcr.io/Motir-Co/...` is not a pullable reference at all,
  # docker rejects it before any network call. Hardcoded rather than derived from
  # `github.repository_owner` for exactly that reason.
  IMAGE: ghcr.io/motir-co/motir-sandbox
  # Where each job writes the digest of what it pushed, for the verify job to
  # pull back by digest. One file per job so the matrix legs cannot collide.
  DIGESTS: /tmp/sandbox-digests

jobs:
  # ── The base image + the two in-container suites ───────────────────────────
  sandbox-smoke:
    name: Sandbox smoke (loop + failure + confinement)
    # The release plan below says whether `:base-<version>` is already in the
    # registry (MOTIR-10884). A re-run of a tag whose base landed skips this job
    # rather than rebuilding it and moving an immutable tag to new bytes. On the
    # pull-request lane the plan publishes nothing and this always runs.
    needs: sandbox-profiles-matrix
    if: ${{ !inputs.publish || needs.sandbox-profiles-matrix.outputs.base_published != 'true' }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Sized on the RELEASE lane, which is the slow one: it also runs the
    # two-platform "Push the base image" step below. `ci.yml` and
    # `image-cache-main.yml` run this same job without that step.
    #
    #   release      run           build   push     job total  under 25
    #   cli-v0.9.0   36720947162   5m08s   15m36s   22m36s     success
    #   cli-v0.10.0  36795719520   7m42s   15m41s   26m16s     CANCELLED
    #   cli-v0.11.0  36910243238   7m07s   16m15s   25m49s     CANCELLED
    #
    # → 45 (~1.7x on the worst, 26m16s). The old 25 was ~3x on 2.8–8.3 min
    # measured before MOTIR-6204 added Python, Postgres and a browser to the
    # shared base, which made the arm64 half of the push long. Two releases
    # were cancelled on time with every step green, so their images went out
    # unverified and their digests never reached the README (MOTIR-7217).
    # Why the push takes ~16 min is not measured yet; candidates are the QEMU
    # build of the heavier arm64 half, and the `sandbox-base-multiarch` scope
    # being written only on tag refs, so no release reads it warm.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # Register the arm64 emulator BEFORE the builder that will use it (the
      # release lane only). Nothing on the runner EXECUTES arm64, but the agent
      # installers' own `--version` smoke tests run under QEMU at BUILD time, so
      # a layer that cannot work on arm64 fails the build rather than shipping.
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.publish }}
        with:
          # Mirror-first for the same reason as the builder below — binfmt is
          # one more anonymous Docker Hub pull that can kill a RELEASE run
          # before any build starts (MOTIR-2018).
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      # buildx + the gha layer cache: the apt/gh layers are identical across
      # every run and across the profile matrix below, so only the layers this
      # commit actually changed are rebuilt. Mirror-first (MOTIR-2018): the
      # builder image, the `# syntax=` frontend and this Dockerfile's `FROM
      # node:…` base all come from a mirror rather than Docker Hub anonymously.
      - uses: ./.github/actions/buildx
      # ── THE CACHE SCOPES HERE ARE COVERED BY MOTIR-5126, NOT EXCLUDED ──────
      #
      # This lane had the identical defect as `runner-image.yml` — every scope
      # below was written to an ephemeral ref and reclaimed with it — so it takes
      # the identical fix: `.github/workflows/image-cache-main.yml` calls this
      # workflow on a push to `main` with `publish: false`, which WRITES every
      # scope below under `refs/heads/main`, the only ref every other ref is
      # allowed to read.
      #
      # ⚠️ IT IS NAMED HERE RATHER THAN LEFT TO THE OTHER FILE BECAUSE SILENCE
      # IN THIS ONE WOULD READ AS A WHOLE FIX. All eleven scopes on this lane —
      # `sandbox-base`, `sandbox-base-multiarch`, and `sandbox-<profile>` /
      # `sandbox-<profile>-multiarch` per profile — were being written to an
      # ephemeral ref and reclaimed with it, and this is the most expensive lane
      # in the repository, so a half-fix that warmed only the runner image would
      # have left the larger cost untouched while looking complete.
      #
      # The mechanism, the evidence it rests on, why it is a separate workflow
      # rather than a relaxed `ci.yml` gate, and the every-push-vs-image-touching
      # decision are recorded ONCE — in `runner-image.yml` beside its own
      # `cache-to:`, and in the writer's own header — rather than copied here,
      # because two copies of a rule drift and then disagree. The one fact worth
      # repeating is the one that protects THIS lane's cost: the writer is gated
      # on the image inputs, so this matrix runs on an image-touching merge and
      # not on every merge.
      - name: Build the base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/sandbox/Dockerfile
          build-args: AGENT=base
          tags: motir-sandbox:smoke
          load: true
          cache-from: type=gha,scope=sandbox-base
          cache-to: type=gha,scope=sandbox-base,mode=max
      # Runs the container through the DOCUMENTED mount recipe and executes both
      # in-container suites: the confinement assertions (read-only credential
      # mount, unprivileged user, no docker socket, no undocumented host bind)
      # and `motir auto --agent <fake-agent>` end to end — no LLM, no Motir
      # deployment, no Postgres, no network.
      - name: Smoke the image
        run: packages/cli/sandbox/smoke/run.sh --no-build --image motir-sandbox:smoke

      # ── What the image COSTS, on the run that built it (MOTIR-6204) ────────
      #
      # Every runtime in the shared base is paid by all nine published tags, on
      # both architectures, on every pull — so the size is a number a reviewer
      # needs and a number nobody could produce by hand: the sandbox the agent
      # runs in has no docker daemon (that is the confinement working, and it is
      # the same fact MOTIR-6204 was filed about). A pull request that adds a
      # tenth runtime should be able to read what the ninth cost, so the number
      # is emitted where the build already happens rather than pasted by hand
      # into a body that then goes stale.
      # ⚠️ IT REPORTS A DELTA, NOT A NUMBER, and the two have to be the SAME
      # METRIC or the comparison is worthless. `docker image inspect .Size` is
      # the UNCOMPRESSED on-disk size; a registry manifest's layer total is the
      # COMPRESSED download. Those differ by several times, so reading one
      # against the other reads as a huge regression (or a huge saving) that is
      # purely the unit. The published `:base` is therefore PULLED and measured
      # with the same command, rather than read from its manifest.
      #
      # Only this job pays that pull: the profile legs below report their own
      # absolute size, because nine more pulls of the published tags would cost
      # more than the comparison is worth.
      - name: Record the image size
        run: |
          size="$(docker image inspect motir-sandbox:smoke --format '{{.Size}}')"
          human="$(numfmt --to=iec --suffix=B "$size")"

          # The published base is the BEFORE. It is public (see the README's
          # "Public, and asserted to be"), so this needs no credential — and a
          # pull that fails must not fail the build, since the delta is a
          # courtesy and the absolute number is the deliverable.
          before=''
          if docker pull --quiet ghcr.io/motir-co/motir-sandbox:base >/dev/null 2>&1; then
            before="$(docker image inspect ghcr.io/motir-co/motir-sandbox:base --format '{{.Size}}')"
          fi

          {
            echo '### Image size — `base`'
            echo
            echo '| | uncompressed |'
            echo '| --- | --- |'
            if [ -n "$before" ]; then
              echo "| published \`:base\` (before) | $(numfmt --to=iec --suffix=B "$before") |"
              echo "| this build (after) | $human |"
              echo "| **delta** | **$(numfmt --to=iec --suffix=B "$((size - before))")** |"
            else
              echo "| this build | $human |"
              echo "| published \`:base\` | could not pull — delta not computed |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "motir-sandbox:base — $human ($size bytes); published before: ${before:-unavailable}"

      # ── Everything below only runs on the release lane, and only now that the
      # image above has been built AND proven. This ordering IS the publish gate.
      - name: Resolve the @motir/cli version
        if: ${{ inputs.publish }}
        id: ver
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ── BUILD, then PUSH, as two steps (MOTIR-10884) ─────────────────────
      #
      # They used to be one `build-push-action` step with `push: true`, so a push
      # GHCR refused failed the job outright: `cli-v0.17.2` built and smoked all
      # nine images and then lost six of them to an intermittent
      # `denied: permission_denied: write_package`. Split, the expensive part —
      # the two-platform build, arm64 under QEMU — happens ONCE, here, and a
      # failure in it is a build failure that nothing retries.
      #
      # `ignore-error=true` on the cache export: the cache is an optimisation,
      # and on `cli-v0.17.2`'s re-run the `codex` leg pushed its image and then
      # failed the whole step on `exporting to GitHub Actions Cache: ...
      # BlobNotFound`. A cache that cannot be written must not fail a release.
      - name: Build the base image for both architectures
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/sandbox/Dockerfile
          build-args: AGENT=base
          platforms: linux/amd64,linux/arm64
          # amd64 comes straight from the scope the smoke build just wrote; only
          # the arm64 half is new work. Its own scope so the two platform sets
          # never overwrite each other's manifest.
          cache-from: |
            type=gha,scope=sandbox-base
            type=gha,scope=sandbox-base-multiarch
          cache-to: type=gha,scope=sandbox-base-multiarch,mode=max,ignore-error=true
      # The push re-runs the same build on the same builder, which its local
      # cache answers entirely, and exports it to the registry. It is a plain
      # `docker buildx build` rather than the action because the retry wraps the
      # COMMAND: `push-with-retry.mjs` retries a registry refusal (denied, 5xx,
      # 429, a timeout) with backoff and fails at once on anything else. It
      # names no `type=gha` cache — a `run:` step is not handed the cache
      # service's token — and needs none, since the build above is local.
      - name: Push the base image
        if: ${{ inputs.publish }}
        id: push
        run: |
          node packages/cli/sandbox/smoke/push-with-retry.mjs \
            --label base \
            --metadata-file "$RUNNER_TEMP/push-metadata.json" \
            --github-output "$GITHUB_OUTPUT" \
            -- docker buildx build \
              --file packages/cli/sandbox/Dockerfile \
              --build-arg AGENT=base \
              --platform linux/amd64,linux/arm64 \
              --tag "${{ env.IMAGE }}:base" \
              --tag "${{ env.IMAGE }}:base-${{ steps.ver.outputs.version }}" \
              --metadata-file "$RUNNER_TEMP/push-metadata.json" \
              --push \
              .
      - name: Record the published digest
        if: ${{ inputs.publish }}
        run: |
          mkdir -p "$DIGESTS"
          echo "${{ steps.push.outputs.digest }}" > "$DIGESTS/base"
      - name: Upload the digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-digest-base
          path: ${{ env.DIGESTS }}/base
          retention-days: 7

  sandbox-profiles-matrix:
    name: Sandbox profile matrix (setup)
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 0.2–0.4 min across 14 runs → 10 (~29x, the short-job floor).
    # It emits the profile matrix and, on the release lane, the release plan:
    # nine anonymous manifest reads, a few seconds more (MOTIR-10884).
    timeout-minutes: 10
    outputs:
      # The release lane reads the PLAN (only the missing profiles); the
      # pull-request lane, which publishes nothing, reads the whole table.
      profiles: ${{ inputs.publish && steps.plan.outputs.profiles || steps.read.outputs.profiles }}
      base_published: ${{ inputs.publish && steps.plan.outputs.base_published || 'false' }}
      # The WHOLE table, whatever the plan skipped — what the verify job pulls
      # back, so an image published by an earlier run of this tag is still checked.
      all_profiles: ${{ steps.read.outputs.profiles }}
    steps:
      - uses: actions/checkout@v6
      # The matrix is READ from the profile table rather than restated here, so
      # adding an agent to `sandbox/smoke/profiles.json` extends CI on its own —
      # and `sandboxCi.test.ts` keeps that file honest against AGENT_PROFILES and
      # the install-agent.sh arms.
      - id: read
        run: |
          profiles=$(node -e "const {profiles}=require('./packages/cli/sandbox/smoke/profiles.json');console.log(JSON.stringify(profiles))")
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"

      # ── The RELEASE PLAN: build only what this version does not have yet ──
      # (MOTIR-10884). A re-run of a tag — a `workflow_dispatch`, or "Re-run all
      # jobs" after a partial release — asks the registry, anonymously, which
      # `:<name>-<version>` tags already exist, and the matrix below runs only
      # the profiles that are missing. `cli-v0.17.2`'s re-run had no such plan:
      # it rebuilt every image, re-pushed the three that had landed, and moved
      # their immutable tags to new bytes.
      #
      # The digests of what is already published are uploaded as one more
      # `sandbox-digest-*` artifact, so the verify jobs and the README record
      # see the WHOLE release, not only the part this run pushed. A registry
      # that cannot be asked stops the release here (exit 2) rather than
      # guessing either way.
      - name: Resolve the @motir/cli version
        if: ${{ inputs.publish }}
        id: ver
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Plan the release — skip every image already published at this version
        if: ${{ inputs.publish }}
        id: plan
        run: |
          node packages/cli/sandbox/smoke/release-set.mjs plan \
            --image "$IMAGE" \
            --version "${{ steps.ver.outputs.version }}" \
            --profiles packages/cli/sandbox/smoke/profiles.json \
            --digests "$DIGESTS" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the digests already published
        if: ${{ inputs.publish && steps.plan.outputs.published != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-digest-already-published
          path: ${{ env.DIGESTS }}
          retention-days: 7

  sandbox-profiles:
    name: Sandbox profile ${{ matrix.profile.id }} (tier ${{ matrix.profile.tier }})
    needs: sandbox-profiles-matrix
    # A re-run of a tag whose every profile is already published plans an EMPTY
    # matrix, and an empty matrix is a hard error rather than zero legs.
    if: ${{ needs.sandbox-profiles-matrix.outputs.profiles != '[]' }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 2.6–16.7 min across 112 legs (eight profiles × 14 runs of both
    # callers) → 50 (~3x on the worst, `aider` (tier 2) at 16.68 min on ci.yml
    # run 33214411817, which SUCCEEDED). Sized on the slowest LEG, not the
    # median: the matrix shares one ceiling, so a number that fits `kimi` at
    # 2.6 would cut off a healthy `aider` at 16.7.
    #
    # ⚠️ MOTIR-3768's own card cited `0.1–5.8 min` for these legs, from ci.yml
    # run 33167406878 — where `sandbox` was SKIPPED by its path filter and the
    # figure measures nothing. A ~3x ceiling on 5.8 is 18, and 18 would have
    # failed the 16.68-minute green run above. Re-measure from runs where the
    # job actually ran; a skipped job reports a duration of zero, not an absence.
    timeout-minutes: 50
    # Tier 2 is ALLOW-FAIL, not absent. Those installers pull from vendor
    # endpoints Motir does not control, so a network flake there must not put a
    # red X on an unrelated pull request — but the build still runs and is still
    # reported, which is how a profile that broke for real gets noticed.
    #
    # On the RELEASE lane every tier gates instead: a release that quietly
    # shipped six of eight images, green, is worse than a release that failed.
    continue-on-error: ${{ matrix.profile.tier == 2 && !inputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sandbox-profiles-matrix.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v6
      # arm64 emulation first, for the same reason as the base job above — and
      # only on the release lane, where a multi-arch push actually happens.
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.publish }}
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: ./.github/actions/buildx
      - name: Build with AGENT=${{ matrix.profile.id }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/sandbox/Dockerfile
          build-args: AGENT=${{ matrix.profile.id }}
          tags: motir-sandbox:${{ matrix.profile.id }}
          load: true
          # The shared prefix (apt, gh, the packed motir binary) comes from the
          # base scope; each profile writes only its OWN agent layer.
          cache-from: |
            type=gha,scope=sandbox-base
            type=gha,scope=sandbox-${{ matrix.profile.id }}
          cache-to: type=gha,scope=sandbox-${{ matrix.profile.id }},mode=max
      # LIVENESS, not installability. install-agent.sh already runs the agent's
      # `--version` at BUILD time as root; running it again here — in the
      # finished image, as the unprivileged `node` user the loop actually runs
      # as — is what catches an installer that landed its binary somewhere only
      # root can reach (the /root failure mode 7.9.7b's AGENT_PREFIX exists for).
      - name: motir --version
        run: docker run --rm motir-sandbox:${{ matrix.profile.id }} motir --version
      - name: ${{ matrix.profile.liveness }}
        run: docker run --rm motir-sandbox:${{ matrix.profile.id }} ${{ matrix.profile.liveness }}

      # MOTIR-4956, as a guard. A Dev Containers session sets
      # `"overrideCommand": true`, which replaces the ENTRYPOINT as well as the
      # CMD — so everything the entrypoint used to do had to become reachable
      # from the SHELL instead (MOTIR-4959). `--entrypoint /bin/bash` is exactly
      # what that recipe does to the container, so this asserts the real shape.
      # It runs on every leg; the script asserts for the three profiles that
      # redirect a config path and reports the rest.
      - name: Agent config survives an entrypoint bypass
        run: |
          packages/cli/sandbox/smoke/entrypoint-bypass-smoke.sh \
            --image motir-sandbox:${{ matrix.profile.id }} \
            --profile ${{ matrix.profile.id }}

      # MOTIR-6183. A sandbox may run for weeks, so an agent must be able to
      # update itself in place: its binary resolves under the node-owned agent
      # prefix and npm's global prefix is that prefix. And the other half — the
      # agent cannot rewrite the root-owned `motir` that supervises it.
      - name: Agent can update itself; motir stays root-owned
        run: |
          packages/cli/sandbox/smoke/agent-update-smoke.sh \
            --image motir-sandbox:${{ matrix.profile.id }} \
            --profile ${{ matrix.profile.id }} \
            --liveness "${{ matrix.profile.liveness }}"

      # The per-profile half of the base job's size line (MOTIR-6204): the
      # shared base is paid once per PROFILE, so the profile number is what says
      # what a reader actually pulls.
      - name: Record the image size
        run: |
          size="$(docker image inspect motir-sandbox:${{ matrix.profile.id }} --format '{{.Size}}')"
          human="$(numfmt --to=iec --suffix=B "$size")"
          {
            echo '### Image size'
            echo
            echo '| profile | size |'
            echo '| --- | --- |'
            echo "| \`${{ matrix.profile.id }}\` | $human |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "motir-sandbox:${{ matrix.profile.id }} — $human ($size bytes)"

      # ── Release lane only, and only after the checks above passed.
      - name: Resolve the @motir/cli version
        if: ${{ inputs.publish }}
        id: ver
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build once, push with a retry — the same split, for the same reasons, as
      # the base job above (MOTIR-10884): a refused push is retried without a
      # rebuild, and a build failure is never retried.
      - name: Build ${{ matrix.profile.id }} for both architectures
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/sandbox/Dockerfile
          build-args: AGENT=${{ matrix.profile.id }}
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=sandbox-base
            type=gha,scope=sandbox-${{ matrix.profile.id }}
            type=gha,scope=sandbox-${{ matrix.profile.id }}-multiarch
          cache-to: type=gha,scope=sandbox-${{ matrix.profile.id }}-multiarch,mode=max,ignore-error=true
      - name: Push ${{ matrix.profile.id }}
        if: ${{ inputs.publish }}
        id: push
        run: |
          node packages/cli/sandbox/smoke/push-with-retry.mjs \
            --label "${{ matrix.profile.id }}" \
            --metadata-file "$RUNNER_TEMP/push-metadata.json" \
            --github-output "$GITHUB_OUTPUT" \
            -- docker buildx build \
              --file packages/cli/sandbox/Dockerfile \
              --build-arg AGENT=${{ matrix.profile.id }} \
              --platform linux/amd64,linux/arm64 \
              --tag "${{ env.IMAGE }}:${{ matrix.profile.id }}" \
              --tag "${{ env.IMAGE }}:${{ matrix.profile.id }}-${{ steps.ver.outputs.version }}" \
              --metadata-file "$RUNNER_TEMP/push-metadata.json" \
              --push \
              .
      - name: Record the published digest
        if: ${{ inputs.publish }}
        run: |
          mkdir -p "$DIGESTS"
          echo "${{ steps.push.outputs.digest }}" > "$DIGESTS/${{ matrix.profile.id }}"
      - name: Upload the digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-digest-${{ matrix.profile.id }}
          path: ${{ env.DIGESTS }}/${{ matrix.profile.id }}
          retention-days: 7

  # ── Post-deploy verification: pull what was actually published ─────────────
  # "The push step exited 0" is not the same claim as "the bytes are in the
  # registry and they run". This job makes the second claim, by digest — the only
  # reference that names the exact bytes a moving `:claude` tag pointed at a
  # minute ago.
  #
  # ⚠️ It does NOT establish that a USER can pull them: it logs in first, so it
  # asks the question as the publisher, for whom the answer is yes whatever the
  # package's visibility. That gap shipped `cli-v0.1.0`'s nine images green and
  # private (MOTIR-2010). `sandbox-public` below asks the consumer's question,
  # and the two are separate jobs precisely so a credential cannot leak from this
  # one into that one.
  sandbox-published:
    name: Verify the published images
    # `!failure()` rather than a bare `inputs.publish`: on a re-run that skipped
    # an already-published job, a SKIPPED need must not skip this check too.
    if: ${{ inputs.publish && !cancelled() && !failure() }}
    needs: [sandbox-smoke, sandbox-profiles-matrix, sandbox-profiles]
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 1.1–1.8 min across five runs → 10 (~6x, the short-job floor).
    # `if: inputs.publish`, so it only ever runs on the release path.
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the published digests
        uses: actions/download-artifact@v7
        with:
          pattern: sandbox-digest-*
          merge-multiple: true
          path: digests
      - name: Pull every published image BY DIGEST and run `motir --version`
        env:
          PROFILES: ${{ needs.sandbox-profiles-matrix.outputs.all_profiles }}
        run: |
          set -euo pipefail
          expected=$(node -e "console.log(['base',...JSON.parse(process.env.PROFILES).map(p=>p.id)].join(' '))")
          {
            echo "### Published sandbox images"
            echo
            echo "| Tag | Digest |"
            echo "| --- | ------ |"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in $expected; do
            file="digests/$name"
            # A profile whose leg was skipped or silently dropped uploads no
            # digest — catching THAT is half of why this job exists.
            if [ ! -s "$file" ]; then
              echo "::error::No digest was published for '$name' — the release is incomplete."
              exit 1
            fi
            digest=$(cat "$file")
            echo "== $name @ $digest"
            docker run --rm "${IMAGE}@${digest}" motir --version
            echo "| \`${IMAGE}:${name}\` | \`${digest}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "This table is a CONVENIENCE, not a handoff: \`release-sandbox.yml\`'s"
            echo "\`readme\` job writes \`packages/cli/sandbox/README.md\` → **Published images**"
            echo "itself, reading each digest back from the registry ANONYMOUSLY rather than"
            echo "from this page (MOTIR-2699 / MOTIR-2220). Nothing here needs retyping."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── The consumer's question: can a STRANGER pull this? (MOTIR-2010) ────────
  # `docs/cli.md` § The sandbox says "Pull and go — no checkout, no build" over a
  # bare `docker run`. That is a claim about access control, and until this job
  # existed nothing tested it: `cli-v0.1.0` published nine images, recorded nine
  # digests, went green, and the package was PRIVATE — so the first command in
  # the documentation returned `unauthorized` for everyone outside the org.
  #
  # Anonymity is STRUCTURAL here, in three independent ways, because an ambient
  # credential would turn this job back into `sandbox-published`:
  #   1. no `docker/login-action` step, so `~/.docker/config.json` stays empty;
  #   2. `permissions:` grants no `packages:` scope, so the job's GITHUB_TOKEN
  #      cannot authenticate to GHCR even if something tried;
  #   3. `assert-public.mjs` sets no `Authorization` header and reads no docker
  #      config, so it gives the same verdict from a logged-in developer shell.
  # It probes a known-public control first and reports INDETERMINATE if that
  # fails — a broken probe answers "private" to everything, and "private" is the
  # answer being hunted, so it would otherwise be believed.
  sandbox-public:
    name: Verify the published images pull ANONYMOUSLY
    # `!failure()` rather than a bare `inputs.publish`: on a re-run that skipped
    # an already-published job, a SKIPPED need must not skip this check too.
    if: ${{ inputs.publish && !cancelled() && !failure() }}
    needs: [sandbox-smoke, sandbox-profiles-matrix, sandbox-profiles, sandbox-published]
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 0.5–0.6 min across three runs → 10 (~17x, the short-job floor).
    # `if: inputs.publish`, so it only ever runs on the release path.
    timeout-minutes: 10
    # `contents: read` and nothing else. A called workflow can only ever REDUCE
    # what its caller granted, so this is spelled as a subset of
    # `release-sandbox.yml`'s `contents: read` + `packages: write` — asking for a
    # scope the caller withheld (`actions: read`, say) fails the run outright
    # rather than downgrading. Same-run artifact downloads need no extra scope,
    # which is why `sandbox-published` works today with the caller's grant alone.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download the published digests
        uses: actions/download-artifact@v7
        with:
          pattern: sandbox-digest-*
          merge-multiple: true
          path: digests
      - name: Probe every published digest with NO credential
        run: node packages/cli/sandbox/smoke/assert-public.mjs --image "$IMAGE" --digests digests
      # The manifest probe above proves the registry serves the bytes to a
      # nobody. This proves the documented COMMAND works: the same `docker run`
      # docs/cli.md opens with, on the profile it names, in a job that never
      # logged in. Pinned to the digest rather than `:claude` so it cannot pass
      # on an older public tag while the new push is unreachable.
      - name: Run the DOCUMENTED command anonymously (`:claude`, by digest)
        run: |
          set -euo pipefail
          digest=$(cat digests/claude)
          docker run --rm "${IMAGE}@${digest}" motir --version

  # ── Does the command on the PAGE exist in the image? (MOTIR-2612) ──────────
  # `sandbox-published` runs `motir --version` as the publisher. `sandbox-public`
  # above proves a stranger can pull the bytes and that the documented `docker
  # run` works. Neither reads what is INSIDE: `--version` is a number, and a
  # successful pull says nothing about the command set. So the question
  # `/docs/sandbox` raises — "does the command this page tells you to type exist
  # in the image it tells you to pull?" — was asked by nothing, and was answered
  # wrongly twice: MOTIR-2131 (true: the image predated `motir login` for five
  # days) and MOTIR-2611 (false: a whole card dispatched on the belief, because
  # confirming it meant reading the artifact and nobody could).
  #
  # The expected set is DERIVED from `lib/apiDocs/sandbox.ts`'s `cliCommands`, the
  # same data the page renders, so a step that names a new command is covered the
  # day it is written and there is no second list to drift. A derivation that
  # produced nothing is exit 2, never a green 0-of-0.
  #
  # Modelled on `sandbox-public`, NOT on `sandbox-published`: same three
  # structural guarantees of anonymity — no `docker/login-action`, no `packages:`
  # scope, and a script that reads no docker config and holds no credential of
  # ours. `packages/cli/test/sandboxCi.test.ts` asserts all three, because the
  # absence of a login step reads as an oversight to anyone tidying this file
  # later and that is exactly how the last version of this question got asked
  # from the wrong side.
  #
  # It needs no Docker daemon at all: it reads the layers over the registry API,
  # which is what lets it check EVERY platform in the index (a `docker run` tests
  # only the runner's own architecture, and half our readers are on arm64) and
  # what lets a human run it mid-investigation from any shell.
  sandbox-commands:
    name: Verify the published CLI has every command the docs name
    # `!failure()` rather than a bare `inputs.publish`: on a re-run that skipped
    # an already-published job, a SKIPPED need must not skip this check too.
    if: ${{ inputs.publish && !cancelled() && !failure() }}
    needs: [sandbox-smoke, sandbox-profiles-matrix, sandbox-profiles, sandbox-published]
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 0.5 min on run 31529928332 → 10 (~22x, the short-job floor).
    # One run on record: this job is newer than the others (MOTIR-2612).
    timeout-minutes: 10
    # `contents: read` and nothing else — it needs the checkout for the guide
    # source it derives the expectation from, and no registry scope whatsoever.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download the published digests
        uses: actions/download-artifact@v7
        with:
          pattern: sandbox-digest-*
          merge-multiple: true
          path: digests
      - name: Assert every documented command is IN the published images
        run: node packages/cli/sandbox/smoke/assert-commands.mjs --image "$IMAGE" --digests digests

  # ── Is the WHOLE release in the registry? (MOTIR-10884) ────────────────────
  # Every job above that checks what was published `needs` every leg, so a
  # release that lost one push skips them all, and the run says only "six legs
  # red" — never which images the release is missing. That is how `cli-v0.17.2`
  # ended: three of nine published, the verify, public, commands and README jobs
  # all skipped, and new `claude` / `codex` / `opencode` agents still on 0.17.1.
  #
  # This job runs once every leg has ENDED, however it ended (`!cancelled()`,
  # never a bare success), and asks the registry the consumer's question for each
  # name in `profiles.json` plus the base: is there a `:<name>-<version>` tag? It
  # fails naming each one that is missing. It reads the registry rather than this
  # run's artifacts so a name published by an EARLIER run of the same tag counts,
  # which is what lets a re-run that pushed only the missing images end green.
  #
  # Anonymous, like `sandbox-public`: no login and no `packages:` scope, because
  # the question is whether the release reached the people it is for.
  sandbox-complete:
    name: Verify every image is published at the release version
    if: ${{ inputs.publish && !cancelled() }}
    needs: [sandbox-smoke, sandbox-profiles-matrix, sandbox-profiles]
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # New with MOTIR-10884, so no run on record: nine anonymous manifest reads
    # and a control probe, the same work `sandbox-public` does in 0.5–0.6 min →
    # 10, the short-job floor.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Name every image with no <name>-<version> tag
        run: |
          node packages/cli/sandbox/smoke/release-set.mjs verify \
            --image "$IMAGE" \
            --version "$(node -p "require('./packages/cli/package.json').version")" \
            --profiles packages/cli/sandbox/smoke/profiles.json \
            --summary "$GITHUB_STEP_SUMMARY"
