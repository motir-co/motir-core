name: Acceptance tests

# ── The acceptance-test lane, story-scoped (Story MOTIR-1627 · MOTIR-1949) ───
#
# The acceptance E2E self-test dogfood (MOTIR-1638) and the per-story acceptance
# specs (MOTIR-1700), CLOUD-ON + video:'on'. Its OWN Playwright lane
# (playwright.acceptance.config.ts: MOTIR_CLOUD + the E2E_TEST_BILLING mock,
# isolated ports 3200/8488) so the plan/toggle panel states are reachable and
# each run is recorded. testMatch: acceptance*.spec.ts catches the dogfood AND
# the story-specific specs (planner rule MOTIR-1644); the main Playwright config
# testIgnore's the same pattern.
#
# ⚠️ THIS LANE PUBLISHES THE RECEIPT AGAIN — ON A GREEN PR RUN, OVER OIDC ONLY
# (MOTIR-7253, 2026-10-01). From 2026-09-01 (MOTIR-4096) it only recorded, and
# the AGENT published the receipt over the Motir MCP surface. That made the
# receipt exist only if the agent remembered two calls and could reach MCP from
# its sandbox, and a missing receipt looks exactly like a successful run. For the
# repositories Motir writes itself — this one, and every project generated from
# the starter — CI is the more reliable publisher, so the uploader is back:
# each shard leg of a GREEN `pull_request` run publishes the recordings of the
# specs THIS PR changed to their own story, authenticated by keyless GitHub OIDC
# (`id-token: write`, on the shard job only). No job here holds a Motir token.
# A `push: main` baseline, a `merge_group` run, a red run and a PR that owns no
# spec publish nothing. The recording itself is unchanged — `video: 'on'`, the
# `chapters.json` sidecars, the shard-scoped report artifact. The agent stands
# down wherever its checkout carries this action; the MCP door stays open for
# every other repository. `docs/decisions/acceptance-video.md` AMENDMENT
# 2026-10-01 records the reversal; the 2026-09-02 handover stands as history.
#
# ⚠️ WHY ITS OWN WORKFLOW, AND NOT A JOB IN ci.yml.
# The requirement is that a PR which does not own an acceptance spec shows NO
# acceptance check at all. A job-level `if:` does NOT achieve that: a job whose
# `if:` is false is still REPORTED, as a greyed `Skipped` check (measured on
# PR #1751 — `Playwright E2E (acceptance-video)  skipping`). A matrix leg cannot
# be dropped by an expression either. The only mechanism that leaves no check
# behind is a workflow that is never TRIGGERED — hence a separate file with a
# `paths:` filter. No matching file → no run → nothing on the PR. The rename in
# MOTIR-4096 did not change this: it is still a separate `paths:`-filtered
# workflow and must never become a job in `ci.yml`.
#
# Consequences of being a separate workflow, accepted deliberately:
#   • It cannot `needs:` ci.yml's `build` job or read that run's artifacts, so it
#     compiles `.next/` itself — in its OWN `build` job below (MOTIR-2600), whose
#     artifact every shard then downloads. That costs a build, but only on the
#     PRs that own a spec, and only ONE regardless of the shard count.
#   • It ALSO runs on `push: main`, but only while the lane actually holds a
#     spec — the MAIN BASELINE, decided by MOTIR-2760 and described in its own
#     section below.
#   • ⚠️ A CHANGE TO A PAGE AN ACCEPTANCE SPEC READS DOES NOT RUN THIS LANE, and
#     that is deliberate (MOTIR-2620). The specs here assert against real product
#     surfaces, so the `paths:` filter cuts between a page and the only test that
#     reads it: MOTIR-2611 added a second command to `/docs/sandbox` step 2,
#     `acceptance-api-docs.spec.ts` went red on the two Copy buttons, and the
#     lane never ran on the PR that caused it — it surfaced on the next unrelated
#     PR to touch a spec. Widening the filter was considered and REJECTED: the
#     set of sources these specs read is most of the app, so any honest widening
#     runs a ~30-minute lane on nearly every PR, and covering one page
#     (`lib/apiDocs/**`) would close one instance while leaving the class.
#     That REMAINS the rule for the pull_request trigger, and MOTIR-2760 (which
#     owned the trigger question) did not widen it — see "THE MAIN BASELINE"
#     below for what it did instead, and why widening got even less attractive
#     after MOTIR-2765 rather than more.
#     THIS LANE IS THE RECEIPT LANE, NOT A REGRESSION GATE. Behaviour a page owes
#     on every PR belongs in a bulk-shard spec, which `ci.yml` already runs
#     unconditionally; an acceptance spec is what a REVIEWER WATCHES. So: if you
#     change a surface an acceptance spec drives, run this lane yourself before
#     merging (`pnpm test:e2e --config playwright.acceptance.config.ts <spec>`),
#     or expect the MAIN BASELINE to find it on your merge.
#
# ── THE MAIN BASELINE — `push: main`, gated on the lane having a member ──────
#   (MOTIR-2760; ADR amendment 2026-08-17 in `docs/decisions/acceptance-video.md`)
#
# WHAT RUNS WHEN, in full — this table is the whole trigger policy. The leg
# count is DERIVED from the lane's membership (MOTIR-2908): min(specs, 4),
# floored at 1 — see "SIZED TO THE LANE" below.
#
#   PR changing an `acceptance*.spec.ts`      lane runs (N legs)
#   PR changing one of the 4 lane-definition  lane runs (N legs)
#     files below
#   PR changing anything else                 NO RUN, NO CHECK  (MOTIR-1949)
#   push to `main`, lane HAS ≥1 spec          lane runs (N legs)
#   push to `main`, lane is EMPTY             gate job only (~10s), nothing else
#
# THE PROBLEM IT CLOSES. The `pull_request` filter is deliberately blind to the
# app (the MOTIR-2620 bullet above), so an app change that breaks an acceptance
# spec merged green and sat on `main` until some UNRELATED PR happened to touch a
# spec — and that PR's author inherited the diagnosis. Measured instance:
# MOTIR-2654 moved sign-in's `callbackURL`, broke `acceptance-ai-callout.spec.ts`
# at c6b5d19d, and it surfaced on MOTIR-2664's PR (#2045), which does not own that
# spec. The baseline puts the red on the merge that caused it instead.
#
# WHY THIS AND NOT THE OTHER THREE OPTIONS. MOTIR-2765 shipped between this card
# being written and being run, and it moves the arithmetic decisively:
#   · WIDEN `paths:` to `app/**` / `lib/**` — still rejected, and now more firmly.
#     MOTIR-2620 rejected it on the grounds that the specs read most of the app;
#     after the MOTIR-2769 triage the lane's steady-state membership is ZERO, so
#     widening would run an 18-machine-minute lane on nearly every PR to execute
#     nothing at all.
#   · A NIGHTLY run — cheaper, but it cannot attribute. Its red names a commit
#     RANGE; the baseline names one merge. And on an empty lane it is pure waste,
#     which is most nights.
#   · A CHEAP SMOKE SUBSET on every PR — there is no subset to take. The lane is
#     usually empty, and when it is not it holds one or two specs.
#
# WHY THE GATE JOB IS THE LOAD-BEARING PART, not a nicety. MEASURED on run
# 31740853229 (the MOTIR-2765 merge, an already-empty lane): `build` 6m + four
# shards at 3m = 18 machine-minutes to run zero tests, because the cost is setup
# and a `next build`, not the specs. `main` takes ~20 merges/day, so an
# UNCONDITIONAL `push:` trigger would burn ~360 machine-minutes/day testing
# nothing. Gated, an empty lane costs one ~10s checkout per merge, and the real
# cost is paid only inside the receipt window a story is actually in review.
# (MOTIR-2908 then shrank what a RUN costs inside that window — the 18 above is
# the four-leg shape it replaced, and is left as the measurement it was.)
#
# ⚠️ MOTIR-1949's REQUIREMENT IS UNTOUCHED, and the reason is worth stating
# because the gate LOOKS like the job-level `if:` that requirement forbids.
# "Absent, not skipped" is a constraint about PULL REQUESTS — a greyed check on
# someone's PR. A `push` event attaches its checks to the commit on `main`; it
# adds nothing to any open PR. So the gate can skip freely on `push` and cost no
# PR a check. On `pull_request` the gate is unconditionally `true` — the `paths:`
# filter already decided, and a triggered PR run is never skipped.
#
# ⚠️ AND `cancel-in-progress` IS PR-ONLY. Cancelling superseded runs is right for
# a PR (only the tip matters) and WRONG here: back-to-back merges would cancel
# each other's baseline and destroy the per-merge attribution that is this
# trigger's entire product.
#
# WHAT IS STILL DELIBERATELY NOT COVERED, said plainly so the next reader does
# not have to re-derive it: the PR that BREAKS a spec still goes green. The
# baseline catches the break one merge later, not before it lands. Closing that
# would require the `paths:` widening rejected above, and the accepted cost is a
# red `main` for the length of one fix — bounded, attributed, and paid by the
# author who caused it rather than by the next passer-by.
#
# ── A SPEC IN THIS LANE HAS A LIFECYCLE — IT DOES NOT LIVE HERE FOREVER ──────
#   (Story MOTIR-2765 · `docs/decisions/acceptance-receipt-lifecycle.md`)
#
# The spec is a TEST. The video it produces is a TEST EXECUTION — the record of
# one run, at one moment. Their lifetimes are independent, and the spec's ends
# first:
#
#   in review  the story's receipt is `pending`; a fresh recording supersedes it.
#              This is correct — the reviewer must see current truth, and this
#              lane is why the spec is here.
#   ⚠️ AMENDED by MOTIR-5872 (the ADR's AMENDMENT 1): approval now PINS the
#   recording and evicts nothing — a reworked story records again, and a spec
#   leaves this lane when its author promotes or retires it, not on approval.
#   The lines below are the 2026-08-13 record.
#
#   APPROVED   the receipt is FROZEN. A republish against it is REFUSED by the
#              service (MOTIR-2764), the publisher reports the skip rather than
#              failing (MOTIR-2768), and the spec has discharged the job it was
#              written for.
#   then       it LEAVES this lane, by exactly one of two routes — PROMOTE it
#              into a lane that runs on every PR (keep every assertion, strip
#              `chapter()` / `beat()` / `acceptanceStory()` and the pacing), or
#              RETIRE it, naming where the flow stays covered. There is no third
#              route and no "leave it for now": "leave it" was the silent default
#              that grew this lane to 26 specs, none of which ever left.
#
# ⚠️ A spec whose story is already accepted is in the WRONG LANE, and a guard
#    fails on it (MOTIR-2770) rather than leaving you to notice. If that guard
#    named your spec, it is asking for one of the two routes above — not for the
#    assertion to be updated. Editing a receipt so it describes today is editing
#    history to agree with the present; that reflex is right for a regression
#    test and exactly backwards here (motir-core#2051 is the instance).
#
# ⚠️ AND THE DESTINATION IS NOT ALWAYS THE MAIN LANE. This lane's server is
#    CLOUD-ON with the motir-ai, code-health and GitHub-provisioning mocks; the
#    main lane's is none of those. A spec whose subject is a gated surface must
#    be promoted into a lane that can switch that surface on, or it goes GREEN
#    off-cloud for a reason it is not testing (MOTIR-2601). See
#    `docs/acceptance-lane-triage.md` for which spec goes where, and MOTIR-2849.
#
# ── SHARDED (MOTIR-2600) ─────────────────────────────────────────────────────
#
# The lane used to run every acceptance spec in ONE serial job (`workers: 1`),
# and it was lengthening with every story that added a spec: 22.2 → 23.1 → 26.7
# → 29.1 minutes of test time across the runs on record, on top of its own
# `next build`. MOTIR-2506 named sharding as the structural answer and MOTIR-2600
# took it: one `build` job, then N legs each running `--shard=i/N`.
#
# What sharding DOES require here is a distinct artifact name per leg — two jobs
# uploading one name is a hard error in upload-artifact v4+, and it would have
# cost the lane its reports, which since MOTIR-4096 are the ONLY place this
# lane's recordings survive for a reviewer or for the agent that publishes them.
#
# ── SIZED TO THE LANE, NOT FIXED AT FOUR (MOTIR-2908) ────────────────────────
#
# `4` was the right number for the lane MOTIR-2600 measured: 26 specs, 25.7 min
# of test time. It stopped being the right number six days later without anyone
# changing it, because MOTIR-2765 gave an acceptance spec a LIFECYCLE and
# MOTIR-2769 triaged every existing member out — so the lane's steady state is
# now ZERO members and its ceiling is "the stories currently in review",
# realistically one or two.
#
# A leg's cost here is almost entirely SETUP: a checkout, a Postgres, a
# Playwright install and a build-artifact download, ~3 machine-minutes before it
# looks at a spec. So four legs over ≤2 specs is not parallelism — it is three
# extra copies of the setup, drawing no tests. `--pass-with-no-tests` (added by
# MOTIR-2769 for exactly the empty-lane case) is what made that LEGAL, and
# therefore invisible: the lane was green, fast in wall-clock, and expensive in
# machine-minutes.
#
# THE DERIVATION lives in the `membership` gate, which already counts the lane:
#
#   legs = min(specs, 14), floored at 1
#
#   0 specs → 1 leg    (a PR against an empty lane; `push` skips entirely)
#   1 spec  → 1 leg    2 specs → 2 legs    …    ≥ 14 → 14 legs
#
# Two things that number is chosen to protect, both of which a plain "one leg per
# spec" would break:
#   • THE CAP gives a grown lane its full parallelism, so it never regresses
#     toward the serial runtime sharding replaced. MOTIR-2600 set it at 4
#     (`[1, 2, 3, 4]` against 29 minutes of test time). MOTIR-7054 raised it
#     to 6 when the lane reached 87 specs and a four-leg shard ran past its
#     then 40-minute job timeout. MOTIR-9352 raised it to 10 when the lane
#     reached 156 specs and the sixth leg ran past its 55-minute timeout.
#     MOTIR-9220's repair raised it to 14 when, at 157 specs on ten legs, leg
#     9/10 ran 37–42 min of tests and was cancelled at 55.
#   • THE FLOOR of 1 keeps the rehearsal. A lane-definition PR against an empty
#     lane runs no tests either way — what it still proves is that the harness
#     BOOTS (the Playwright config loads, the webServer comes up, `e2e-setup`'s
#     artifact path works). Zero legs would prove nothing, on precisely the PRs
#     whose subject is this lane.
#
# Nor does it collide with the artifact-name rule — `matrix.shard` is `1..N`,
# distinct within any one run at every N.
#
# ⚠️ THE LANE'S OWN DEFINITION IS ALSO A TRIGGER (MOTIR-2600). The spec glob was
# the only path until that card, which meant a PR that RESTRUCTURED the lane —
# this file, its Playwright config, its fixture harness — changed no acceptance
# spec and so never ran it. That is how a lane change ships with no runtime
# evidence at all, and it is not a hypothetical: MOTIR-2600's own sharding would
# have merged unexecuted.
#
# It does not weaken MOTIR-1949's requirement (a PR that does not own an
# acceptance spec shows NO acceptance check): an ordinary feature PR touches none
# of these four paths either.
#
# ⚠️ AND THIS IS NOT THE WIDENING MOTIR-2620 REJECTED — the two are different
# axes, and the distinction is the whole reason both decisions can stand:
#   · MOTIR-2620 declined to trigger on the SOURCES the specs ASSERT AGAINST
#     (`lib/apiDocs/**` and, honestly extended, most of the app). That set is
#     unbounded and would run a receipt lane on nearly every PR.
#   · This adds the four files that DEFINE THE LANE ITSELF. That set is closed,
#     it is four paths, and a PR touching them is by definition a PR about this
#     lane — the one population that must run it.
# Read together: a change to what the specs LOOK AT does not run the lane (run it
# yourself, per the bullet above); a change to the MACHINERY does.
on:
  # ⚠️ NO `paths:` HERE ANY MORE, AND THAT IS THE POINT (MOTIR-4257).
  # The filter did not disappear — it MOVED, verbatim, into the `membership` gate
  # below, which now answers the same question for `pull_request` that it already
  # answered for `push`. The heavy jobs are gated exactly as before; what changed
  # is that the workflow is TRIGGERED on every PR, so `Acceptance complete`
  # REPORTS on every PR.
  #
  # It has to. GitHub's merge queue admits a pull request only once the branch's
  # required checks have passed ON THE PULL REQUEST — the queue is what it enters
  # afterwards, not a way around that gate. A `paths:`-filtered workflow does not
  # run at all on a PR that matches nothing, so its context never reports, and a
  # required context that never reports is not a gate that passes: it is a PR
  # that can never be merged. Requiring `Acceptance complete` while this filter
  # stood here would have bricked every PR in the repo that does not happen to
  # touch an acceptance file — which is nearly all of them.
  #
  # ⚠️ THIS REVERSES MOTIR-1949, KNOWINGLY. That card removed the greyed
  # `Skipped` check from PRs with no spec, and the section below still records
  # why the separate file was the only mechanism that could. The property is now
  # GIVEN UP: on a PR that touches none of the paths listed in the gate, this
  # lane shows a skipped `Next.js build (acceptance)`, a skipped
  # `Playwright E2E (acceptance)` and a green `Acceptance complete`. That is a
  # cosmetic cost, and it buys the thing MOTIR-4257 is about — `main` cannot go
  # red through a merge nobody checked. A tidy checks list is worth less than a
  # trunk that is green, so when the two conflict the checks list loses.
  pull_request:
  # The MAIN BASELINE (MOTIR-2760). Deliberately NOT `paths:`-filtered: while the
  # lane holds a spec, ANY merge could be the one that breaks it, and which
  # sources it reads is precisely what the filter cannot know. The `membership`
  # gate below is what keeps that affordable — see the header section.
  # ── THE MERGE QUEUE IS WHERE THIS LANE BELONGS (MOTIR-4257) ────────────────
  #
  # ⚠️ WITHOUT THIS THE TRUNK CAN GO RED AND NOTHING PREVENTS IT, which is the
  # one thing a merge queue exists to make impossible. The queue's contract is
  # that nothing lands unless the MERGED RESULT passes the required checks — so
  # a check that runs on `push: main` and NOT in the queue is, by construction,
  # a check that can break `main`, with no gate anywhere upstream of it.
  #
  # The `pull_request:` filter above cannot close that: it selects on the files
  # a change TOUCHES, and this lane's specs read the whole app. The worked
  # example is the merge that prompted this card — `e055b6b23` (#2530) made the
  # rail's Docs row conditional on `MOTIR_DOCS_URL`, touched ZERO of the paths
  # above, ran no acceptance check, passed the queue, and turned the baseline
  # red on the next push. That is not a queue failure; the queue was never
  # asked.
  #
  # ⚠️ THE TRIGGER AND THE RULESET ARE ONE CHANGE AND NEITHER HALF WORKS ALONE —
  # the same pairing `ci.yml` documents for `CI complete`. A `merge_group` run
  # whose context is not REQUIRED executes and is ignored, which is worse than
  # today because it looks fixed; a required context with no `merge_group`
  # trigger never reports, and the entry is EJECTED on
  # `check_response_timeout_minutes` with no failing check to explain it.
  # `Acceptance complete` (below) is the context to require.
  merge_group:
  # The MAIN BASELINE (MOTIR-2760) — KEPT as belt-and-braces, and no longer the
  # primary signal. It is the lossy one: every push shares `github.ref`, GitHub
  # holds one pending run per group, and a merge burst evicts the queued ones
  # (23 of 100 runs cancelled with zero jobs, measured in the header above). A
  # detector that misses one merge in four is a poor substitute for a gate, and
  # with `merge_group:` above it is now a second opinion rather than the only
  # one. Retiring it is a separate decision.
  push:
    branches: [main]

# ⚠️ THE GROUP IS PER-COMMIT ON `push`, PER-REF ON `pull_request` (MOTIR-4095).
# `cancel-in-progress: false` is NOT enough to protect a main baseline, and the
# comment that used to stand here said it was. It governs the run that is
# already EXECUTING; GitHub separately holds only ONE PENDING run per group, and
# a third event in that group EVICTS the queued one. Every push to `main` shares
# `github.ref`, so a merge burst cancelled the middle baselines before they ran
# a single job — measured on 2026-09-01 at 23 of the last 100 `push: main` runs,
# every one of them `cancelled` with ZERO jobs, each at the instant the next
# merge's run was created. That is one merge in four with no baseline at all,
# which is precisely the "which merge broke the lane?" ambiguity MOTIR-2760
# added this trigger to remove.
#
# So the group is keyed on the COMMIT for a push — two merges are never in the
# same group, nothing is ever queued behind anything, and nothing is evicted —
# and on the REF for a pull request, where superseding the older run is the
# saving we want (MOTIR-2760) and `github.ref` is `refs/pull/<n>/merge`, so a PR
# cancels only itself. `tests/ci-acceptance-lane.test.ts` asserts this by
# RESOLVING the expression against a fabricated context rather than matching its
# text — the group is arithmetic, not structure.
#
# ⚠️ AND `ci.yml` KEEPS THE PER-REF FORM ON PURPOSE — do not "finish the job"
# there. It evicts harder (33 of its last 100 `push: main` runs, same
# measurement, all with zero jobs), and MOTIR-3760 read that and ruled it NOT a
# defect: ci.yml's main run answers "does the trunk build, and does it deploy",
# and the survivor of a burst carries every commit before it, so the answer it
# gives is still true. THIS lane answers a different question — WHICH merge
# broke a spec — and "the survivor carries every commit before it" is exactly
# the ambiguity that destroys. Same expression, different product: that is why
# the fix is scoped to this file.
#
# ⚠️ THE GROUP CARRIES `github.workflow`, WHICH IS THIS FILE'S `name:` — so the
# MOTIR-4096 rename changed the group's literal prefix. That is harmless and was
# checked rather than assumed: the group only ever has to distinguish runs of
# THIS workflow from each other, and every run after the rename reads the same
# new name. Nothing outside this file joins the group.
#
# Safe interpolation: github.workflow is a fixed workflow name; github.ref is a
# validated git ref identifier and github.sha a 40-character commit id (neither
# is user-controlled free-form input).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # PR-ONLY (MOTIR-2760). On a PR only the tip matters, so cancelling a
  # superseded run saves minutes. On `main` cancelling would destroy the
  # baseline's whole product — which merge broke the lane. Note this line alone
  # never protected it: see the eviction above.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is there anything in the lane to run? (MOTIR-2760.) A checkout and an `ls` —
  # no Postgres, no install, no build — so an empty lane costs ~10 seconds per
  # merge instead of the 18 machine-minutes the full fan-out costs to run zero
  # tests (measured: run 31740853229).
  #
  # ⚠️ ON `pull_request` THIS JOB NOW OWNS THE PATHS DECISION (MOTIR-4257).
  # It used to return `true` unconditionally, because the `on: paths:` filter had
  # already decided. That filter is gone — see the long note on the trigger — so
  # the decision it made is made HERE instead, against the same five paths, and
  # the heavy jobs downstream are gated exactly as they were. What is no longer
  # true is the second half of the old note: this DOES return `false` sometimes
  # on a PR, and that does reintroduce the greyed `Skipped` check MOTIR-1949
  # removed. Deliberate, and argued on the trigger.
  #
  # MOTIR-2600's intent is preserved exactly: a PR that only restructures the
  # lane matches `.github/workflows/acceptance-tests.yml` or the config, so it
  # still runs against whatever membership it leaves behind, empty or not.
  #
  # `merge_group` and `push` are untouched and fall through to the membership
  # count: in the queue the lane runs whenever it holds a spec, with no paths
  # filter anywhere near it, which is the whole gate MOTIR-4257 adds.
  membership:
    name: Does the lane hold a spec?
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 0.3–0.6 min → 10 (~17x, the short-job floor). It only reads
    # the changed-file list and decides whether the lane holds a spec.
    timeout-minutes: 10
    # Reads the PR's changed-file list through the API (`pull-requests: read`);
    # everything else this lane does needs nothing.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      count: ${{ steps.gate.outputs.count }}
      # The DERIVED fan-out (MOTIR-2908). `shards` is a JSON array the shard
      # job's matrix reads through `fromJSON`; `legs` is the same number as a
      # scalar, for the `--shard=i/N` denominator and the job name.
      shards: ${{ steps.gate.outputs.shards }}
      legs: ${{ steps.gate.outputs.legs }}
      regression_run: ${{ steps.gate.outputs.regression_run }}
      regression_count: ${{ steps.gate.outputs.regression_count }}
      regression_shards: ${{ steps.gate.outputs.regression_shards }}
      regression_legs: ${{ steps.gate.outputs.regression_legs }}
    steps:
      - uses: actions/checkout@v6
        with:
          # A `merge_group` entry diffs `base_sha...head_sha` below, and the
          # three-dot form needs the merge base, which a shallow clone lacks.
          fetch-depth: 0
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The queue entry names its own base and head (the same pair ci.yml's
          # `changes` job reads, MOTIR-5124).
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # The lane's membership is whatever `playwright.acceptance.config.ts`
          # would collect: testMatch '**/acceptance*.spec.ts', i.e. a BASENAME
          # starting with `acceptance`. `epic2-acceptance.spec.ts` is therefore
          # NOT a member (it rides the main lane) — match the glob, not the word.
          COUNT=$(find tests/e2e -maxdepth 1 -name 'acceptance*.spec.ts' -type f | wc -l | tr -d ' ')
          echo "acceptance specs in the lane: ${COUNT}"
          LANE_PATHS='^tests/e2e/acceptance[^/]*\.spec\.ts$|^\.github/workflows/acceptance-tests\.yml$|^playwright\.acceptance\.config\.ts$|^tests/e2e/_helpers/acceptance-(video|diagnostics)\.ts$'
          if [ "${EVENT_NAME}" = 'pull_request' ]; then
            # THE PATHS FILTER, moved here from `on:` (MOTIR-4257). Same five
            # entries, same meaning: a spec in the lane, the lane's workflow, its
            # Playwright config, or either helper the specs import. Matched as
            # anchored basenames/prefixes so a path that merely CONTAINS one of
            # these names does not count.
            #
            # `--paginate` matters: the endpoint returns 30 files a page, and a
            # PR whose acceptance spec sorts onto page two would otherwise read
            # as touching nothing — a silent false negative, which is exactly the
            # failure mode this card exists to remove.
            #
            # ⚠️ THE FIELD IS `filename`, NOT `path` (MOTIR-4327). The REST
            # endpoint `GET /repos/{o}/{r}/pulls/{n}/files` returns objects keyed
            # `filename`; there is no `path` key on them at all, and `gh`'s jq
            # prints an EMPTY LINE rather than an error for a key that is not
            # there — so `-q '.[].path'` yielded one blank line per changed file,
            # the grep below never matched, and RUN was `false` on every single
            # pull request for half a day while `Acceptance complete` stayed
            # green. The trap is that `gh pr view --json files` DOES call it
            # `path`: that is gh's own normalised projection, not this API's
            # shape, and the two are one command apart.
            CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate -q '.[].filename')
            if printf '%s\n' "${CHANGED}" | grep -qE "${LANE_PATHS}"
            then
              RUN=true
            else
              RUN=false
            fi
            echo "changed files: $(printf '%s\n' "${CHANGED}" | grep -c . || true)"
          elif [ "${EVENT_NAME}" = 'merge_group' ] && [ "${COUNT}" -gt 0 ]; then
            # THE QUEUE RUNS THE LANE ONLY FOR AN ENTRY THAT TOUCHES IT. The lane
            # is a set of acceptance RECEIPTS (CLAUDE.md), ~148 specs on 6 legs
            # at ~58-65 min per entry against ~34 min for the rest of the gate and
            # a 60-min `check_response_timeout_minutes` -- so it was the long pole
            # and the cause of the CI_TIMEOUT ejections. A spec/lane change already
            # ran on its PR; the `push: main` baseline below still runs the whole
            # lane on the merged result and is the detector for a composed-tree
            # break. `Acceptance complete` still reports (green, no legs).
            #
            # FAIL OPEN: a payload without shas, or a diff that cannot be taken,
            # runs the lane -- an unclassifiable entry is never silently skipped.
            RUN=true
            if [ -n "${MERGE_BASE_SHA:-}" ] && [ -n "${MERGE_HEAD_SHA:-}" ] \
              && CHANGED=$(git diff --name-only "${MERGE_BASE_SHA}...${MERGE_HEAD_SHA}" 2>/dev/null) \
              && [ -n "${CHANGED}" ]; then
              if ! printf '%s\n' "${CHANGED}" | grep -qE "${LANE_PATHS}"; then
                RUN=false
              fi
              echo "changed files: $(printf '%s\n' "${CHANGED}" | grep -c . || true)"
            else
              echo "::warning::No usable merge_group diff -- running the lane."
            fi
          elif [ "${COUNT}" -gt 0 ]; then
            RUN=true
          else
            RUN=false
          fi
          # SIZE THE FAN-OUT FROM THE MEMBERSHIP (MOTIR-2908). One leg per spec,
          # floored at 1 and capped at MAX_LEGS. A leg's cost is almost entirely
          # setup — checkout, Postgres, a Playwright install, the build-artifact
          # download — so a leg that draws no spec is ~3 machine-minutes spent to
          # run nothing, and until this card the lane paid four of them whatever
          # it held. The FLOOR is 1 rather than 0 because a run with no legs at
          # all would stop proving the harness still boots, which is the only
          # thing a lane-definition PR against an empty lane can prove.
          MAX_LEGS=14
          if [ "${COUNT}" -lt 1 ]; then
            LEGS=1
          elif [ "${COUNT}" -gt "${MAX_LEGS}" ]; then
            LEGS="${MAX_LEGS}"
          else
            LEGS="${COUNT}"
          fi
          # The CAP is the lane's full parallelism: at ≥ MAX_LEGS specs the
          # matrix is [1..MAX_LEGS], so a lane that grows gets that many legs and
          # never regresses toward the serial runtime. MOTIR-2600 sized it at 4
          # for 26 specs and 25.7 min of test time. At 87 specs those four legs
          # ran 33–37 min of Playwright each and the slowest job reached 40.9 min
          # against the shard job's then 40-minute timeout, so a green shard was
          # cancelled and the merge queue dropped its PR (MOTIR-7054). Six legs
          # brought the same lane to ~22 min of tests per leg. At 156 specs those
          # six ran 30–51 min of tests each (252 min in all, the slowest leg
          # ~1.2x the mean), and shard 6/6 passed all 57 of its tests and was
          # CANCELLED at 55 during its report upload (MOTIR-9352). Ten legs are
          # ~25 min of tests per leg and ~31 for the slowest. They were not: the
          # shards are contiguous slices of the alphabetical spec list, so a run
          # of heavy specs lands on one leg. On main b08a2ea the ten legs ran
          # 17.6–37.0 min of tests (leg 9/10, `acceptance-platform-planner-model`
          # … `acceptance-surgical-plan`, the slowest), and the build-artifact
          # download alone took 1–14 min per leg. On #3762 (MOTIR-9220) leg 9/10
          # ran 42.4 min of tests, passed all 35, and was CANCELLED at 55 during
          # the video upload, twice. Fourteen legs bring the slowest slice to
          # ~27–30 min, which leaves room for a slow download and the upload.
          # `paste -sd, -`, not `seq -s,`: BSD `seq` puts the separator after the
          # last number too, so on a Mac the list came out `[1,]` — not JSON —
          # and tests/ci-acceptance-lane.test.ts, which runs this snippet on the
          # host, was red there while green here (MOTIR-5364). `paste` is POSIX
          # and joins without a trailing separator under BSD and GNU alike.
          SHARDS="[$(seq 1 "${LEGS}" | paste -sd, -)]"
          echo "legs=${LEGS} shards=${SHARDS}"
          echo "event=${EVENT_NAME} run=${RUN}"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "legs=${LEGS}" >> "$GITHUB_OUTPUT"
          echo "shards=${SHARDS}" >> "$GITHUB_OUTPUT"
          # ── The REGRESSION lane's membership (MOTIR-9411) ───────────────────
          # The same question for `playwright.regression.config.ts`. The done
          # stories' specs keep the acceptance lane's triggers: a PR or queue
          # entry runs them only when it touches the lane's own paths, a push
          # to `main` runs them all, and an empty lane runs nothing.
          #
          # The diff is read again rather than reused from above, because the
          # acceptance branch reads it only while ITS lane holds a spec.
          REGRESSION_COUNT=$(find tests/e2e -maxdepth 1 -name 'regression-*.spec.ts' -type f | wc -l | tr -d ' ')
          echo "regression specs in the lane: ${REGRESSION_COUNT}"
          REGRESSION_PATHS='^tests/e2e/regression-[^/]*\.spec\.ts$|^\.github/workflows/acceptance-tests\.yml$|^\.github/actions/e2e-setup/action\.yml$|^playwright\.(acceptance|regression)\.config\.ts$|^tests/e2e/_helpers/(promoted-regression|acceptance-video|acceptance-diagnostics)\.ts$'
          if [ "${REGRESSION_COUNT}" -lt 1 ]; then
            REGRESSION_RUN=false
          elif [ "${EVENT_NAME}" = 'pull_request' ]; then
            REGRESSION_CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate -q '.[].filename')
            if printf '%s\n' "${REGRESSION_CHANGED}" | grep -qE "${REGRESSION_PATHS}"
            then
              REGRESSION_RUN=true
            else
              REGRESSION_RUN=false
            fi
          elif [ "${EVENT_NAME}" = 'merge_group' ]; then
            # FAIL OPEN, as above: an entry whose diff cannot be taken runs.
            REGRESSION_RUN=true
            if [ -n "${MERGE_BASE_SHA:-}" ] && [ -n "${MERGE_HEAD_SHA:-}" ] \
              && REGRESSION_CHANGED=$(git diff --name-only "${MERGE_BASE_SHA}...${MERGE_HEAD_SHA}" 2>/dev/null) \
              && [ -n "${REGRESSION_CHANGED}" ]; then
              if ! printf '%s\n' "${REGRESSION_CHANGED}" | grep -qE "${REGRESSION_PATHS}"; then
                REGRESSION_RUN=false
              fi
            else
              echo "::warning::No usable merge_group diff -- running the regression lane."
            fi
          else
            REGRESSION_RUN=true
          fi
          # Ten legs, not fourteen: nothing here holds for a viewer, so each leg
          # runs its slice at machine speed.
          REGRESSION_MAX_LEGS=10
          if [ "${REGRESSION_COUNT}" -lt 1 ]; then
            REGRESSION_LEGS=1
          elif [ "${REGRESSION_COUNT}" -gt "${REGRESSION_MAX_LEGS}" ]; then
            REGRESSION_LEGS="${REGRESSION_MAX_LEGS}"
          else
            REGRESSION_LEGS="${REGRESSION_COUNT}"
          fi
          REGRESSION_SHARDS="[$(seq 1 "${REGRESSION_LEGS}" | paste -sd, -)]"
          echo "regression legs=${REGRESSION_LEGS} shards=${REGRESSION_SHARDS} run=${REGRESSION_RUN}"
          echo "regression_run=${REGRESSION_RUN}" >> "$GITHUB_OUTPUT"
          echo "regression_count=${REGRESSION_COUNT}" >> "$GITHUB_OUTPUT"
          echo "regression_legs=${REGRESSION_LEGS}" >> "$GITHUB_OUTPUT"
          echo "regression_shards=${REGRESSION_SHARDS}" >> "$GITHUB_OUTPUT"
          {
            echo "### Acceptance lane membership"
            echo ""
            echo "- specs in the lane: **${COUNT}**"
            echo "- event: \`${EVENT_NAME}\`"
            echo "- running the lane: **${RUN}**"
            if [ "${RUN}" = 'true' ]; then
              echo "- shard legs: **${LEGS}** (one per spec, capped at ${MAX_LEGS})"
            fi
            if [ "${RUN}" = 'false' ] && [ "${EVENT_NAME}" = 'pull_request' ]; then
              echo ""
              echo "This PR touches no acceptance spec, the lane's workflow, its"
              echo "Playwright config or either helper, so the fan-out was"
              echo "skipped (MOTIR-4257). \`Acceptance complete\` still reports —"
              echo "it is a required check — and the full lane runs against the"
              echo "MERGED result when this PR enters the merge queue."
            elif [ "${RUN}" = 'false' ]; then
              echo ""
              echo "The lane is empty, so this baseline stopped here rather than"
              echo "spending machine-minutes to run zero tests (MOTIR-2760)."
            fi
            echo ""
            echo "### Regression lane membership"
            echo ""
            echo "- specs in the lane: **${REGRESSION_COUNT}**"
            echo "- running the lane: **${REGRESSION_RUN}**"
            if [ "${REGRESSION_RUN}" = 'true' ]; then
              echo "- shard legs: **${REGRESSION_LEGS}** (capped at ${REGRESSION_MAX_LEGS})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Compile `.next/` ONCE for the whole fan-out (MOTIR-2600). Mirrors ci.yml's
  # `build` job — same caches, same throwaway module-load env — plus the one thing
  # this lane's build needs and ci.yml's does not: the file email sink and the
  # prod-harness flag that lets it load (see `E2E_PROD_HARNESS` below). Before
  # sharding, every leg would have paid this; now the shards consume the artifact
  # through `e2e-setup`'s existing `next-build: download` path (MOTIR-1706).
  build:
    name: Next.js build (acceptance)
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 4.1–4.6 min → 15 (~3.3x). `next build` grows with the app, so
    # this gets a multiple rather than the floor — the same reading `ci.yml`'s
    # own `build` job took, arrived at from THIS lane's runs.
    timeout-minutes: 15
    needs: membership
    # ⚠️ THE GATE LIVES HERE, ON `build`, AND NOT ON `acceptance` — deliberately.
    # `acceptance` already `needs: build`, so a skipped build skips the shards
    # too, which means the whole fan-out is gated by this ONE expression. Putting
    # a second `if:` on `acceptance` would add nothing and would weaken the
    # MOTIR-1949 guard in `tests/ci-acceptance-lane.test.ts`, which asserts that
    # the shard job carries no job-level `if:` at all. That assertion is worth
    # keeping literally true: it is what stops a future edit from gating the
    # SHARDS on something PR-visible.
    if: needs.membership.outputs.run == 'true'
    env:
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      BETTER_AUTH_SECRET: ci-e2e-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-e2e-placeholder
      GOOGLE_CLIENT_SECRET: ci-e2e-placeholder
      EMAIL_PROVIDER: file
      EMAIL_OUTBOX_PATH: /tmp/motir-test-emails.jsonl
      # REQUIRED HERE, unlike ci.yml's build (MOTIR-1967). `next build` forces
      # NODE_ENV=production, under which `lib/email.ts`'s file provider refuses to
      # load (it is a test-only sink) and page-data collection dies on any route
      # that imports it. ci.yml's build job has no EMAIL_PROVIDER at all and never
      # hits it.
      # `E2E_PROD_HARNESS=1` is the shipped relaxation for exactly this case, and
      # the same flag `playwright.acceptance.config.ts` sets on its webServer.
      # Never set on a real deploy.
      E2E_PROD_HARNESS: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      # `pnpm build` runs `prisma migrate deploy`, so the build needs a database
      # even though nothing queries it — same reason ci.yml's build job has one.
      - name: Start Postgres
        uses: ./.github/actions/postgres
      - uses: ./.github/actions/pnpm
      - name: Cache node_modules
        id: cache-node-modules-acceptance-build
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Prisma client
        id: cache-prisma-acceptance-build
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: ${{ runner.os }}-prisma-client-${{ hashFiles('prisma/schema.prisma') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-acceptance-build.outputs.cache-hit != 'true'
      - run: pnpm prisma generate
        if: steps.cache-prisma-acceptance-build.outputs.cache-hit != 'true'
      - run: pnpm build
      - name: Upload .next/ build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  acceptance:
    name: Playwright E2E (acceptance) ${{ matrix.shard }}/${{ needs.membership.outputs.legs }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # ⚠️ DERIVED FROM THIS LANE, NOT COPIED FROM `e2e`. The acceptance specs
    # are an order of magnitude heavier than ordinary E2E per test, so the
    # number next door is not evidence about this one either way. First sized
    # at 4.9–11.3 min per shard → 40 (~3.5x). The lane then grew to 87 specs on
    # four legs, and every leg ran 33–41 min: on PR #3277 and in merge-queue run
    # 36721238788, shard 4/4 passed all 37 of its tests and was CANCELLED at 40
    # during the ~72 s report upload, which dropped green PRs from the queue.
    # MOTIR-6973 raised this 40 → 55 (~1.5x the slowest measured leg), and
    # MOTIR-7054 took the lasting fix, the leg cap (`MAX_LEGS`, 4 → 6): six legs
    # are ~22 min of tests plus ~5 min of setup and upload, so 55 is now ~2x on
    # a slow runner and still catches a hung leg. When the lane grows back
    # toward it, raise the cap first, not this number. It did (MOTIR-9352): at
    # 156 specs the sixth leg ran 51 min of tests and was cancelled here, so the
    # cap went 6 → 10 (~31 min for the slowest leg) and this number stayed.
    # Ten legs measured 17.6–42.4 min of tests, and leg 9/10 was cancelled here
    # with every test passed (MOTIR-9220), so the cap went 10 → 14 and this
    # number stayed again.
    timeout-minutes: 55
    # BOTH edges, and each is load-bearing (MOTIR-2908):
    #   · `build` publishes the `.next/` artifact every leg downloads, and it is
    #     where the MOTIR-2760 gate lives — a skipped build skips the fan-out.
    #   · `membership` is where the leg count is DERIVED, and a job can only read
    #     the outputs of a job it needs. This is the ONLY reason the edge exists;
    #     it adds no gating (`membership` always runs) and no `if:` to this job.
    needs: [membership, build]
    strategy:
      # Every leg runs to completion: a red shard must not cancel the legs that
      # are still recording, or one failure costs the run every other shard's
      # report — the artifact a red lane is debugged from at all (MOTIR-1706).
      fail-fast: false
      matrix:
        # SIZED FROM THE LANE'S MEMBERSHIP (MOTIR-2908) — `[1]` … `[1, …, 14]`,
        # derived by the `membership` gate above. It was a literal `[1, 2, 3, 4]`
        # from MOTIR-2600 until MOTIR-2765 gave a spec a lifecycle and MOTIR-2769
        # triaged the lane empty; four legs over ≤2 specs is not parallelism, it
        # is four copies of the setup. The cap is 14 since MOTIR-9220 (10 since
        # MOTIR-9352, 6 since MOTIR-7054).
        shard: ${{ fromJSON(needs.membership.outputs.shards) }}
    # `id-token: write` is BACK, and on THIS job only (MOTIR-7253). The publish
    # step requests a GitHub OIDC token (audience `motir-acceptance-video`), which
    # the server resolves through the App-connected `repository` claim
    # (`lib/github/oidcAuth.ts`, `lib/publishAuth/ciPublishAuth.ts`) — so no
    # secret is needed and none is referenced. It was retired with the publisher
    # on 2026-09-01 (MOTIR-4096). No other job in this workflow gets it: `build`
    # and `membership` publish nothing. GitHub mints no OIDC token for a fork PR,
    # and the uploader then logs why and exits 0. `contents: read` is what
    # checkout needs.
    permissions:
      contents: read
      id-token: write
    # Postgres is started by ./.github/actions/postgres (first step below), NOT
    # by a `services:` block — see that action's header for why (MOTIR-1742).
    #
    # The env below is deliberately identical to ci.yml's `e2e` job — same DB,
    # same module-load placeholders, same file-email outbox. Workflows cannot
    # share an env block, so it is repeated rather than shared. Change both
    # together.
    env:
      # In CI Postgres runs on the standard 5432.
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      # See ci.yml's build job for the rationale on these throwaway values.
      # Better-Auth's module-load requiredEnv check needs them present;
      # the actual OAuth round-trip is intercepted by the undici MockAgent
      # in instrumentation.ts (E2E_TEST_OAUTH=1 below).
      BETTER_AUTH_SECRET: ci-e2e-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-e2e-placeholder
      GOOGLE_CLIENT_SECRET: ci-e2e-placeholder
      EMAIL_PROVIDER: file
      EMAIL_OUTBOX_PATH: /tmp/motir-test-emails.jsonl
      # REQUIRED HERE, unlike ci.yml (MOTIR-1967). The BUILD that needed it moved
      # to this workflow's own `build` job (MOTIR-2600), which carries the same
      # pair — see the rationale there. It stays on this job too because the same
      # NODE_ENV=production relaxation is what lets the runner-side seed reach the
      # `file` email sink and the `/api/_test` seeding routes; the webServer gets
      # it from `playwright.acceptance.config.ts` either way. Never set on a real
      # deploy.
      E2E_PROD_HARNESS: '1'
      E2E_TEST_OAUTH: '1'
      E2E_TEST_OAUTH_USER_PATH: /tmp/motir-test-oauth-user.json
      # Skip the husky install postinstall — CI has no .git/hooks to wire.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres
        uses: ./.github/actions/postgres
      # The same setup ci.yml's E2E legs run — one definition, two callers. It
      # takes the `.next/` the `build` job above published: `download` reads an
      # artifact of the SAME workflow run, which is exactly what this is
      # (MOTIR-2600 — before sharding this job built it itself, which four legs
      # would have paid four times).
      - uses: ./.github/actions/e2e-setup
        with:
          next-build: download
      # A CJK FONT, SO A RECEIPT'S zh CHAPTER IS READABLE (MOTIR-7393). The
      # ubuntu runner ships no Chinese font, so every zh chapter recorded here
      # rendered as empty boxes, and a person cannot accept what they cannot read.
      # The assertions never saw it, because they read the DOM's text, not pixels.
      #
      # ⚠️ NOT FROM APT (MOTIR-9350). This step used to `apt-get update && apt-get
      # install fonts-noto-cjk` on every leg: ~100 MB from the Ubuntu mirror, six
      # times a run, nothing cached. A slow mirror window timed out all three
      # 300s attempts and failed a leg before a single test ran (run 39937057551,
      # shard 2/6: `attempt 1 failed (status 124)` ×3, ~16 min, no test), and a
      # leg that got through could still spend 10m39s here. Now the two faces
      # the recordings use — Noto Sans CJK Regular and Bold, the same 2.004
      # release Ubuntu 24.04's fonts-noto-cjk packages — come from the Actions
      # cache, and only a miss fetches them: two pinned files, each checked
      # against its sha256, with no `apt-get update` anywhere. Each .ttc is a
      # Pan-CJK collection (SC, TC, HK, JP, KR), so zh, zh-TW, ja and ko all draw.
      # To move the pin, change FONT_REF and both sums below AND the cache key.
      #
      # ⚠️ AND IT MUST NOT CHANGE A SINGLE LATIN GLYPH. Installed as it ships,
      # Noto CJK went ahead of the runner's own fonts, so characters the page's
      # web font lacks — the em dash, the ellipsis — fell back to its FULL-WIDTH
      # forms. Lines grew, a banner wrapped, a terminal lost a row, and an
      # unrelated receipt went red on a scrolled-off line. So the families that
      # answered BEFORE the install are pinned back in front of it, and the step
      # fails if any of those fallbacks now answers differently.
      - name: Restore the CJK font from the cache
        id: cjk-font-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/motir-cjk-font
          key: ${{ runner.os }}-cjk-font-noto-sans-2.004-b76b0433-faa5f365
      - name: Install a CJK font for the recordings
        id: cjk-font
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cjk-font-cache.outputs.cache-hit }}
          FONT_REF: Sans2.004
          FONT_SUMS: |
            b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  NotoSansCJK-Regular.ttc
            faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  NotoSansCJK-Bold.ttc
        run: |
          if fc-list :lang=zh 2>/dev/null | grep -q .; then echo "a CJK font is present"; exit 0; fi
          command -v fc-match >/dev/null || { echo "::error::fontconfig (fc-match) is not on this runner"; exit 1; }
          FONT_DIR="$HOME/.cache/motir-cjk-font"
          mkdir -p "$FONT_DIR"
          probe() {
            for q in sans-serif serif monospace 'sans-serif:charset=2014' 'sans-serif:charset=2026' 'monospace:charset=2014'; do
              printf '%s=%s\n' "$q" "$(fc-match -f '%{family[0]}' "$q" 2>/dev/null)"
            done
          }
          before="$(probe)"
          echo "fallbacks before:"; echo "$before"
          if (cd "$FONT_DIR" && printf '%s' "$FONT_SUMS" | sha256sum --check --quiet --strict >/dev/null 2>&1); then
            echo "CJK font restored from the cache"
          else
            [ "$CACHE_HIT" = "true" ] && echo "::warning::the cached CJK font failed its checksum; fetching it again"
            while read -r sum file; do
              [ -n "$file" ] || continue
              url="https://raw.githubusercontent.com/notofonts/noto-cjk/${FONT_REF}/Sans/OTC/${file}"
              if ! curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -o "$FONT_DIR/$file" "$url"; then
                echo "::error::could not fetch the CJK font: ${url} (expected sha256 ${sum})"; exit 1
              fi
              got="$(sha256sum "$FONT_DIR/$file" | cut -d' ' -f1)"
              if [ "$got" != "$sum" ]; then
                echo "::error::the CJK font from ${url} has sha256 ${got}, expected ${sum}"; exit 1
              fi
            done <<< "$FONT_SUMS"
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi
          sudo install -d -m 755 /usr/local/share/fonts/noto-cjk
          sudo install -m 644 "$FONT_DIR"/NotoSansCJK-*.ttc /usr/local/share/fonts/noto-cjk/
          sudo fc-cache -f >/dev/null
          [ -n "$(fc-list :lang=zh)" ] || { echo "::error::the CJK font is installed but fontconfig finds no zh face"; exit 1; }
          # The pre-install families first again, for every generic family — the
          # CJK font then answers only the characters none of them has.
          {
            echo '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>'
            for generic in sans-serif serif monospace; do
              family="$(printf '%s\n' "$before" | sed -n "s/^${generic}=//p")"
              [ -n "$family" ] && echo "<alias binding=\"strong\"><family>${generic}</family><prefer><family>${family}</family></prefer></alias>"
            done
            echo '</fontconfig>'
          } | sudo tee /etc/fonts/conf.d/99-latin-before-cjk.conf >/dev/null
          sudo fc-cache -f >/dev/null
          after="$(probe)"
          echo "fallbacks after:"; echo "$after"
          if [ "$before" != "$after" ]; then
            echo "::error::installing the CJK font changed a Latin fallback"; exit 1
          fi
      # Saved the moment a leg fetched, not at the job's end: a leg whose tests
      # then fail still leaves the font for the next run. Legs that miss
      # together race for the key, and every loser only logs a warning.
      - name: Save the CJK font to the cache
        if: steps.cjk-font.outputs.fetched == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/motir-cjk-font
          key: ${{ steps.cjk-font-cache.outputs.cache-primary-key }}

      # WHICH specs this PR owns (restored by MOTIR-7253 from MOTIR-1937). The
      # uploader publishes a recording only when its OWN spec is in this list:
      # publishing SUPERSEDES a story's current receipt, and each recording
      # targets its own declared story, so a run that published everything it
      # recorded would replace the receipt of every story in the lane (measured
      # once: one PR republished seven). Computed per LEG — the diff is the same
      # on every shard, and each leg publishes the intersection of "specs this PR
      # changed" with "recordings this leg produced", which are disjoint across
      # legs and together cover the set, so every receipt publishes exactly once.
      # A `push` or `merge_group` run has no PR base, so the list is EMPTY and the
      # uploader — which fails closed on an empty list — publishes nothing. The
      # publish step is ALSO `if:`-gated to `pull_request`: two mechanisms,
      # because a wrong answer here supersedes a story's evidence.
      - name: Which acceptance specs does this run own?
        id: owned-specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            echo "no base ref (event: ${GITHUB_EVENT_NAME}) — this run owns no specs and publishes nothing"
            echo "specs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull_request checkout is the MERGE commit at depth 1, which carries
          # both parents — so the base is normally already present. Fetch it if it
          # is not, rather than paying `fetch-depth: 0` on every run.
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
            git fetch --depth=1 origin "${BASE_SHA}"
          SPECS=$(git diff --name-only "${BASE_SHA}" HEAD -- 'tests/e2e/acceptance*.spec.ts' | tr '\n' ' ')
          echo "owned acceptance specs: ${SPECS:-<none>}"
          echo "specs=${SPECS}" >> "$GITHUB_OUTPUT"

      # `--shard=i/N` (MOTIR-2600). Playwright partitions the suite across the
      # legs, so every spec is run by exactly one of them — which is what makes
      # the per-leg publish step below publish each receipt once.
      # N is `needs.membership.outputs.legs` rather than a matrix key
      # (MOTIR-2908): the denominator has to be the SAME number the matrix was
      # built from, and reading both from the one output is what guarantees that.
      # `--pass-with-no-tests` (MOTIR-2769): the lane's membership is now exactly
      # the stories currently IN REVIEW, so an EMPTY lane is a legitimate — and
      # after a triage, common — state rather than a misconfiguration. Playwright
      # exits non-zero on "no tests found" by default, which would red-light every
      # PR that touches this workflow or the config while no story is in flight.
      # A shard leg can also legitimately draw zero specs once the lane is small.
      - name: Run E2E (acceptance)
        run: pnpm test:e2e --config playwright.acceptance.config.ts --pass-with-no-tests --shard=${{ matrix.shard }}/${{ needs.membership.outputs.legs }}

      # On a GREEN `pull_request` run, publish the recordings this PR owns to
      # their OWN story's acceptance panel (MOTIR-7253). Each recording resolves
      # its story from its `acceptance-story.json` sidecar (`acceptanceStory()`),
      # then the PR's card key. `producedByKey` is the PR's own card key (ref,
      # then title), so an agent that still publishes the same commit over MCP
      # collapses into the same receipt instead of superseding it.
      #
      # Auth is keyless GitHub OIDC — the job's `id-token: write` above. The
      # action's `token` input is deliberately NOT passed: it is the PAT path for
      # a repository with no Motir GitHub App connection, which this is not.
      #
      # ⚠️ NO `continue-on-error` (MOTIR-2499). It once rewrote this step's
      # conclusion to `success` while every publish failed, and two stories lost
      # their receipt with nothing saying so. The cases that must not fail the
      # lane are handled INSIDE the uploader, which exits 0 for each: no OIDC
      # token (a fork PR), a story that is closed (`ACCEPTANCE_EVIDENCE_STORY_CLOSED`),
      # and a defect in a recording this PR does not own. What does fail it is a
      # story this PR owns ending the run without a receipt.
      #
      # ⚠️ `pull_request` ONLY (MOTIR-2760). The main baseline and the merge
      # queue run the specs and publish nothing: the receipt belongs to the
      # moment the story was in review.
      - name: Publish the acceptance receipt
        if: success() && github.event_name == 'pull_request'
        uses: ./.github/actions/upload-acceptance-video
        with:
          base-url: ${{ vars.MOTIR_BASE_URL || 'https://app.motir.co' }}
          pr-ref: ${{ github.head_ref }}
          pr-title: ${{ github.event.pull_request.title }}
          fallback-story-key: MOTIR-1627
          changed-specs: ${{ steps.owned-specs.outputs.specs }}

      # Always upload the report. A green run's report is where the recorded
      # video, trace and `chapters.json` survive for a reviewer to watch by hand,
      # beside the receipt the step above published — and a red one is how the
      # lane is debugged at all (MOTIR-1706: the old hardcoded
      # `out/playwright-report` path matched nothing here, so a red acceptance leg
      # left no trace, screenshot or report behind).
      # ⚠️ The name is SHARD-SCOPED (MOTIR-2600). upload-artifact v4+ rejects a
      # second upload under a name that already exists, so a single name would
      # red-light every leg but the first at its last step and leave the run
      # without the reports a red lane is read from. Still true at a DERIVED leg
      # count (MOTIR-2908): `matrix.shard` is `1..N` and distinct within a run at
      # every N, so the names stay distinct without depending on N being 4. It
      # also carries the `client-diagnostics.json` MOTIR-2600's fixture attaches
      # on failure.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-acceptance-shard-${{ matrix.shard }}
          path: out/playwright-report-acceptance
          retention-days: 7

  # ── THE REGRESSION LANE (MOTIR-9411) ──────────────────────────────────────
  #
  # The done stories' acceptance specs, renamed `regression-*.spec.ts` and run
  # without pacing or recording by `playwright.regression.config.ts`. They keep
  # the acceptance lane's TRIGGERS — a PR or queue entry that touches the lane's
  # own paths, and every push to `main` — so moving them out of the receipt lane
  # puts nothing new on an ordinary pull request. The gate is the `membership`
  # step above (its `regression_*` outputs).
  #
  # Its OWN build job, and not a second consumer of `build`, so neither lane's
  # shards ever run because the OTHER lane's gate opened: `acceptance` carries no
  # job-level `if:` (the MOTIR-1949 guard) and is gated only through `build`. The
  # artifact takes its own name because upload-artifact refuses a second
  # artifact under a name already taken in the same run.
  regression-build:
    name: Next.js build (regression)
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 5.5–6.5 min on its first runs (PR #3776) → 15, the same ceiling
    # as the acceptance `build` it mirrors: one `pnpm build`, nothing else.
    timeout-minutes: 15
    needs: membership
    if: needs.membership.outputs.regression_run == 'true'
    env:
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      BETTER_AUTH_SECRET: ci-e2e-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-e2e-placeholder
      GOOGLE_CLIENT_SECRET: ci-e2e-placeholder
      EMAIL_PROVIDER: file
      EMAIL_OUTBOX_PATH: /tmp/motir-test-emails.jsonl
      E2E_PROD_HARNESS: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres
        uses: ./.github/actions/postgres
      - uses: ./.github/actions/pnpm
      - name: Cache node_modules
        id: cache-node-modules-regression-build
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Prisma client
        id: cache-prisma-regression-build
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: ${{ runner.os }}-prisma-client-${{ hashFiles('prisma/schema.prisma') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-regression-build.outputs.cache-hit != 'true'
      - run: pnpm prisma generate
        if: steps.cache-prisma-regression-build.outputs.cache-hit != 'true'
      - run: pnpm build
      - name: Upload .next/ build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build-regression
          path: .next
          retention-days: 1
          include-hidden-files: true

  # The regression shards. Derived from `acceptance` above with the recording
  # half removed: no owned-spec list, no receipt publish, no OIDC token. Video
  # and trace are kept only for a failure (`playwright.regression.config.ts`).
  regression:
    name: Playwright E2E (regression) ${{ matrix.shard }}/${{ needs.membership.outputs.regression_legs }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 8.4–18.3 min per green leg on its first runs (PR #3776, ten legs,
    # no pacing) → 55, the acceptance shards' ceiling. Kept that high because a
    # leg's slice moves as the lane grows, and the build download alone has taken
    # up to 14 min on this fleet (see the acceptance shard's note).
    timeout-minutes: 55
    needs: [membership, regression-build]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.membership.outputs.regression_shards) }}
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      BETTER_AUTH_SECRET: ci-e2e-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-e2e-placeholder
      GOOGLE_CLIENT_SECRET: ci-e2e-placeholder
      EMAIL_PROVIDER: file
      EMAIL_OUTBOX_PATH: /tmp/motir-test-emails.jsonl
      E2E_PROD_HARNESS: '1'
      E2E_TEST_OAUTH: '1'
      E2E_TEST_OAUTH_USER_PATH: /tmp/motir-test-oauth-user.json
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres
        uses: ./.github/actions/postgres
      - uses: ./.github/actions/e2e-setup
        with:
          next-build: download
          next-build-artifact: next-build-regression
      - name: Restore the CJK font from the cache
        id: cjk-font-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/motir-cjk-font
          key: ${{ runner.os }}-cjk-font-noto-sans-2.004-b76b0433-faa5f365
      - name: Install a CJK font for the zh assertions and font probes
        id: cjk-font
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cjk-font-cache.outputs.cache-hit }}
          FONT_REF: Sans2.004
          FONT_SUMS: |
            b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  NotoSansCJK-Regular.ttc
            faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  NotoSansCJK-Bold.ttc
        run: |
          if fc-list :lang=zh 2>/dev/null | grep -q .; then echo "a CJK font is present"; exit 0; fi
          command -v fc-match >/dev/null || { echo "::error::fontconfig (fc-match) is not on this runner"; exit 1; }
          FONT_DIR="$HOME/.cache/motir-cjk-font"
          mkdir -p "$FONT_DIR"
          probe() {
            for q in sans-serif serif monospace 'sans-serif:charset=2014' 'sans-serif:charset=2026' 'monospace:charset=2014'; do
              printf '%s=%s\n' "$q" "$(fc-match -f '%{family[0]}' "$q" 2>/dev/null)"
            done
          }
          before="$(probe)"
          echo "fallbacks before:"; echo "$before"
          if (cd "$FONT_DIR" && printf '%s' "$FONT_SUMS" | sha256sum --check --quiet --strict >/dev/null 2>&1); then
            echo "CJK font restored from the cache"
          else
            [ "$CACHE_HIT" = "true" ] && echo "::warning::the cached CJK font failed its checksum; fetching it again"
            while read -r sum file; do
              [ -n "$file" ] || continue
              url="https://raw.githubusercontent.com/notofonts/noto-cjk/${FONT_REF}/Sans/OTC/${file}"
              if ! curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -o "$FONT_DIR/$file" "$url"; then
                echo "::error::could not fetch the CJK font: ${url} (expected sha256 ${sum})"; exit 1
              fi
              got="$(sha256sum "$FONT_DIR/$file" | cut -d' ' -f1)"
              if [ "$got" != "$sum" ]; then
                echo "::error::the CJK font from ${url} has sha256 ${got}, expected ${sum}"; exit 1
              fi
            done <<< "$FONT_SUMS"
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi
          sudo install -d -m 755 /usr/local/share/fonts/noto-cjk
          sudo install -m 644 "$FONT_DIR"/NotoSansCJK-*.ttc /usr/local/share/fonts/noto-cjk/
          sudo fc-cache -f >/dev/null
          [ -n "$(fc-list :lang=zh)" ] || { echo "::error::the CJK font is installed but fontconfig finds no zh face"; exit 1; }
          {
            echo '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>'
            for generic in sans-serif serif monospace; do
              family="$(printf '%s\n' "$before" | sed -n "s/^${generic}=//p")"
              [ -n "$family" ] && echo "<alias binding=\"strong\"><family>${generic}</family><prefer><family>${family}</family></prefer></alias>"
            done
            echo '</fontconfig>'
          } | sudo tee /etc/fonts/conf.d/99-latin-before-cjk.conf >/dev/null
          sudo fc-cache -f >/dev/null
          after="$(probe)"
          echo "fallbacks after:"; echo "$after"
          if [ "$before" != "$after" ]; then
            echo "::error::installing the CJK font changed a Latin fallback"; exit 1
          fi
      - name: Save the CJK font to the cache
        if: steps.cjk-font.outputs.fetched == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/motir-cjk-font
          key: ${{ steps.cjk-font-cache.outputs.cache-primary-key }}
      - name: Run E2E (regression)
        run: pnpm test:e2e --config playwright.regression.config.ts --pass-with-no-tests --shard=${{ matrix.shard }}/${{ needs.membership.outputs.regression_legs }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-regression-shard-${{ matrix.shard }}
          path: out/playwright-report-regression
          retention-days: 7

  # ── THE REQUIRED CONTEXT (MOTIR-4257) ───────────────────────────────────────
  #
  # One aggregate the ruleset can name, for the same reason `ci.yml` has
  # `CI complete`: this lane's shards are a MATRIX, so their check names carry
  # `1/N` and change with the derived leg count (MOTIR-2908). A ruleset cannot
  # require a context whose name moves, and requiring one leg would gate on a
  # shard rather than on the lane.
  #
  # ⚠️ `always()` AND the explicit result assertion — neither works alone, and
  # `ci-complete` carries the same pair for the same reasons:
  #   • without `always()` this job SKIPS whenever a need skips (a skipped need
  #     makes its dependents skip, not fail), so a queue entry whose lane held
  #     no spec would leave the required context ABSENT — and an absent-because-
  #     skipped required check counts as satisfied, so the gate would also pass
  #     over a red lane;
  #   • `always()` ALONE removes the implicit all-needs-succeeded condition, so
  #     this job would run and go GREEN beside a FAILED shard. The step below is
  #     what turns `failure` / `cancelled` into a red gate.
  acceptance-complete:
    name: Acceptance complete
    if: always()
    needs: [membership, build, acceptance, regression-build, regression]
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed <0.1 min → 10 (the short-job floor) — MEASURED on this lane's
    # first run, not copied from `ci-complete`: 04:05:41 → 04:05:43, two
    # seconds. It reads the `needs` context and exits, and the clock starts when
    # the JOB starts, so waiting on the shards costs it nothing.
    timeout-minutes: 10
    # Reads nothing, writes nothing.
    permissions: {}
    steps:
      - name: Assert every needed job succeeded or was skipped
        # `toJSON(needs)` travels through the environment rather than being
        # spliced into the script, so no job name or result can be read as shell.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          # Capture first, THEN test: under `pipefail` a `jq | grep` pipeline
          # reports the wrong command's status when the interesting command is
          # the one allowed to find nothing.
          bad=$(jq -r 'to_entries[]
                       | select(.value.result != "success" and .value.result != "skipped")
                       | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            while read -r line; do
              echo "::error::Acceptance incomplete — job ${line%%=*} finished as ${line#*=}"
            done <<<"$bad"
            exit 1
          fi
          echo "Every job in this workflow succeeded or was skipped."
