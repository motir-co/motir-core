# The Motir CI RUNNER image — build, assert, prove, publish (MOTIR-1978)
#
# ONE definition, called from two places — the shape `sandbox-images.yml`
# established, and for the same reason: a publish lane that built the image its
# own way could ship an artifact no assertion ever touched.
#
#   - `ci.yml` on every pull request, with `publish: false` — build, assert,
#     prove it boots. The merge gate.
#   - `release-runner-image.yml` on a `runner-v*` tag, with `publish: true` — the
#     SAME build and the SAME checks, and only then a push to GHCR.
#
# The push is a LATER STEP of the job that just proved the image works, so a
# green build is the release gate rather than a separate trust decision.
#
# ── What this workflow EMITS, and why it is the digest and not a tag ─────────
#
# `MOTIR_RUNNER_IMAGE` (read by `lib/orchestrator/adapters/fly/flyMachines.ts` →
# `flyFleetConfig()`) takes a DIGEST reference, never a tag. §7.2 of
# `docs/decisions/ci-runner-fleet.md` requires it: the fleet's containers execute
# agent-authored customer code, and a mutable tag under that workload is the
# supply-chain hole the whole ephemerality posture was bought to close. A tag
# that moved between the boot decision and the pull would silently change what
# ran. So the publish job emits `sha256:…` as its `digest` output (and prints it
# into the job summary), and `release-runner-image.yml`'s `pin` job opens the
# pull request that writes that exact reference into
# `infra/image-pins/motir-runner-image`, which the AWS deploy applies
# (MOTIR-10883).
#
# NOT here: signing, SBOM, provenance attestation — the same deliberate omission
# `sandbox-images.yml` records, and its own decision.

name: Runner image

on:
  workflow_call:
    inputs:
      publish:
        description: 'Push the asserted + proven image to GHCR (release lane only).'
        type: boolean
        default: false
      version:
        description: 'Version for the immutable tag (release lane; e.g. 1.0.0).'
        type: string
        default: ''
    outputs:
      digest:
        description: 'The sha256 digest that was published (empty on the PR lane).'
        value: ${{ jobs.runner-image.outputs.digest }}

env:
  # OCI repository names are lowercase-only, so the `moooon-B-V` org is spelled
  # lowercase here — `ghcr.io/Motir-Co/...` is not a pullable reference at all.
  # Hardcoded rather than derived from `github.repository_owner` for that reason
  # (the same trap `sandbox-images.yml` documents).
  IMAGE: ghcr.io/motir-co/motir-ci-runner

jobs:
  runner-image:
    name: Build, assert, prove
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 1.7–5.4 min across ten runs of both callers → 20 (~3.7x on the
    # worst, 5.38 min on ci.yml run 33218152057).
    #
    # ⚠️ THIS BLOCK USED TO ATTRIBUTE THAT SPREAD TO "BuildKit cache warmth, not
    # load — the same job is 1.7 min with a warm layer cache and 5.4 with a cold
    # one". THAT SENTENCE WAS FALSE, and it is corrected rather than deleted
    # because a ceiling nobody can re-derive is a ceiling the next reader invents
    # (MOTIR-5124).
    #
    # ⚠️ AND THE SENTENCE THAT REPLACED IT WAS ALSO WRONG, IN THE OTHER
    # DIRECTION — CORRECTED AGAIN HERE RATHER THAN DELETED (MOTIR-5126). It read
    # "**No run of this job restores a layer cache from an earlier run — every
    # build here is cold**". That is FALSE, and the falsifying run was already
    # inside the sample it was written from: run 34586771845 restored `#9`,
    # `#11`–`#15` in its FIRST build and finished `Build the image` in **35 s**.
    #
    # The true rule is the one the old text used half of: a GitHub Actions cache
    # is readable from **the ref that WROTE it, or from the DEFAULT branch**.
    # Both halves matter. The second half is why 34586771845 was warm — the
    # merge queue re-formed the group on an identical base sha, so the same
    # branch NAME occurred twice and the second run read what the first wrote:
    #
    #   34583080235  09:13:14  1036 s  COLD — wrote the scope
    #   34586771845  09:57:05    35 s  WARM — read it back, same ref
    #
    # ⚠️ SO THE DEFECT IS NARROWER AND WORSE THAN "IT NEVER WORKS": it works
    # only when the identical ref recurs, which is a re-run or a regrouped queue
    # entry — LUCK, not a mechanism. Every genuinely new ref is cold by
    # construction, and that is most of them. A cache that works sometimes, for
    # reasons nobody chose, is one people reason about as though it works.
    #
    # The `#N CACHED` layers a reader finds in a green log are USUALLY from the
    # job's SECOND build — `Export an OCI layout to measure`, which hits the
    # cache the FIRST build wrote seconds earlier in the same run. Read the LINE
    # NUMBERS: `CACHED` before the second `importing cache manifest` line is a
    # real restore; after it is not. Grepping for `CACHED` cannot tell them
    # apart, and that is how both wrong sentences above got written.
    #
    # ⚠️ SO THE SPREAD IS RUNNER NETWORK THROUGHPUT, and that is why 20 STAYS
    # rather than being re-derived. Three cold builds of the same Dockerfile,
    # measured at the `Build the image` step:
    #
    #   34544907175 (pull_request, PR #2782)  165 s  — apt: 32.6 MB in 2 s      (19.9 MB/s)
    #   34575315881 (merge_group, pr-2787)    918 s  — apt: 32.6 MB in 53 s     (613 kB/s)
    #   34583414138 (merge_group, pr-2797)  CANCELLED — apt: 38.3 MB in 13m46s  (46.4 kB/s)
    #
    # Per layer: `#9` 12.4 s → 106.0 s → 961.4 s; `#12` 21.4 s → 377.3 s → still
    # resolving at the cut. A 430x throughput swing on one external mirror.
    #
    # ⚠️ AND THE THIRD ROW IS WHY NO NUMBER IS THE ANSWER. At the 20-minute cut
    # that build had finished ONE layer and was 85 s into `#12`, which had just
    # announced `Need to get 96.8 MB of archives` — at the rate it was being
    # served, ~35 further minutes for that layer alone. **Raising the ceiling to
    # 30 or 40 would not have saved it either**, and this is not a rare tail:
    # sampled over the 21 most recent completed runs of this job, **11 were
    # CANCELLED at this ceiling** (1159–1180 s) against 9 successes (35 · 361 ·
    # 703 · 774 · 918 · 938 · 1036 · 1080 s) and 1 failure. The successes cluster
    # against the cap, the cancellations are right-CENSORED at it, and one of the
    # cancellations is a `pull_request` run (34575851960) — so this is not a
    # merge-queue property either.
    #
    # ⚠️ AND THIS REPOSITORY HAS ALREADY REFUSED THIS KNOB, THREE TIMES, FOR THIS
    # MIRROR. MOTIR-1679 removed an apt source, MOTIR-2970 added a 300 s cap plus
    # retry, MOTIR-3128 re-shaped the class, and MOTIR-3143 states the standing
    # rule outright: *"Do NOT raise the retry count or the timeout. That is the
    # move already made twice; it lowers probability and leaves the class."* A
    # ceiling is a bound on a wedged build, not a budget for a degraded network.
    #
    # ⚠️ SO WHAT ACTUALLY FIXES IT IS THE CACHE, AND THAT IS MOTIR-5126, NOW
    # SHIPPED — see the block beside `cache-to:` below. A restored layer cache
    # makes `#9` and `#12` `CACHED` and takes apt off the critical path
    # entirely; the mirror stops being able to decide whether this lane passes.
    # The 1036 s / 35 s pair above is the same Dockerfile on the same branch,
    # cold against warm, and that 30x is what a readable scope buys.
    #
    # ⚠️ THE CEILING STAYS AT 20 ANYWAY. A warm build does not need it and a
    # cold one is not saved by it (the third row above needed roughly an hour),
    # so nothing here re-derives it — and the first build after an image input
    # changes is still cold-ish and still apt-bound.
    #
    # MOTIR-5124 narrowed WHICH batches reach this build — `ci.yml`'s `changes`
    # job now classifies a `merge_group` batch instead of waving it through, so a
    # queue entry builds only when it touches an image input. **That removes the
    # unnecessary runs and does nothing for the necessary ones**, which are still
    # a coin flip on the mirror; do not read it as having closed this.
    #
    # ⚠️ MOTIR-3768's own card cited `1.3 min` here from ci.yml run
    # 33167406878, where this job was SKIPPED by its path filter — so that
    # figure measures nothing. The numbers above come from runs where it ran.
    #
    # This ceiling has to live HERE — `ci.yml`'s `runner-image` job calls this
    # workflow with `uses:`, and GitHub does not accept `timeout-minutes` on a
    # `uses:` job (MOTIR-3768).
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      # Static assertions run BEFORE the build: a floating tag or a lost §7.4
      # guarantee is knowable from the source alone, and finding it after a
      # ten-minute image build is ten minutes wasted on every red run.
      - name: Assert the sources
        run: infra/ci-runner/smoke/assert-image.sh --sources

      # Mirror-first — a bare `setup-buildx-action` pulls its builder, the
      # `# syntax=` frontend, and this image's `FROM ubuntu@…` base anonymously
      # from Docker Hub, and dies in ~30 s when Hub blips (MOTIR-2018).
      - uses: ./.github/actions/buildx

      # linux/amd64 only — Fly Machines are x86-64 and the fleet runs in `iad`
      # (§8, §11). No QEMU leg, unlike the sandbox matrix.
      #
      # The context is `infra/ci-runner`, NOT the repo root: the image contains
      # nothing from motir-core's tree, and a root context would ship the whole
      # checkout into a container that runs customer code.
      # ── THE CACHE SCOPE, AND WHO IS ALLOWED TO READ IT (MOTIR-5126) ────────
      #
      # THE FACT THIS RESTS ON: a GitHub Actions cache entry is readable from
      # the ref that WROTE it, or from the repository's DEFAULT branch. Nothing
      # else. So `refs/heads/main` is the only scope every other ref can read,
      # and a `cache-from` naming a scope no `main` run ever wrote imports
      # nothing — silently, because `#N importing cache manifest from gha:<id>`
      # / `DONE 0.0s` prints identically whether the scope holds a manifest or
      # is empty.
      #
      # NOT a documentation claim — this repository demonstrates both halves:
      #   • the DEFAULT-BRANCH half: `Linux-corepack-11.2.2` and
      #     `Linux-pnpm-store-…` live on `refs/heads/main` and a `pull_request`
      #     run restores them (run 34582658507, `Lint + Prettier`). Same cache
      #     service, different client.
      #   • the SAME-REF half: 34583080235 (1036 s) then 34586771845 (35 s), one
      #     queue branch name that recurred. See the ceiling block above.
      #
      # WHAT WAS WRONG: every writer of a buildx scope here sat on an ephemeral
      # or non-default ref — `ci.yml` carried `github.event_name != 'push'`, and
      # the two release workflows are tag-triggered — so `refs/heads/main` held
      # no buildx index at all, and no ref could read another's. Verified off
      # the live list on 2026-09-11:
      #
      #   gh api --paginate \
      #     "/repos/moooon-B-V/motir-core/actions/caches?per_page=100" \
      #     --jq '.actions_caches[] | select(.ref=="refs/heads/main") | .key'
      #
      # returned the six `actions/cache@v4` entries and two orphan
      # `buildkit-blob-…` rows — and NO `index-*`. A blob without an index is
      # unreachable, so that is an empty scope with debris in it.
      #
      # THE FIX: a THIRD entry point — `.github/workflows/image-cache-main.yml`
      # — calls this workflow on a push to `main` with `publish: false`, purely
      # to WRITE the scope this `cache-to:` names. The directives below are
      # untouched, and `ci.yml` keeps its `!= 'push'` gates.
      #
      # ⚠️ WHY A SEPARATE WORKFLOW RATHER THAN DROPPING THAT `!= 'push'`, which
      # was the obvious change: `ci.yml` groups concurrency on
      # `${{ github.workflow }}-${{ github.ref }}` and does NOT cancel on a push
      # (MOTIR-3106), so its push runs QUEUE — and `deploy` is in them. Anything
      # added to that lane joins the critical path of the NEXT merge's release,
      # and the sandbox matrix carries a 50-minute per-profile ceiling. It would
      # have re-created MOTIR-3106's defect in its slow form: a delayed deploy
      # rather than a starved one, which nothing reports.
      #
      # ⚠️ THE OTHER DECISION, because both answers are defensible and the next
      # reader should not have to re-derive it: the write is GATED on the image
      # inputs (an `on.push.paths:` filter carrying the same set as `ci.yml`'s
      # `images` classifier), NOT run on every push.
      #   • Cost. Ungated, every merge pays a full sandbox matrix to refresh a
      #     scope whose inputs did not change. Gated, the write happens exactly
      #     when the previous scope went stale anyway — and that build is itself
      #     warm off the previous write rather than cold.
      #   • The quiet-stretch risk is real and SELF-HEALING. GHA evicts an entry
      #     after 7 days without access, so a fortnight with no image-input
      #     change lets `main`'s scope go cold. It costs exactly one cold build:
      #     the same gate means no pull request runs these lanes in that stretch
      #     either, so nothing wanted the scope while it was absent, and the next
      #     image-touching merge rewrites it.
      #   • Budget. The per-repository cache allowance is 10 GB and the sandbox
      #     blobs are hundreds of MB each, so writing every scope on every merge
      #     competes with the entries this change exists to KEEP — LRU eviction
      #     would be choosing between them. Gating keeps the long-lived copies
      #     few and constantly read.
      # If the scope is ever found cold on a busy week, that is the gate being
      # too narrow: widen the path set (both copies — they are pinned to each
      # other by a test), never drop the gate.
      #
      # `tests/ci-changed-paths-gate.test.ts` pins the load-bearing halves —
      # that the writer runs on `main`, that its path set equals the classifier's,
      # and that it has its own concurrency group. Without them a quiet edit puts
      # the cache back to unreadable with every log line and every directive
      # below still looking exactly as it does now.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: infra/ci-runner
          file: infra/ci-runner/Dockerfile
          platforms: linux/amd64
          tags: motir-ci-runner:smoke
          load: true
          cache-from: type=gha,scope=ci-runner
          cache-to: type=gha,scope=ci-runner,mode=max

      - name: Assert the built image
        run: infra/ci-runner/smoke/assert-image.sh --image motir-ci-runner:smoke

      # Quoted: an unquoted scalar containing `: ` is a YAML mapping, and this
      # step name has one.
      - name: 'Prove it boots and can run a services: container'
        run: infra/ci-runner/smoke/prove-boot.sh --image motir-ci-runner:smoke

      # ── The image's TOOL LIST, measured, so it can travel with the image ────
      # (MOTIR-10290). The fleet readiness verdict judges every private
      # repository's fleet jobs against the commands the PINNED image can run,
      # and reads them from the `co.motir.ci-runner.tools` label the push below
      # stamps — so pinning a new digest updates the comparison, and nobody keeps
      # a second list by hand. Measured on every lane, so a PR that breaks the
      # measurement is red before a release depends on it.
      - name: Record the image's tool list
        id: tools
        run: |
          set -euo pipefail
          tools=$(infra/ci-runner/smoke/list-tools.sh --image motir-ci-runner:smoke)
          count=$(printf '%s' "$tools" | tr ',' '\n' | grep -c .)
          if [ "$count" -lt 50 ]; then
            echo "::error::the tool list holds only ${count} commands — the measurement is broken."
            exit 1
          fi
          echo "tools=${tools}" >> "$GITHUB_OUTPUT"
          echo "MOTIR_RUNNER_IMAGE_TOOLS count=${count}"

      # ── Size, because §6 makes it a term in the boot budget ────────────────
      # Image pull sits inside §6's 10–25 s Machine-create leg, and MOTIR-1928
      # measures the real p50/p95 against that budget. A number recorded here is
      # what a later regression can be attributed to — without it, "boot got
      # slower" has no decomposition.
      #
      # The COMPRESSED size is what matters (it is what crosses the network), so
      # it is summed from the OCI layer blobs rather than read off `docker image
      # inspect`, which reports the extracted size. The export is a cache hit on
      # the build above.
      # Exported through the ACTION, not a raw `docker buildx build`: a bare run
      # step has no `ACTIONS_RUNTIME_TOKEN`, so `--cache-from type=gha` there
      # would miss the cache the build above just wrote and rebuild every layer.
      - name: Export an OCI layout to measure
        uses: docker/build-push-action@v6
        with:
          context: infra/ci-runner
          file: infra/ci-runner/Dockerfile
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/runner-image.tar
          cache-from: type=gha,scope=ci-runner

      - name: Measure the compressed size
        id: size
        run: |
          set -euo pipefail
          mkdir -p /tmp/oci && tar -xf /tmp/runner-image.tar -C /tmp/oci
          # Every blob: the compressed layers plus the manifest and config,
          # which together are a few KB against hundreds of MB. This is what
          # actually crosses the network on a pull.
          compressed=$(find /tmp/oci/blobs -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          extracted=$(docker image inspect motir-ci-runner:smoke --format '{{.Size}}')
          compressed_mb=$(awk -v b="$compressed" 'BEGIN {printf "%.0f", b/1048576}')
          extracted_mb=$(awk -v b="$extracted"  'BEGIN {printf "%.0f", b/1048576}')
          echo "compressed_mb=${compressed_mb}" >> "$GITHUB_OUTPUT"
          echo "extracted_mb=${extracted_mb}"   >> "$GITHUB_OUTPUT"
          # Also to STDOUT, not only to the step summary. A summary is readable
          # by a human in the UI and by nothing else — no API returns it — and
          # the reason this number is recorded at all is so MOTIR-1928 can
          # attribute a boot-latency regression to it. A figure only a person
          # can retrieve does not serve that.
          echo "MOTIR_RUNNER_IMAGE_SIZE compressed=${compressed_mb}MB extracted=${extracted_mb}MB"
          {
            echo "### Motir CI runner image"
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Compressed (pulled over the network) | **${compressed_mb} MB** |"
            echo "| Extracted (on the Machine's rootfs) | ${extracted_mb} MB |"
            echo
            echo "Pull time is a term in \`docs/decisions/ci-runner-fleet.md\` §6's 10–25 s"
            echo "Machine-create leg. MOTIR-1928 measures the real p50/p95 against it."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Release lane only, and only now that the image above is proven ──────
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both tags are conveniences for humans reading the registry. NEITHER is
      # what the fleet consumes — `MOTIR_RUNNER_IMAGE` takes the digest below.
      - name: Push to GHCR
        if: ${{ inputs.publish }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: infra/ci-runner
          file: infra/ci-runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # The two OCI labels say which commit and repository these bytes were
          # built from; the daily health check's runner-image-freshness step reads
          # the revision to report a merged image change that was never released
          # and pinned (MOTIR-10393).
          labels: |
            co.motir.ci-runner.tools=${{ steps.tools.outputs.tools }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ci-runner
          cache-to: type=gha,scope=ci-runner,mode=max

      # "The push step exited 0" is not the same claim as "the fleet can boot
      # this". This pulls back BY DIGEST — the only reference that names the
      # exact bytes — and re-runs the image assertions against what was actually
      # published, which is the same move `sandbox-images.yml`'s verify job makes.
      - name: Verify the published image BY DIGEST
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          digest='${{ steps.push.outputs.digest }}'
          if [ -z "$digest" ]; then
            echo "::error::the push produced no digest — the release is incomplete."
            exit 1
          fi
          ref="${IMAGE}@${digest}"
          docker pull "$ref"
          docker tag "$ref" motir-ci-runner:published
          infra/ci-runner/smoke/assert-image.sh --image motir-ci-runner:published
          # The label must describe THESE bytes: re-measure the published image
          # and compare (MOTIR-10290). A mismatch would have readiness judge jobs
          # against tools the fleet does not boot.
          recorded=$(docker image inspect motir-ci-runner:published \
            --format '{{ index .Config.Labels "co.motir.ci-runner.tools" }}')
          measured=$(infra/ci-runner/smoke/list-tools.sh --image motir-ci-runner:published)
          if [ -z "$recorded" ] || [ "$recorded" != "$measured" ]; then
            echo "::error::the co.motir.ci-runner.tools label does not match the published image's tools."
            exit 1
          fi
          revision=$(docker image inspect motir-ci-runner:published \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [ "$revision" != "${GITHUB_SHA}" ]; then
            echo "::error::the org.opencontainers.image.revision label is '${revision}', not the commit built (${GITHUB_SHA})."
            exit 1
          fi
          {
            echo
            echo "### Published"
            echo
            echo "| Reference | Value |"
            echo "| --- | --- |"
            echo "| Digest | \`${digest}\` |"
            echo "| Pull by digest | \`${ref}\` |"
            echo
            echo "\`MOTIR_RUNNER_IMAGE\` takes \`${ref}\` — the digest, never a tag (§7.2)."
            echo "The release lane's \`pin\` job opens the pull request that pins it (MOTIR-10883)."
          } >> "$GITHUB_STEP_SUMMARY"
