# Publishes the Motir sandbox images to GHCR (Subtask 7.9.7e · MOTIR-1788).
#
# Trigger: push the PACKAGE-SCOPED tag `cli-v<x.y.z>` — the same tag that
# releases `@motir/cli` itself (8.7.9), so the `motir` binary baked into the
# image and the one on npm are the same version by construction. A monorepo
# must scope its release tags per package (`design-system-v*` is the existing
# precedent); a bare `v*` would fire for the app too.
#
# There is deliberately NO push-to-main trigger. A `:latest` that moves on every
# merge is not a sandbox anyone can reproduce a run in — the whole point of the
# immutable `:<profile>-<version>` tag and the recorded digest is that a BYOK
# user can pin the exact image Motir itself was run in.
#
# Release procedure (see packages/cli/sandbox/README.md → "Publishing"):
#   1. bump packages/cli/package.json `version`
#   2. open + merge the PR
#   3. git tag cli-v<x.y.z> && git push origin cli-v<x.y.z>
#   4. this workflow builds, smoke-tests, publishes, pulls each image back by
#      digest — and then the `readme` job below RECORDS the digest table in the
#      sandbox README, as a commit on main (MOTIR-2699). Nothing to do by hand.
#      Step 4 used to read "copy its digest table into the sandbox README", and
#      that copy was made by hand for four releases and skipped in one of them.
#
# `workflow_dispatch` with `dry_run: true` runs the whole lane WITHOUT pushing —
# how you validate a change to the release path without minting a version.

name: Release sandbox images

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + smoke only; skip the GHCR push'
        type: boolean
        default: false

# Never let two releases of the same tag run concurrently, and never cancel one
# in flight — a half-cancelled multi-arch push leaves a tag pointing at a
# manifest whose layers were never all uploaded.
concurrency:
  group: release-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  # The SAME repository `sandbox-images.yml` publishes to, and lowercase for the
  # same reason: OCI repository names are lowercase-only, so
  # `ghcr.io/Motir-Co/...` is not a reference docker will resolve at all. Two
  # files name it now that this lane also RECORDS what was published;
  # `packages/cli/test/sandboxCi.test.ts` asserts the two spellings are identical,
  # which is the drift guard the profile matrix already gets.
  IMAGE: ghcr.io/motir-co/motir-sandbox

jobs:
  # Fail fast if the tag and the package version disagree: the tag is the human
  # intent, package.json is what actually gets baked into the image tags. A
  # mismatch means someone forgot to bump (or retagged wrong), and it would ship
  # `:claude-0.1.0` off a `cli-v0.2.0` tag. Same guard as
  # release-design-system.yml.
  guard:
    name: Guard — tag version must equal the @motir/cli version
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 0.2–0.3 min across five runs → 10 (~37x, the short-job floor).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Also on a dispatch ON A TAG — the console's Publish latest re-publish of a
      # release (MOTIR-10886) runs on the `cli-v*` ref itself.
      - name: Compare the tag against packages/cli/package.json
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          echo "Tag version: $TAG_VERSION  ·  package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$TAG_VERSION' but packages/cli/package.json is '$PKG_VERSION'. Bump the package version to match the tag, or retag."
            exit 1
          fi

  # The SAME matrix `ci.yml` runs on every pull request — build, liveness, smoke
  # — with the push steps switched on. Auth is the workflow's own GITHUB_TOKEN
  # under `packages: write`: no new account, no long-lived secret, nothing
  # provisioned out of band. `packages: write` is granted HERE, on the release
  # lane only, so the pull-request lane physically cannot push.
  images:
    name: Sandbox images
    needs: guard
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sandbox-images.yml
    with:
      publish: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

  # ── The RECORD, written by the release rather than retyped from it (MOTIR-2699)
  #
  # `sandbox-published` and `sandbox-public` check CLAIMS about the artifact. This
  # job writes the artifact's RECORD: the § Published images section of
  # packages/cli/sandbox/README.md, which exists so a BYOK user can pin the exact
  # image a run happened in.
  #
  # It used to be step 4 of the release procedure above, performed by a human who
  # opened the verify job's summary page and retyped nine digests into a file.
  # That page is the one place a repository cannot read, which is why the handoff
  # existed at all — and over four releases it cost a card, a branch, a pull
  # request and a review each time, then lapsed once (`cli-v0.3.0`, PR #2043).
  # Stale, the table does not error: every pin in it still resolves, to the
  # PREVIOUS release's images.
  #
  # Three properties belong to the script rather than to this YAML, so they are
  # unit-tested (`packages/cli/test/sandboxDigestTable.test.ts`):
  #   * the digests come from the REGISTRY over an ANONYMOUS pull — MOTIR-2220 is
  #     on record that the run's job summary is not the authority — and are
  #     cross-checked against what the push jobs recorded, so a digest that
  #     disagrees fails the release instead of being written;
  #   * the two invariants the section CLAIMS are asserted, not restated in prose:
  #     each moving tag matches its immutable twin, and every digest differs from
  #     the previous release's row;
  #   * a release with nothing to change writes NOTHING, so re-running a tag
  #     cannot produce an empty commit (or, under the pull-request variant, train
  #     a reviewer to close empty bot PRs unread).
  #
  # ⚠️ Why a PULL REQUEST and not a commit — REVERSED at MOTIR-3967, and the
  # reasoning it replaces is kept because both of its premises were true when
  # written and both have since changed.
  #
  # It used to commit straight to `main`, justified as: "`main` is unprotected,
  # the content is machine-derived and machine-checked, and there is nothing in it
  # for a reviewer to judge". A pull request was ruled out because the repository's
  # Actions permissions have "Allow GitHub Actions to create and approve pull
  # requests" OFF (`GET /repos/:owner/:repo/actions/permissions/workflow` returns
  # `can_approve_pull_request_reviews: false`), so `gh pr create` under the job's
  # own GITHUB_TOKEN is a 403 — shipping that path would have failed at the last
  # step of every release until someone flipped a switch.
  #
  # ⚠️ PREMISE ONE IS GONE: `main` is NOT unprotected. It carries a merge-queue
  # ruleset, and the first release cut through this lane proved what that means —
  # the push was refused outright, three times, and the digests went unrecorded:
  #
  #   remote: error: GH013: Repository rule violations found for refs/heads/main.
  #   remote: - Required status check "CI complete" is expected.
  #   remote: - Changes must be made through the merge queue
  #
  # The rebase-and-retry loop below could not help: it was written for the race it
  # names (a merge landing between checkout and push), and a ruleset is not a race.
  #
  # ⚠️ PREMISE TWO NEVER APPLIED TO AN APP TOKEN. That Actions setting is still
  # OFF — it constrains `GITHUB_TOKEN`, not a GitHub App installation token.
  # `release.yml` has been opening the Version Packages pull request with the
  # RELEASE_APP token all along, which is standing proof an App token creates pull
  # requests here regardless of that switch. So the path the old comment said this
  # "becomes ... if that setting is ever turned on" is available now, without
  # turning anything on.
  #
  # Using the App token also fixes the coverage note the old comment made a virtue
  # of: a GITHUB_TOKEN push triggers no workflow run, so the old commit started no
  # CI. Here that would be fatal rather than merely thin — a pull request whose
  # checks never run can never satisfy `CI complete` and so can never leave the
  # queue. The App token triggers them, so this pull request can actually merge.
  readme:
    name: Record the published digests in the sandbox README
    needs: images
    # Only a real tag has something to record: a dry-run dispatch publishes
    # nothing, so there are no digests to read and no release to write about.
    # A non-dry dispatch ON A `cli-v*` TAG is a real release too: it is how the
    # console's Publish latest re-publishes a partial release (MOTIR-10886), and
    # the tags it pushes need their digests recorded like a tag push's.
    if: >-
      ${{ github.event_name == 'push' || (
        github.event_name == 'workflow_dispatch' && !inputs.dry_run &&
        startsWith(github.ref, 'refs/tags/cli-v')
      ) }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # NO run on record — it is gated `if: github.event_name == 'push'` and the
    # five most recent runs of this workflow were dispatches, so it has been
    # skipped in every one. No observed minutes to quote → 10 min, the
    # short-job floor taken as a STATED FLOOR rather than a measurement. It
    # checks out, rewrites one README table and pushes.
    timeout-minutes: 10
    permissions:
      # Read only, and nothing else — no `packages:` scope, so this job cannot
      # touch the registry it reads. It no longer needs `contents: write`: the
      # branch push and the pull request are both made with the App installation
      # token below, not with the automatic one. Downloading this run's own
      # artifacts uses the Actions runtime token and needs no scope here.
      contents: read
    steps:
      # The same App the release lane uses (MOTIR-3969). Minted here because the
      # automatic token cannot open a pull request in this repository — see the
      # header — and because a pull request pushed with the automatic token would
      # never run its own checks and so could never leave the merge queue.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          # Persisted for the branch push below.
          token: ${{ steps.app-token.outputs.token }}
          # `main`, NOT the tag. A tag-triggered run checks out the TAG's tree,
          # and the file this record belongs in is the one on the branch — writing
          # the tag's copy would silently revert whatever main has learned since
          # the tag was cut. The script comes from main for the same reason: a fix
          # to this lane should apply to a re-run of an older tag.
          ref: main
      - name: Download the published digests
        uses: actions/download-artifact@v7
        with:
          pattern: sandbox-digest-*
          merge-multiple: true
          path: digests
      - name: Write the § Published images section
        id: render
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node packages/cli/sandbox/smoke/render-digest-table.mjs \
            --image "$IMAGE" \
            --version "${TAG#cli-v}" \
            --profiles packages/cli/sandbox/smoke/profiles.json \
            --digests digests \
            --readme packages/cli/sandbox/README.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --write
      # ⚠️ THE GATE MUST AGREE WITH THE DIFF (Bug MOTIR-3989).
      #
      # The step below is CONDITIONAL, and a condition that reads false skips it
      # silently, leaving this job and the whole run GREEN. That is exactly how
      # `cli-v0.4.0` published nine images and recorded none of their digests:
      # the render wrote the file and reported `inserted the cli-v0.4.0
      # section`, its `changed` output never reached `$GITHUB_OUTPUT` (an
      # unawaited `appendFile` racing `process.exit`), and the commit was
      # skipped with nothing anywhere saying so.
      #
      # The race itself is fixed in `render-digest-table.mjs`, which now writes
      # that output synchronously. This step is the BACKSTOP for the class: any
      # future reason the gate disagrees with the working tree fails the lane
      # instead of quietly not recording a release. It is deliberately
      # unconditional — a guard behind an `if:` is the thing being guarded
      # against.
      - name: The commit gate agrees with the working tree
        env:
          CHANGED: ${{ steps.render.outputs.changed }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/cli/sandbox/README.md; then
            on_disk=unchanged
          else
            on_disk=modified
          fi
          echo "render output changed='${CHANGED:-<empty>}' · working tree: ${on_disk}"
          if [ "$on_disk" = 'modified' ] && [ "${CHANGED:-}" != 'true' ]; then
            echo "::error::The digest table was RENDERED (the README differs from HEAD) but the commit gate reads '${CHANGED:-<empty>}', so the commit step will be skipped and this release would record no digests. See Bug MOTIR-3989."
            exit 1
          fi
      - name: Open the digest record as a pull request
        if: ${{ steps.render.outputs.changed == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Authored as Yue with NO co-author trailer: motir-core runs a
          # `license/cla` check whose only signatory is that identity, so it is
          # the one authorship every other commit in this repository also carries.
          git config user.name 'Zhu Yue'
          git config user.email 'zhuyue11@gmail.com'
          git commit \
            --author='Zhu Yue <zhuyue11@gmail.com>' \
            -m "docs(sandbox): record the ${TAG} published image digests" \
            -m "Written by the release lane (MOTIR-2699). Every digest is the one GHCR serves to an ANONYMOUS pull, cross-checked against the digest the push recorded; both invariants the section claims were asserted before it was written." \
            -- packages/cli/sandbox/README.md

          # One branch per tag, so a re-run of the SAME tag updates its own pull
          # request instead of opening a second one. Force is correct and confined:
          # the branch belongs to this tag's record and to nothing else, and the
          # commit was just built from a fresh checkout of `main`.
          branch="chore/sandbox-digests-${TAG}"
          git push --force origin "HEAD:${branch}"

          # `gh pr create` fails when a pull request for the branch already exists,
          # which is the re-run case and not an error — the force-push above has
          # already updated it. Ask first rather than parsing the failure.
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "::notice::Updated existing pull request #${existing} with the ${TAG} digest record."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs(sandbox): record the ${TAG} published image digests" \
            --body "$(printf '%s\n' \
              "Opened by the sandbox release lane for \`${TAG}\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))." \
              '' \
              'Every digest in this table is the one GHCR serves to an **anonymous** pull, cross-checked against the digest the push recorded. Both invariants the section claims were asserted before it was written, so there is nothing here for a reviewer to re-derive — merging it is the whole review.' \
              '' \
              'The images are already published; this is only the record of them. Leaving it unmerged loses no artifact, but the README then understates what was released.')"
          echo "::notice::Opened the ${TAG} digest record as a pull request."
