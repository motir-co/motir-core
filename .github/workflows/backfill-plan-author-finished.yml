name: Backfill plan authorFinished

# Manual operator action (Task MOTIR-10491): record `authorFinished: true` on every
# finished card of a plan that was already open (generating, planned or stale) when
# the stored author state shipped (MOTIR-10490), through
# `planAuthorFinishedBackfillService` — one predicate, `carryOverVerdict`, shared by
# the dry run and the real run. Never a rule re-implemented here.
#
# WHY A BACKFILL. A driver sends the state when an author session finishes, and core
# stamps a card written by hand. A card finished before that shipped has no session
# left to send it, so once the readers switch to the stored state it would read as
# unwritten and be authored again on the plan's next resume.
#
# IDEMPOTENT + SAFE TO RE-RUN: a stamped card is left alone next time, so a second
# run stamps 0. Each plan commits in its own transaction, under the plan lock.
# `workflow_dispatch` ONLY, mirroring `backfill-fix-reason.yml`: a data backfill is an
# explicit operator decision. Running it on production is MOTIR-10495.
#
# DEFAULTS TO A DRY RUN — read the per-workspace counts before applying. The optional
# `workspace` input narrows a first run to one tenant.
#
# Inert until the SEED_DATABASE_URL secret is set: the guard step detects the
# missing secret and SKIPS (the job stays green with a notice).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only — judge and print, write nothing'
        type: boolean
        required: false
        default: true
      workspace:
        description: 'Narrow to one workspace id (empty = every workspace)'
        type: string
        required: false
        default: ''

# Never run two sweeps at once. Each is idempotent, but two sweeps stamping the same
# plan would queue on its row lock for no benefit. One at a time; don't cancel an
# in-flight run, which would leave a partial sweep whose report nobody sees.
concurrency:
  group: backfill-plan-author-finished
  cancel-in-progress: false

jobs:
  backfill:
    name: Record authorFinished on the finished cards of open plans
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # The same 60-minute headroom as the sibling backfills (the ciState sweep's
    # measured floor, MOTIR-5765). This sweep's candidates are the undecided plans,
    # a small set; its `progress` lines are the measurement to tighten from.
    timeout-minutes: 60
    env:
      # The production (unpooled) connection string — the SAME secret the sibling
      # backfills use. Empty when unset; the guard step skips.
      DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
      # Defensive parity with the sibling backfills: this script does not import the
      # Better-Auth instance today, but wiring them costs nothing and keeps the job
      # working if a transitive import ever pulls it in (its requiredEnv check needs
      # all three at module load). The GOOGLE_* values only register the OAuth
      # provider; no round-trip happens.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: backfill-placeholder
      GOOGLE_CLIENT_SECRET: backfill-placeholder
      # No git hooks to wire in CI.
      HUSKY: '0'
    steps:
      # Gate the whole job on the secret being present. `secrets.*` can't be used in
      # a job/step `if:`, but a step CAN read it into an env var and branch — so an
      # unconfigured repo skips (green) instead of failing at migrate.
      - name: Check SEED_DATABASE_URL is configured
        id: guard
        env:
          SEED_DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          if [ -z "$SEED_DATABASE_URL" ]; then
            echo "::notice::SEED_DATABASE_URL is not set — skipping the authorFinished backfill. Add it under Settings → Secrets and variables → Actions to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6
      - if: steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/pnpm
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma generate
      # Make sure the target DB carries every table the sweep reads before sweeping it.
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma migrate deploy
      # `--dry-run` and `--workspace=<id>` are passed only when their input asks for
      # them, by a shell branch rather than an expression-interpolated argument: an
      # empty interpolation would pass an EMPTY STRING, which the script's own
      # argument parser rejects as an unknown argument.
      - if: steps.guard.outputs.enabled == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          set --
          if [ -n "$WORKSPACE" ]; then
            set -- "--workspace=$WORKSPACE"
          fi
          if [ "$DRY_RUN" = "false" ]; then
            echo "::warning::Applying the authorFinished backfill — this WRITES."
            pnpm db:backfill:author-finished "$@"
          else
            pnpm db:backfill:author-finished --dry-run "$@"
          fi
