# Re-attempt a red or cancelled push-to-`main` CI run — at most once, visibly
# (MOTIR-4607; re-purposed by MOTIR-11060).
#
# ⚠️ WHAT THE PUSH RUN IS NOW. Since MOTIR-10935 the push-to-`main` run of
# `ci.yml` releases nothing: Motir's own services ship through `aws-deploy.yml`,
# on its own push trigger, needing nothing in `ci.yml`. What the push run still
# is — `ci.yml`'s header — is the TRIPWIRE: `lint`, `typecheck` and `build` over
# the commit that is now `main`, the only verification a merge that BYPASSED the
# queue ever gets (ruleset 17227448 has a bypass actor).
#
# ⚠️ WHY A RED TRIPWIRE STILL NEEDS THIS LANE. A red check on `main` is nobody's
# by construction: no pull request is open to carry it, and nothing notifies the
# person who merged. And two causes give the same red — the merged tree really
# is broken, or the runner, the network or a registry flaked. Without a
# re-attempt the only cure for the second is the next merge, which is a property
# of merge traffic, not of the pipeline; and an alarm raised on the first red
# would page somebody for every flake. So this lane re-runs the red tripwire
# ONCE, and only a second red at `main`'s head becomes a person's problem: an
# issue assigned to whoever merged.
#
# ⚠️ WHAT THIS LANE IS NOT. It does not touch the merge queue, it gates no
# deploy, and it does not replace `deploy-freshness.yml`, which compares the
# DEPLOYED commit against `main` from outside the deployment. A red `aws-deploy`
# run is that lane's to see, not this one's: this lane reads `CI` only.
#
# ⚠️ WHY IT CANNOT LOOP. GitHub's `workflow_run` documentation says "The
# `requested` activity type does not occur when a workflow is re-run", which
# leaves `completed` firing on a re-run: a lane that re-runs on `completed` is
# re-triggered by its own re-run. The bound is the RUN's `run_attempt`, which
# GitHub increments and nobody else writes — attempt 1 may be re-run, attempt 2
# never is (`scripts/mainCiRetry.mjs`, `decideRetry`). The job-level `if:` below
# says the same thing a second time, so an attempt-2 event does not even start a
# runner. And this lane triggers on `CI` only, never on itself.
#
# ⚠️ WHY IT NEVER RE-RUNS AN OLD RUN. A re-run keeps "the same `GITHUB_SHA` …
# of the original event", so it re-checks the OLD tree. Once a newer commit is
# `main`'s head, that tree is no longer anything `main` is: the newer push run's
# tripwire already covers these commits, and if it goes red this lane runs for
# it. A run whose commit is no longer the head is therefore skipped as
# superseded, and it never opens an issue against code `main` has moved past.
#
# ⚠️ AND THE FAILED-TWICE SIGNAL IS AN ISSUE, NOT A RED CHECK — a red check is
# the very thing nobody is looking at. When the re-attempt fails too, the script
# opens (or comments on) an issue labelled `main-ci-failed-twice`, titled by
# commit and ASSIGNED to whoever merged it, so the notification lands on a person
# with a reason to open it. This lane's own run also goes red, as a second,
# weaker channel.
#
# The logic lives in `scripts/mainCiRetry.mjs` (unit-tested, and the runner is
# driven against a fake GitHub API, in `tests/scripts/retry-main-ci.test.ts`,
# which also asserts this file's wiring) — the same thin-caller arrangement as
# `deploy-freshness.yml`.
#
# ⚠️ `workflow_run` "will only trigger a workflow run if the workflow file exists
# on the default branch", so this lane's first real execution is after it
# merges. The tests are what stand in for a run until then.

name: CI on main — retry once

# Safe interpolation: the run id and conclusion are GitHub-generated values, not
# user-controlled text. `display_title` (the commit message) is deliberately NOT
# used here.
run-name: Retry CI run ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }}, ${{ github.event.workflow_run.conclusion }})

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One retry per CI run, never cancelled: a cancelled retry lane is a re-run that
# nobody follows to its verdict.
concurrency:
  group: main-ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  retry:
    name: Re-attempt a red push-to-main CI run once
    # The same bound the script enforces, stated where it costs no runner: only a
    # FIRST attempt of a PUSH run that did not go green is considered at all.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.conclusion != 'neutral'
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Its cost is a checkout, one dependency-free node script, and a poll of the
    # re-run. The poll's own deadline is 75 minutes (`DEADLINE_MINUTES`): the push
    # runs of 2026-11-11 took about 9 to 18 minutes green and 45 red (created →
    # last update, runs 43087522010 to 43123016158), and a re-run can wait behind
    # one pending run in `ci.yml`'s concurrency group. The ceiling sits above
    # that deadline so the script, not the runner, reports a re-run that never
    # finished.
    timeout-minutes: 90
    permissions:
      # Read the run and `main`; re-run the run.
      actions: write
      contents: read
      # The failed-twice signal.
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # No install step: the script is dependency-free, like
      # `scripts/assert-deploy-freshness.mjs`.
      - name: Re-attempt once, and follow it to its verdict
        # The run id arrives as an ENV var rather than being interpolated into
        # the script body — same discipline the rest of the lanes use.
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/retry-main-ci.mjs
