# The HOSTED AGENT image — build, prove, publish (Story MOTIR-683 · Subtask MOTIR-687).
#
# `packages/cli/sandbox/hosted/` is the one-shot container Motir boots per
# hosted run: the Motir CLI's own `motir run`, with OpenCode pinned and
# configured per the gateway's egress contract, and nothing else agent-shaped
# (MOTIR-6560). This workflow is its whole lane:
#
#   - on a PULL REQUEST touching it: build the image, prove it carries no
#     credential, and run the smoke test against the BUILT image. No push.
#   - on a PUSH TO `main` touching it: the SAME build and the SAME proofs, and
#     only then a push to GHCR — printing the DIGEST, because the deployment
#     boots a digest (`MOTIR_HOSTED_AGENT_IMAGE`, docs/decisions/hosted-agent-run.md
#     §6), never a tag. The push is a LATER STEP of the job that just proved the
#     image, so a green build is the publish gate.
#   - after that publish: the `pin` job opens (or updates) ONE pull request that
#     writes the new digest into `infra/hosted-agent-image.ref` (MOTIR-10882).
#     The publish alone changes nothing production boots: merging that pull
#     request is the deliberate pin, the AWS deploy writes the file's image into
#     the `MOTIR_HOSTED_AGENT_IMAGE` secret before it rolls, and reverting it is
#     the rollback. Before this job the digest was only printed, and a person
#     re-pinned by hand — which is how production ran a five-week-old CLI.
#
# ── What it gates on ────────────────────────────────────────────────────────
# Since MOTIR-6560 the image runs the Motir CLI built from THIS checkout, so its
# build context is the repository root (as the sandbox and runner images'
# are) and the CLI's source is an input: a change to `packages/cli/**` changes
# what a hosted run does and rebuilds the image. The workspace manifests and the
# lockfile are inputs too, because the builder stage installs with
# `--frozen-lockfile`, and `.dockerignore` decides what the context carries.

# ── Where the image is read from ────────────────────────────────────────────
# `ghcr.io/motir-co/motir-hosted-agent`. Its recipe is in this public
# repository, so by `docs/decisions/fleet-image-pull.md` §1 it is published
# PUBLIC and the fleet pulls it anonymously. Pulling the published digest from
# the fleet — the production check — is MOTIR-6386's (under the dogfood story),
# because it can only happen after this lane has published once.

name: Hosted agent image

on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/hosted-agent-image.yml'
      - '.github/actions/buildx/**'
      - '.github/actions/pnpm/**'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/hosted-agent-image.yml'
      - '.github/actions/buildx/**'
      - '.github/actions/pnpm/**'

# A pull request's newer push supersedes its older run. A publish is never
# cancelled mid-push — a half-cancelled push leaves a tag naming a manifest
# whose layers were not all uploaded.
concurrency:
  group: hosted-agent-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # OCI repository names are lowercase-only (the same trap `sandbox-images.yml`
  # documents), so the org is spelled lowercase here.
  IMAGE: ghcr.io/motir-co/motir-hosted-agent
  LOCAL_TAG: motir-hosted-agent:ci

jobs:
  hosted-agent-image:
    name: Build, prove, publish
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # No run on record yet — this lane is new (MOTIR-687). The floor is set from
    # its nearest neighbour, `sandbox-images.yml`'s base job (observed 2.8–8.3
    # min), which builds a larger image than this one: 25 min, ~3x its worst.
    # Re-measure once this lane has run and replace this comment with the number.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    # The published digest, for the `pin` job. Empty on a pull request.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/buildx
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/sandbox/hosted/Dockerfile
          tags: ${{ env.LOCAL_TAG }}
          load: true
          cache-from: type=gha,scope=hosted-agent
          cache-to: type=gha,scope=hosted-agent,mode=max

      # AC2 — nothing credential-shaped is baked in. The run's credentials are
      # injected at boot (docs/decisions/hosted-agent-run.md §3–§5); a key found
      # here would be a key every run of every organization carries. The
      # patterns: an Anthropic key, a one-api / gateway `sk-` key, and every
      # GitHub token family (classic, fine-grained, app installation, user,
      # OAuth, refresh).
      - name: The image carries no credential
        run: |
          set -euo pipefail
          patterns='sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{48}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}'
          env_json="$(docker image inspect "$LOCAL_TAG" --format '{{json .Config.Env}}')"
          echo "image env: $env_json"
          if echo "$env_json" | grep -Eq "$patterns|(ANTHROPIC|OPENAI)_API_KEY|GITHUB_TOKEN|GH_TOKEN|MOTIR_RUN_KEY|MOTIR_RUN_TOKEN|MOTIR_GIT_TOKEN"; then
            echo "::error::the image's environment carries a credential or a credential variable"
            exit 1
          fi
          rootfs="$(mktemp -d)"
          cid="$(docker create "$LOCAL_TAG")"
          docker export "$cid" | tar -x -C "$rootfs" --exclude='proc/*' --exclude='sys/*' --exclude='dev/*' 2>/dev/null || true
          docker rm "$cid" >/dev/null
          # `-a`, not `-I`: a key embedded in a binary is still a key.
          # ONE exemption, by exact path: `gh` (GitHub's own CLI, from its signed
          # apt repository) carries compiled string-table runs that happen to fit
          # the token shapes — `gho_brewPATHNone…`, `github_pat_environment…` in
          # gh 2.101.0 — and no credential. Everything else is still scanned, and
          # the env and credential-file checks above and below still cover gh.
          hits="$(grep -rEal "$patterns" "$rootfs" 2>/dev/null | grep -vxF "$rootfs/usr/bin/gh" || true)"
          if [ -n "$hits" ]; then
            echo "$hits" | head -20
            echo "::error::credential-shaped strings found in the image filesystem (files listed above)"
            exit 1
          fi
          for f in auth.json .npmrc .git-credentials; do
            if find "$rootfs" -name "$f" -not -path '*/node_modules/*' | grep -q .; then
              echo "::error::the image ships a $f"
              exit 1
            fi
          done
          echo "no credential found in the image's env or filesystem"

      # AC1, AC3–AC6 — the smoke test, against the image just built. It skips its
      # image layer when MOTIR_HOSTED_AGENT_IMAGE is unset, so this is the step
      # that turns that layer on.
      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile --filter @motir/cli
        env:
          HUSKY: '0'
      - name: Smoke the image
        env:
          MOTIR_HOSTED_AGENT_IMAGE: ${{ env.LOCAL_TAG }}
        run: pnpm --filter @motir/cli exec vitest run sandbox/hosted/smoke.test.ts

      # MOTIR-7208 — the OFFLINE PROVIDER PROBE, against the image just built. The
      # smoke test drives a FAKE OpenCode, so it cannot see a provider the real
      # one fails to load. This runs the image's own `opencode` on a DeepSeek, a GLM,
      # a Qwen (MOTIR-7244) and an Anthropic model, configured only by the CLI's
      # shipped egress document,
      # against a stub gateway container on an `--internal` network — reachable,
      # and nothing else is — and checks each provider's route and run-key header
      # (motir-gateway `docs/hosted-run-egress.md` §2–§3). Before the publish, so a
      # digest that cannot load a provider is never pushed.
      - name: Probe the providers offline
        env:
          MOTIR_HOSTED_AGENT_IMAGE: ${{ env.LOCAL_TAG }}
        run: pnpm --filter @motir/cli exec vitest run sandbox/hosted/providerProbe.test.ts

      # ── Publish: a push to `main` only, and only now the image is proven. ──
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: ${{ github.event_name == 'push' }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cli/sandbox/hosted/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=hosted-agent
      - name: Print the published digest
        if: ${{ github.event_name == 'push' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "::error::the push reported no digest"
            exit 1
          fi
          echo "Published ${IMAGE}@${DIGEST}"
          {
            echo '### Hosted agent image published'
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo 'Set `MOTIR_HOSTED_AGENT_IMAGE` to this reference — a digest, never a tag.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── The pin pull request (MOTIR-10882) ─────────────────────────────────────
  #
  # The file it writes is OUTSIDE this lane's `paths:` on purpose: a pin kept
  # under `packages/cli/**` would make merging every bump publish a new image
  # and open the next bump. `hosted-agent-pin.yml` is that pull request's own
  # check: it pulls the pinned image anonymously, as an agent-runner VM does, and
  # runs this lane's smoke test and provider probe against it.
  #
  # ONE branch for every bump: a newer publish force-pushes it, so the open pull
  # request always names the newest image and an older one is never merged
  # after it. The lane's concurrency group is never cancelled on `main`, so two
  # publishes write the branch in the order they ran.
  #
  # The App token, not GITHUB_TOKEN, for the reasons `release-sandbox.yml`'s
  # `readme` job states: the automatic token cannot open a pull request here,
  # and a pull request it pushed would run no checks and could never leave the
  # merge queue.
  pin:
    name: Open the pin pull request
    needs: hosted-agent-image
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # No run on record — the job is new (MOTIR-10882). It checks out, writes one
    # line and opens a pull request: the 10-minute short-job floor, stated as a
    # floor rather than a measurement.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PIN_FILE: infra/hosted-agent-image.ref
      PIN_BRANCH: chore/hosted-agent-image-pin
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          # `main`, not this run's commit: the pull request is cut from the
          # newest main, so it carries nothing but the pin.
          ref: main
      - name: Write the published digest into the pin file
        id: write
        env:
          REFERENCE: ${{ env.IMAGE }}@${{ needs.hosted-agent-image.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$REFERENCE" =~ ^ghcr\.io/motir-co/motir-hosted-agent@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::not a pinnable image reference: '$REFERENCE'"
            exit 1
          fi
          printf '%s\n' "$REFERENCE" > "$PIN_FILE"
          if git diff --quiet -- "$PIN_FILE"; then
            echo "::notice::$PIN_FILE already pins $REFERENCE"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the pin pull request
        if: ${{ steps.write.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REFERENCE: ${{ env.IMAGE }}@${{ needs.hosted-agent-image.outputs.digest }}
          BUILT_FROM: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Authored as Yue with NO co-author trailer: motir-core's `license/cla`
          # check has that one signatory (release-sandbox.yml does the same).
          git config user.name 'Zhu Yue'
          git config user.email 'zhuyue11@gmail.com'
          title="chore(hosted-agent): pin the hosted-agent image built from ${BUILT_FROM:0:12}"
          git commit --author='Zhu Yue <zhuyue11@gmail.com>' -m "$title" \
            -m "Written by the hosted-agent image lane (MOTIR-10882): ${REFERENCE}, published from ${BUILT_FROM}." \
            -- "$PIN_FILE"
          git push --force origin "HEAD:${PIN_BRANCH}"
          body="$(printf '%s\n' \
            "Opened by the hosted-agent image lane ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})) after it proved and published \`${REFERENCE}\`, built from ${BUILT_FROM}." \
            '' \
            "Merging pins it: the next AWS deploy writes it into the \`MOTIR_HOSTED_AGENT_IMAGE\` secret before it rolls the web and worker, and every hosted run after that boots it. Reverting this pull request rolls the pin back." \
            '' \
            "The \`Hosted agent pin\` check pulls this image anonymously and runs the smoke test and the offline provider probe against it. A newer publish force-pushes this branch, so this pull request always names the newest image.")"
          existing="$(gh pr list --head "$PIN_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "::notice::Updated pin pull request #${existing} to ${REFERENCE}."
            exit 0
          fi
          gh pr create --base main --head "$PIN_BRANCH" --title "$title" --body "$body"
          echo "::notice::Opened the pin pull request for ${REFERENCE}."
