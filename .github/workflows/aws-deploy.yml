name: AWS deploy

# The AWS deploy of motir-core (Story MOTIR-9709, card MOTIR-9928;
# docs/aws-deploy.md). Every push to `main` builds the image, pushes it to ECR,
# and hands its DIGEST to `pnpm deploy:aws`, which migrates, rolls web, worker
# and relay, and records the digest only when every service completed.
#
# This is Motir's one release lane: the CI workflow's old deploy job was
# retired by MOTIR-10935. This file shares no job with the CI workflow, waits on
# nothing in it and is not triggered by it.
#
# No second migration gate: every push to `main` arrives through the merge
# queue, whose required checks already include the CI workflow's `build` job and
# its schema-drift guard.
#
# A tab left open across a release keeps working (MOTIR-11241): the image is
# built with `assetPrefix` pointing at the static-asset origin motir-infra
# publishes (MOTIR-11240), this release's `_next/static` is uploaded there and
# checked BEFORE any task rolls, and after the roll the run goes red unless the
# app loads this build from the origin and the previous release's files are
# still served (`scripts/aws-deploy/staticAssets.ts`).
#
# The release guards the retired deploy job carried live here (MOTIR-11059): the
# job refuses to build without its monitoring secrets or its Server Action salt,
# the image build uploads source maps for the release, and the run goes red if
# Sentry has no release named after this commit.
#
# No AWS key anywhere: both sessions are GitHub OIDC role assumptions, and the
# role ARNs, region and name prefix are repository VARIABLES (none is a
# credential). The job has no `environment:`, because one would change the OIDC
# subject both roles trust (`ref:refs/heads/main`).

on:
  push:
    branches: [main]
  # A manual re-run of the same commit, and the first `--no-roll` run.
  workflow_dispatch:

jobs:
  aws-deploy:
    name: Deploy to AWS
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Until the seed card sets the variables, a merge skips this job rather than
    # failing it.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    # Two merges queue; deploys of two commits never overlap, and a release is
    # never cancelled mid-flight.
    concurrency:
      group: aws-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    # The image build takes single-digit minutes; the safety check waits up to 20
    # minutes for a stack update, and the deploy script up to its default 20 for
    # the migrate task and again for the roll. 80 bounds a hang without cutting
    # off a slow-but-healthy deploy.
    timeout-minutes: 80
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_NAME_PREFIX: ${{ vars.AWS_DEPLOY_NAME_PREFIX }}
    steps:
      # ⚠️ FAIL HERE RATHER THAN SHIP A BLIND RELEASE (MOTIR-1162, MOTIR-11059).
      # Each value is a repository secret set by MOTIR-1161, and each one that is
      # missing degrades monitoring SILENTLY: an empty `NEXT_PUBLIC_SENTRY_DSN`
      # builds a browser bundle that reports nothing, an empty `SENTRY_AUTH_TOKEN`
      # ships stack traces nobody can read. Nothing errors and no check goes red,
      # so the release stops instead. It runs first, before any AWS session.
      - name: Assert the monitoring build-time secrets are present
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          missing=""
          for name in NEXT_PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing monitoring secret(s):$missing — see MOTIR-1161's provisioning record for the value and its home. Refusing to deploy an unmonitored release."
            exit 1
          fi
          echo "all four monitoring build-time secrets are present"

      # ⚠️ SAME SHAPE, DIFFERENT DAMAGE (MOTIR-3948). An unset
      # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY re-salts every Server Action id, so
      # every browser tab older than this deploy gets a 404 on every write it
      # attempts, silently, until someone reloads it. The build succeeds and the
      # release is healthy, so this release stops too.
      - name: Assert the Server Action salt is pinned
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}" ]; then
            echo "::error::Missing NEXT_SERVER_ACTIONS_ENCRYPTION_KEY — without it Next re-salts every Server Action id per build (MOTIR-3948), and every tab open across this release loses every write. Generate one with 'openssl rand -base64 32' and set it as a repository secret; it must never change afterwards."
            exit 1
          fi
          echo "the Server Action salt is pinned"

      - uses: actions/checkout@v6
      - uses: ./.github/actions/buildx
      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      # ⚠️ THE ORIGIN IS READ BEFORE THE BUILD, because `assetPrefix` is baked into
      # every HTML page and chunk reference the build emits (MOTIR-11241). The
      # deploy role reads `/<prefix>/core/static-assets`; until motir-infra's
      # core-static stack exists and `static.motir.co` answers, both outputs are
      # empty, the image is built with no prefix exactly as before, a warning says
      # so, and every static step below stands down.
      - name: Assume the deploy role to read the static-asset origin
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read the static-asset origin
        id: static
        run: pnpm --silent deploy:static target

      # The push role can push images and nothing else; the deploy role below
      # can run ECS and SSM calls and cannot push. Two steps, two sessions.
      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The repository's tags are immutable, so a re-run of a commit whose tag
      # is already pushed reads that image's digest instead of failing.
      - name: Look for this commit's image
        id: existing
        env:
          REPOSITORY: ${{ vars.AWS_DEPLOY_NAME_PREFIX }}/motir-core
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          [ "$digest" = "None" ] && digest=""
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ⚠️ THE BUILD ARGUMENTS ARE THE ONLY WAY the browser half of monitoring is
      # configured: `next build` inlines a `NEXT_PUBLIC_*` value into the client
      # bundle, and a runtime secret cannot reach it (the Dockerfile's `ARG`
      # block is the receiving end). `MOTIR_RELEASE` names the release the maps
      # are uploaded against, and `.git` is in `.dockerignore`, so the SDK's own
      # `git rev-parse` fallback finds nothing.
      #
      # `SENTRY_ORG` and `SENTRY_PROJECT` with the auth token are what turn the
      # source-map upload on (`next.config.ts`'s monitoring block). The TOKEN and
      # the Server Action salt go in as BuildKit SECRETS, never as build
      # arguments: a build argument is recorded in the image's metadata, and the
      # Dockerfile mounts each secret for the single `next build` command.
      #
      # `MOTIR_RELEASE` is also Next's `deploymentId` and `MOTIR_ASSET_PREFIX` its
      # `assetPrefix` (MOTIR-11241, `lib/build/versionSkew.ts`). `load: true` keeps
      # the image in the runner's Docker too, so the upload below copies this
      # build's `.next/static` out of it without pulling it back from ECR.
      - name: Build and push the image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_DEPLOY_NAME_PREFIX }}/motir-core:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            MOTIR_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            MOTIR_ASSET_PREFIX=${{ steps.static.outputs.url }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

      # ⚠️ THE DEPLOY IS HANDED THE DIGEST ECR TAGS WITH THIS COMMIT, never the
      # push result's `digest` and never a tag (MOTIR-11274). With `load: true` the
      # action's `digest` output is the untagged linux/amd64 CHILD of the image
      # index it pushes under `$GITHUB_SHA`; deployed, ECS runs an image with no
      # commit tag and the Services page cannot name the commit (MOTIR-11112).
      # So the digest is read back from ECR by the tag, for a fresh push and a
      # re-run alike, and nothing deploys unless it is well formed and ECR lists
      # `$GITHUB_SHA` among its tags. `deploy:aws --commit` checks the same again.
      - name: Resolve the digest ECR tags with this commit
        id: digest
        env:
          REPOSITORY: ${{ vars.AWS_DEPLOY_NAME_PREFIX }}/motir-core
          PUSHED: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          if ! [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::no image in $REPOSITORY is tagged $GITHUB_SHA (read '$digest')"
            exit 1
          fi
          tags="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids "imageDigest=$digest" \
            --query 'imageDetails[0].imageTags' --output text)"
          if ! tr '\t' '\n' <<<"$tags" | grep -qxF "$GITHUB_SHA"; then
            echo "::error::$digest carries no tag $GITHUB_SHA (its tags: $tags); refusing to deploy it"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### AWS deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$digest\` (tagged \`$GITHUB_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PUSHED" ] && [ "$PUSHED" != "$digest" ]; then
            echo "The push reported \`$PUSHED\`, a child of the tagged index; it is not deployed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ⚠️ UPLOAD BEFORE ANY TASK ROLLS, NEVER `--delete` (MOTIR-11241). A tab
      # loaded from an earlier release keeps asking the origin for that release's
      # files; the bucket's lifecycle rule, not a deploy, expires them. Copying
      # the files out of the image (the runner's `/app/.next/static`) uploads
      # exactly what the HTML will name. A re-run of a commit whose image was
      # already pushed pulls that image by digest and uploads again, which is
      # idempotent: every file is named by its content hash.
      - name: Upload this release's static files to the origin
        if: steps.static.outputs.url != ''
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_DEPLOY_NAME_PREFIX }}/motir-core
          DIGEST: ${{ steps.digest.outputs.digest }}
          BUCKET: ${{ steps.static.outputs.bucket }}
        run: |
          set -euo pipefail
          image="$REPOSITORY:$GITHUB_SHA"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            image="$REPOSITORY@$DIGEST"
            docker pull --quiet "$image"
          fi
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          rm -rf "$RUNNER_TEMP/release-static"
          docker cp "$cid:/app/.next/static" "$RUNNER_TEMP/release-static"
          count="$(find "$RUNNER_TEMP/release-static" -type f | wc -l)"
          aws s3 cp "$RUNNER_TEMP/release-static" "s3://$BUCKET/_next/static/" \
            --recursive --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          echo "Static files: $count uploaded to \`s3://$BUCKET/_next/static/\`" >> "$GITHUB_STEP_SUMMARY"

      # A missing CNAME, a CORS rule or a cache header that is not there fails
      # HERE, while the old tasks still serve — not after the roll, when every
      # page would name files nobody can load.
      - name: Check the origin serves this release's files
        if: steps.static.outputs.url != ''
        env:
          STATIC_URL: ${{ steps.static.outputs.url }}
        run: pnpm --silent deploy:static verify-upload --url "$STATIC_URL" --dir "$RUNNER_TEMP/release-static"

      # One file the LIVE release loads from the origin, read before this run can
      # replace it, for the post-roll check below. Empty while the live release
      # still serves its own files (the first release after the switch). Deploys
      # are serialised by the concurrency group, so nothing else replaces it
      # between here and the roll.
      - name: Note the live release's static file
        id: previous
        if: steps.static.outputs.url != ''
        env:
          STATIC_URL: ${{ steps.static.outputs.url }}
        run: pnpm --silent deploy:static capture-previous --url "$STATIC_URL"

      # Waits out a motir-infra update of the services stack, and stands down if
      # this commit is no longer main's newest (MOTIR-10436, docs/aws-deploy.md).
      - name: Check it is safe to roll
        id: gate
        env:
          DEPLOY_STACKS: ${{ vars.AWS_DEPLOY_NAME_PREFIX }}-services
        run: bash scripts/aws-deploy/deploy-gate.sh

      # A fresh session for the roll: the role's sessions last an hour, and the
      # check above may have spent 20 minutes of the first one waiting.
      - name: Assume the deploy role again
        if: steps.gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # `--no-roll` only while `AWS_DEPLOY_NO_ROLL` is `true`: the first run,
      # before the services exist (docs/aws-deploy.md, The first run).
      #
      # `--pins` writes each image pin in `infra/image-pins/` into its secret
      # after the migrate task and before the roll, so the tasks the roll starts
      # read it (MOTIR-10883). The checkout is this commit, so a merged bump pull
      # request is applied by its own deploy, and a revert by the revert's.
      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          NO_ROLL: ${{ vars.AWS_DEPLOY_NO_ROLL == 'true' && '--no-roll' || '' }}
        run: |
          set -euo pipefail
          pnpm --silent deploy:aws --digest "$DIGEST" --commit "$GITHUB_SHA" $NO_ROLL --pins infra/image-pins \
            | tee /tmp/aws-deploy.json
          {
            echo "Result:"
            echo '```json'
            tail -n 1 /tmp/aws-deploy.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ THE TAB-ACROSS-A-DEPLOY PROMISE, PROVED ON THE LIVE APP (MOTIR-11241).
      # Red unless app.motir.co's HTML loads THIS build's files from the origin,
      # and the previous release's file noted before the roll still answers 200
      # there. Only when this run rolled.
      - name: Assert the app loads this release from the static origin
        if: steps.gate.outputs.deploy == 'true' && steps.static.outputs.url != '' && vars.AWS_DEPLOY_NO_ROLL != 'true'
        env:
          STATIC_URL: ${{ steps.static.outputs.url }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          pnpm --silent deploy:static verify-release --url "$STATIC_URL" \
            --dir "$RUNNER_TEMP/release-static" --previous "$PREVIOUS"

      # ⚠️ "CONFIGURED" IS NOT "RAN" (MOTIR-2403: `outputFileTracingExcludes` is a
      # `next.config` key Turbopack never read, and it read as solved for months).
      # `@sentry/nextjs`'s Turbopack path creates the release inside the same
      # `runAfterProductionCompile` hook that uploads the maps, so a release named
      # after this commit is positive evidence the upload ran with a working
      # token, and its absence is the regression (a hook that stopped running, an
      # expired token) that would otherwise surface as unreadable stack traces
      # during an incident.
      #
      # It runs after the roll, as the retired deploy job's did, so an outage of Sentry's
      # API turns the run red without holding a release back. It runs whether or
      # not the roll was gated, and on a re-run that reused the pushed image,
      # because the release belongs to the image this run deploys.
      - name: Assert Sentry received this release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 3 --max-time 30 -o /tmp/sentry-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/releases/$GITHUB_SHA/" || true)
          echo "GET releases/$GITHUB_SHA → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Sentry has no release named $GITHUB_SHA. The source-map upload did not run — stack traces from this deploy will not be symbolicated. See next.config.ts's monitoring block for how the Turbopack upload path is wired."
            exit 1
          fi
          head -c 400 /tmp/sentry-release.json; echo
          echo "Sentry release: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
