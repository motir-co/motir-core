name: AWS deploy

# The AWS deploy of motir-core (Story MOTIR-9709, card MOTIR-9928;
# docs/aws-deploy.md). Every push to `main` builds the image, pushes it to ECR,
# and hands its DIGEST to `pnpm deploy:aws`, which migrates, rolls web, worker
# and relay, and records the digest only when every service completed.
#
# This is Motir's one release lane: the Fly deploy job of the CI workflow was
# retired by MOTIR-10935. This file shares no job with the CI workflow, waits on
# nothing in it and is not triggered by it.
#
# No second migration gate: every push to `main` arrives through the merge
# queue, whose required checks already include the CI workflow's `build` job and
# its schema-drift guard.
#
# The release guards the retired Fly job carried live here (MOTIR-11059): the
# job refuses to build without its monitoring secrets or its Server Action salt,
# the image build uploads source maps for the release, and the run goes red if
# Sentry has no release named after this commit.
#
# No AWS key anywhere: both sessions are GitHub OIDC role assumptions, and the
# role ARNs, region and name prefix are repository VARIABLES (none is a
# credential). The job has no `environment:`, because one would change the OIDC
# subject both roles trust (`ref:refs/heads/main`).

on:
  push:
    branches: [main]
  # A manual re-run of the same commit, and the first `--no-roll` run.
  workflow_dispatch:

jobs:
  aws-deploy:
    name: Deploy to AWS
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Until the seed card sets the variables, a merge skips this job rather than
    # failing it.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    # Two merges queue; deploys of two commits never overlap, and a release is
    # never cancelled mid-flight.
    concurrency:
      group: aws-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    # The image build takes single-digit minutes; the safety check waits up to 20
    # minutes for a stack update, and the deploy script up to its default 20 for
    # the migrate task and again for the roll. 80 bounds a hang without cutting
    # off a slow-but-healthy deploy.
    timeout-minutes: 80
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_NAME_PREFIX: ${{ vars.AWS_DEPLOY_NAME_PREFIX }}
    steps:
      # ⚠️ FAIL HERE RATHER THAN SHIP A BLIND RELEASE (MOTIR-1162, MOTIR-11059).
      # Each value is a repository secret set by MOTIR-1161, and each one that is
      # missing degrades monitoring SILENTLY: an empty `NEXT_PUBLIC_SENTRY_DSN`
      # builds a browser bundle that reports nothing, an empty `SENTRY_AUTH_TOKEN`
      # ships stack traces nobody can read. Nothing errors and no check goes red,
      # so the release stops instead. It runs first, before any AWS session.
      - name: Assert the monitoring build-time secrets are present
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          missing=""
          for name in NEXT_PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing monitoring secret(s):$missing — see MOTIR-1161's provisioning record for the value and its home. Refusing to deploy an unmonitored release."
            exit 1
          fi
          echo "all four monitoring build-time secrets are present"

      # ⚠️ SAME SHAPE, DIFFERENT DAMAGE (MOTIR-3948). An unset
      # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY re-salts every Server Action id, so
      # every browser tab older than this deploy gets a 404 on every write it
      # attempts, silently, until someone reloads it. The build succeeds and the
      # release is healthy, so this release stops too.
      - name: Assert the Server Action salt is pinned
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}" ]; then
            echo "::error::Missing NEXT_SERVER_ACTIONS_ENCRYPTION_KEY — without it Next re-salts every Server Action id per build (MOTIR-3948), and every tab open across this release loses every write. Generate one with 'openssl rand -base64 32' and set it as a repository secret; it must never change afterwards."
            exit 1
          fi
          echo "the Server Action salt is pinned"

      - uses: actions/checkout@v6
      - uses: ./.github/actions/buildx

      # The push role can push images and nothing else; the deploy role below
      # can run ECS and SSM calls and cannot push. Two steps, two sessions.
      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The repository's tags are immutable, so a re-run of a commit whose tag
      # is already pushed reads that image's digest instead of failing.
      - name: Look for this commit's image
        id: existing
        env:
          REPOSITORY: ${{ vars.AWS_DEPLOY_NAME_PREFIX }}/motir-core
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          [ "$digest" = "None" ] && digest=""
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ⚠️ THE BUILD ARGUMENTS ARE THE ONLY WAY the browser half of monitoring is
      # configured: `next build` inlines a `NEXT_PUBLIC_*` value into the client
      # bundle, and a runtime secret cannot reach it (the Dockerfile's `ARG`
      # block is the receiving end). `MOTIR_RELEASE` names the release the maps
      # are uploaded against, and `.git` is in `.dockerignore`, so the SDK's own
      # `git rev-parse` fallback finds nothing.
      #
      # `SENTRY_ORG` and `SENTRY_PROJECT` with the auth token are what turn the
      # source-map upload on (`next.config.ts`'s monitoring block). The TOKEN and
      # the Server Action salt go in as BuildKit SECRETS, never as build
      # arguments: a build argument is recorded in the image's metadata, and the
      # Dockerfile mounts each secret for the single `next build` command.
      - name: Build and push the image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_DEPLOY_NAME_PREFIX }}/motir-core:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            MOTIR_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

      # The deploy is handed the digest from the push result (or the existing
      # image), never a tag, and nothing deploys unless it is well formed.
      - name: Take the pushed digest
        id: digest
        env:
          PUSHED: ${{ steps.build.outputs.digest }}
          EXISTING: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${PUSHED:-$EXISTING}"
          if ! [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::not an image digest: '$digest'"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### AWS deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      # Waits out a motir-infra update of the services stack, and stands down if
      # this commit is no longer main's newest (MOTIR-10436, docs/aws-deploy.md).
      - name: Check it is safe to roll
        id: gate
        env:
          DEPLOY_STACKS: ${{ vars.AWS_DEPLOY_NAME_PREFIX }}-services
        run: bash scripts/aws-deploy/deploy-gate.sh

      # A fresh session for the roll: the role's sessions last an hour, and the
      # check above may have spent 20 minutes of the first one waiting.
      - name: Assume the deploy role again
        if: steps.gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # `--no-roll` only while `AWS_DEPLOY_NO_ROLL` is `true`: the first run,
      # before the services exist (docs/aws-deploy.md, The first run).
      #
      # `--pins` writes each image pin in `infra/image-pins/` into its secret
      # after the migrate task and before the roll, so the tasks the roll starts
      # read it (MOTIR-10883). The checkout is this commit, so a merged bump pull
      # request is applied by its own deploy, and a revert by the revert's.
      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          NO_ROLL: ${{ vars.AWS_DEPLOY_NO_ROLL == 'true' && '--no-roll' || '' }}
        run: |
          set -euo pipefail
          pnpm --silent deploy:aws --digest "$DIGEST" $NO_ROLL --pins infra/image-pins | tee /tmp/aws-deploy.json
          {
            echo "Result:"
            echo '```json'
            tail -n 1 /tmp/aws-deploy.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ "CONFIGURED" IS NOT "RAN" (MOTIR-2403: `outputFileTracingExcludes` is a
      # `next.config` key Turbopack never read, and it read as solved for months).
      # `@sentry/nextjs`'s Turbopack path creates the release inside the same
      # `runAfterProductionCompile` hook that uploads the maps, so a release named
      # after this commit is positive evidence the upload ran with a working
      # token, and its absence is the regression (a hook that stopped running, an
      # expired token) that would otherwise surface as unreadable stack traces
      # during an incident.
      #
      # It runs after the roll, as the Fly job's did, so an outage of Sentry's
      # API turns the run red without holding a release back. It runs whether or
      # not the roll was gated, and on a re-run that reused the pushed image,
      # because the release belongs to the image this run deploys.
      - name: Assert Sentry received this release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 3 --max-time 30 -o /tmp/sentry-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/releases/$GITHUB_SHA/" || true)
          echo "GET releases/$GITHUB_SHA → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Sentry has no release named $GITHUB_SHA. The source-map upload did not run — stack traces from this deploy will not be symbolicated. See next.config.ts's monitoring block for how the Turbopack upload path is wired."
            exit 1
          fi
          head -c 400 /tmp/sentry-release.json; echo
          echo "Sentry release: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
