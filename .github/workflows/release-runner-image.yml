# Publishes the Motir CI runner image to GHCR (MOTIR-1978).
#
# Trigger: push the package-scoped tag `runner-v<x.y.z>`. A monorepo must scope
# its release tags per package (`cli-v*` and `design-system-v*` are the existing
# precedents); a bare `v*` would fire for the app too.
#
# There is deliberately NO push-to-main trigger. The fleet consumes a DIGEST
# (§7.2), so an image that re-published on every merge would produce a stream of
# digests nobody pinned and would not change what the deployment boots anyway —
# `MOTIR_RUNNER_IMAGE` moves only when the pin pull request this lane opens is
# merged (MOTIR-10883, the `pin` job below).
#
# ⚠️ A tag-triggered lane replays the TAG'S tree, not `main`. A fix pushed to
# `main` after a red release does nothing until the tag MOVES:
#   git tag -f runner-v<x.y.z> <fixed-sha> && git push -f origin runner-v<x.y.z>
#
# Release procedure:
#   1. merge the change to the image
#   2. git tag runner-v<x.y.z> && git push origin runner-v<x.y.z>
#   3. this workflow builds, asserts, proves, publishes, then pulls the image
#      back BY DIGEST and re-asserts it
#   4. the `pin` job opens (or updates) ONE pull request that writes the
#      published reference into `infra/image-pins/motir-runner-image`
#      (MOTIR-10883). Merging it is the deliberate pin; the AWS deploy of that
#      merge writes it into `motir/core/motir-runner-image` before it rolls the
#      services (`infra/image-pins/README.md`).
#
# Step 4 used to be a person copying the digest out of the job summary into the
# secret, one manual card per release (MOTIR-8719). It lapsed for two releases
# (runner-v0.2.5 and v0.2.6), and the daily health check was red for days.
#
# Skipping step 2 after a merged image change, or leaving step 4's pull request
# unmerged, is what the daily health check's `runner-image-freshness` step
# reports (MOTIR-10393): it fails while the pinned image was built from a commit
# without the newest change to an input in `lib/ciFleet/runnerImageSources.ts`,
# naming both commits.
#
# `workflow_dispatch` with `dry_run: true` runs the whole lane WITHOUT pushing —
# how you validate a change to the release path without minting a version.

name: Release runner image

on:
  push:
    tags:
      - 'runner-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + assert + prove only; skip the GHCR push'
        type: boolean
        default: false
      # PUBLISH LATEST from the console's Fleet status page (MOTIR-10886): pin a
      # release this lane ALREADY published. With `pin_digest` set nothing is
      # built or pushed; only the `pin` job runs, and it queues its pull request
      # to merge, because the press is the deliberate pin.
      pin_digest:
        description: 'Pin this already-published digest (sha256:<64 hex>) instead of releasing'
        type: string
        required: false
        default: ''
      pin_version:
        description: 'The runner-v* version that digest was released as (x.y.z), with pin_digest'
        type: string
        required: false
        default: ''

# Never let two releases of the same tag run concurrently, and never cancel one
# in flight — a half-cancelled push leaves a tag pointing at a manifest whose
# layers were never all uploaded.
concurrency:
  group: release-runner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the version
    # A pin dispatch releases nothing, so it resolves no version either.
    if: ${{ !inputs.pin_digest }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # Observed 0.05 min on run 30761169237 → 10 (the short-job floor). It runs
    # one `jq` over `package.json` and writes an output; the floor is entirely
    # what bounds it.
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # On a tag push the ref is `runner-v1.2.3`; on workflow_dispatch it is
          # a branch name, which has no version in it — `dispatch` keeps the tag
          # well-formed for a dry run that never pushes anyway.
          if [[ "${REF_NAME}" =~ ^runner-v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dispatch" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Runner image
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runner-image.yml
    with:
      publish: ${{ github.event_name == 'push' || !inputs.dry_run }}
      version: ${{ needs.version.outputs.version }}

  # ── The pin pull request (MOTIR-10883) ───────────────────────────────────────
  #
  # Writes the reference the release just published, pulled back and re-asserted
  # by digest, into the one file production's `MOTIR_RUNNER_IMAGE` is deployed
  # from, and opens it as a pull request. It does not set the secret: the AWS
  # deploy of the merge does, so what production boots changes only on a merge.
  #
  # ⚠️ THE APP TOKEN, NOT `GITHUB_TOKEN`, for the reasons `release-sandbox.yml`'s
  # `readme` job records: the automatic token may not open a pull request here,
  # and a branch it pushed would run no checks, so the pull request could never
  # leave the merge queue. The App's pull request is a bot's, which the Motir
  # work-item link check exempts.
  #
  # ⚠️ ONE BRANCH FOR EVERY RELEASE. A newer tag force-pushes the same branch,
  # so an unmerged pin is replaced by the newer one rather than left beside it.
  pin:
    name: Open the pin pull request
    needs: [version, release]
    # After a tag's release, or on a Publish latest pin dispatch (both jobs above
    # are skipped then, so `!cancelled()` keeps this one from being skipped with
    # them). A dry run publishes nothing, so there is no reference to pin.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.pin_digest != '')
      ) }}
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    # NO run on record — the job is new. A checkout of `main`, one file write and
    # a pull-request call: the 10-minute short-job floor, stated as a floor.
    timeout-minutes: 10
    # Two tags released close together must not push the branch at once.
    concurrency:
      group: runner-image-pin
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          # `main`, NOT the tag: the pin belongs on the branch, and writing the
          # tag's tree would revert whatever `main` has learned since.
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Write the published reference into the pin
        id: write
        env:
          DIGEST: ${{ inputs.pin_digest || needs.release.outputs.digest }}
          VERSION: ${{ inputs.pin_version || needs.version.outputs.version }}
          IMAGE: ghcr.io/motir-co/motir-ci-runner
          PIN: infra/image-pins/motir-runner-image
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::the release published no digest ('${DIGEST}'), so there is nothing to pin."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${VERSION}' is not a runner-v* release version (x.y.z)."
            exit 1
          fi
          ref="${IMAGE}@${DIGEST}"
          printf '%s\n' "$ref" > "$PIN"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "$PIN"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PIN} already holds ${ref}; no pull request to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the pin pull request
        if: ${{ steps.write.outputs.changed == 'true' }}
        env:
          VERSION: ${{ inputs.pin_version || needs.version.outputs.version }}
          REF: ${{ steps.write.outputs.ref }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PIN: infra/image-pins/motir-runner-image
        run: |
          set -euo pipefail
          # Authored as Yue with NO co-author trailer: `license/cla` has that one
          # signatory, the same authorship every other commit here carries.
          git config user.name 'Zhu Yue'
          git config user.email 'zhuyue11@gmail.com'
          title="chore(ci-runner): pin MOTIR_RUNNER_IMAGE to runner-v${VERSION}"
          git commit --author='Zhu Yue <zhuyue11@gmail.com>' -m "$title" \
            -m "Written by the runner image release lane (MOTIR-10883) from the digest runner-v${VERSION} published and pulled back: ${REF}" \
            -- "$PIN"
          # Force is confined to this branch, which holds only the pin and was
          # just rebuilt from a fresh checkout of main.
          branch='chore/runner-image-pin'
          git push --force origin "HEAD:${branch}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf '%s\n' \
            "Opened by the runner image release lane for \`runner-v${VERSION}\` ([run](${run_url}))." \
            '' \
            "It sets \`${PIN}\` to \`${REF}\`, the digest the release published and then pulled back and re-asserted." \
            '' \
            "**Merging it is the pin.** The AWS deploy of the merge writes the reference into \`motir/core/motir-runner-image\` before it rolls web, worker and relay (\`infra/image-pins/README.md\`). Reverting it rolls the pin back.")"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "::notice::Updated pull request #${existing} to pin runner-v${VERSION}."
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
          echo "::notice::Opened the pull request that pins runner-v${VERSION}."
      # Publish latest is the deliberate pin (MOTIR-10886): the superadmin who
      # pressed it confirmed the from → to and the roll, so the pin pull request
      # is queued to merge as soon as its checks pass. A refused queue fails the
      # run, so the page reports the error instead of a pin that never lands.
      - name: Queue the pin pull request to merge
        if: ${{ github.event_name == 'workflow_dispatch' && steps.write.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          number="$(gh pr list --head chore/runner-image-pin --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "::error::no open pin pull request on chore/runner-image-pin to queue"
            exit 1
          fi
          gh pr merge "$number" --auto
          echo "::notice::Queued pin pull request #${number} to merge."
